[advisories]
version = 2
yanked = "deny"
# These versions match RustSec ranges, but their exact crates.io source and
# minimal upstream security backports are verified before every advisory scan
# by scripts/check-rust-dependencies.sh. They are not accepted as vulnerable
# upstream artifacts; Debian 13's Rust 1.85 cannot compile their fixed releases.
ignore = [
  "RUSTSEC-2026-0009",
  "RUSTSEC-2026-0118",
  "RUSTSEC-2026-0119",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # cargo-deny 0.18.3 parses SPDX License List 3.11 identifiers here; its deprecated alias
  # matches the crate metadata's precise GPL-3.0-only expression without changing that metadata.
  "GPL-3.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  # Fuzz-only libfuzzer-sys combines LLVM Apache/MIT terms with the NCSA license.
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []


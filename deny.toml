[advisories]
version = 2
yanked = "deny"
ignore = [
  # Root-only public RSA exception: scripts/check-public-rsa-scope.py must pass.
  # RUSTSEC-2023-0071 stays denied here and in fuzz. The mandatory dependency
  # script injects it only into a temporary root config after source/graph checks.
  # This is non-applicability of private-key timing leakage, NOT an upstream fix.
  # Transitive netlink-packet-core 0.8.2 deliberately treats paste as finished rather than
  # vulnerable; there is no security defect or compatible maintained replacement in its line.
  "RUSTSEC-2024-0436",
  # These versions match RustSec ranges, but their exact crates.io source and minimal upstream
  # security backports are verified before every scan by scripts/check-rust-dependencies.sh.
  # They are not accepted as vulnerable upstream artifacts. These validated backports
  # were introduced for Debian 13 Rust 1.85 and remain in the minimal F04 update;
  # the current Rust 1.89 profile does not bypass their mandatory reconstruction checks.
  "RUSTSEC-2026-0009",
  "RUSTSEC-2026-0118",
  "RUSTSEC-2026-0119",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MPL-2.0",
  # Fuzz-only libfuzzer-sys combines LLVM Apache/MIT terms with the NCSA license.
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Reference signature verifier only; Cargo.toml pins the complete revision.
allow-git = ["https://github.com/virtee/sev"]

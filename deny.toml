[advisories]
version = 2
yanked = "deny"
ignore = [
  # Transitive netlink-packet-core 0.8.2 deliberately treats paste as finished rather than
  # vulnerable; there is no security defect or compatible maintained replacement in its line.
  "RUSTSEC-2024-0436",
  # These versions match RustSec ranges, but their exact crates.io source and minimal upstream
  # security backports are verified before every scan by scripts/check-rust-dependencies.sh.
  # They are not accepted as vulnerable upstream artifacts; Debian 13's Rust 1.85 cannot compile
  # their fixed releases.
  "RUSTSEC-2026-0009",
  "RUSTSEC-2026-0118",
  "RUSTSEC-2026-0119",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MPL-2.0",
  # Fuzz-only libfuzzer-sys combines LLVM Apache/MIT terms with the NCSA license.
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

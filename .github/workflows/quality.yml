name: Storage evidence source replay
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  archived-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify all 27 original receipt bytes against the three actual PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show 6ff38acf80553ddb15f089ccfef33f602b11dcc9:scripts/check-storage-evidence-pr.py > "$RUNNER_TEMP/checker.py"
          python3 -I -B - <<'PY'
          import json, os, pathlib, subprocess, sys, time
          repo = 'VOLPAROSSA/volparossa'
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for number, commit in [(407,'12053f931fec486db2d12400a87761c79ae0801b'),(416,'7fe73bf18d8f8f0d5b1096d4fd6485c3315a6e69'),(426,'a155a4152c514867d45c2a1ff344a943e3cabfcf')]:
              start = time.monotonic()
              pr = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/pulls/{number}']))
              assert pr['merge_commit_sha'] == commit and pr['commits'] == 1 and pr['changed_files'] == 10 and pr['base']['ref'] == 'main'
              subprocess.run(['git','fetch','--depth=3','origin',commit],check=True)
              subprocess.run(['git','checkout','-q','--detach',commit],check=True)
              parents = subprocess.check_output(['git','show','-s','--format=%P','HEAD'],text=True).split()
              assert parents[1] == pr['head']['sha']
              pr['base']['sha'] = parents[0]
              event = root / 'replay.json'
              event.write_text(json.dumps({'pull_request':pr,'repository':{'full_name':repo}}))
              output = subprocess.check_output([sys.executable,'-I','-B',root/'checker.py'], env=os.environ|{'GITHUB_SHA':commit,'GITHUB_EVENT_PATH':str(event)},text=True).strip()
              print(json.dumps(dict(pr=number,route=output,merged_commit=commit,elapsed_seconds=round(time.monotonic()-start,2))),flush=True)
              assert output == 'verified'
          PY

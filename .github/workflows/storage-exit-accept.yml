name: Storage shared MPTCP listener rejection

on:
  push:
    branches: [fix/mptcp-exit-stream-rejection]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-exit-accept-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  FIREWALL_NORMALIZER: |
    BEGIN {
      ctime = "(Sun|Mon|Tue|Wed|Thu|Fri|Sat) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) ( [1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] [0-9][0-9][0-9][0-9]"
    }
    {
      quoted = 0
      escaped = 0
      for (i = 1; i <= length($0); i++) {
        character = substr($0, i, 1)
        if (escaped) { escaped = 0; continue }
        if (character == "\\") { escaped = 1; continue }
        if (character == "\"") quoted = !quoted
      }
      # Refuse multiline/unterminated quoted rules, rather than accidentally
      # treating embedded comment text as a producer timestamp or chain row.
      if (quoted || escaped) exit 1
    }
    $0 ~ ("^# Generated by ip(6)?tables-save v[0-9][0-9A-Za-z.+:~_-]*( \\(nf_tables\\))? on " ctime "$") {
      sub(/ on .*$/, " on [timestamp]")
    }
    $0 ~ ("^# Completed on " ctime "$") {
      $0 = "# Completed on [timestamp]"
    }
    /^:[-A-Za-z0-9_.+]+ (ACCEPT|DROP|-) \[[0-9]+:[0-9]+\]$/ {
      sub(/ \[[0-9]+:[0-9]+\]$/, " [counters]")
    }
    { print }

jobs:
  acceptance:
    if: github.repository == 'VOLPAROSSA/volparossa' && github.ref == 'refs/heads/fix/mptcp-exit-stream-rejection'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the exact candidate and unchanged dependencies
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor fc75a42d0c458472dc3aeee28311b4e9003803e9 HEAD
          git diff --exit-code fc75a42d0c458472dc3aeee28311b4e9003803e9 HEAD -- Cargo.toml Cargo.lock rust-toolchain.toml
          mkdir listener-evidence
          git rev-parse HEAD 'HEAD^{tree}' | tee listener-evidence/source.txt
          git diff --name-only fc75a42d0c458472dc3aeee28311b4e9003803e9 HEAD | tee listener-evidence/changed.txt
          python3 -B - <<'PY'
          import json
          import pathlib
          import subprocess
          expected = {'.github/workflows/storage-exit-accept.yml',
              'crates/volparossa-mptcp/src/socket.rs', 'crates/volparossa-mptcp/src/lib.rs',
              'crates/volparossa-agent/src/mptcp_flow_runtime.rs'}
          assert set(pathlib.Path('listener-evidence/changed.txt').read_text().splitlines()) == expected
          blobs = {name: subprocess.check_output(['git', 'rev-parse', 'HEAD:' + name], text=True).strip()
              for name in sorted(expected)}
          pathlib.Path('listener-evidence/blobs.json').write_text(json.dumps(blobs, sort_keys=True) + '\n')
          PY

      - name: Prepare pinned compiler on the disposable runner
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
          sudo -n apt-get update
          sudo -n apt-get install --yes --no-install-recommends protobuf-compiler=3.21.12-8.2ubuntu0.3
          test "$(protoc --version)" = 'libprotoc 3.21.12'
          cargo fetch --locked

      - name: Check exact source formatting
        run: cargo fmt --all -- --check

      - name: Prove firewall normalization retains configuration changes
        run: |
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          def normalize(text):
              return subprocess.check_output(['awk', os.environ['FIREWALL_NORMALIZER']],
                  input=text.encode(), env={**os.environ, 'LC_ALL': 'C'})
          checked = 0
          for program in ['iptables-save', 'ip6tables-save']:
              for backend in ['', ' (nf_tables)']:
                  before = (f'# Generated by {program} v1.8.10{backend} on Thu Oct 15 10:10:10 2026\n'
                      '*filter\n:INPUT ACCEPT [1:2]\n:custom-chain - [3:4]\n'
                      '-A INPUT -m comment --comment "semantic [1:2]" -j custom-chain\n'
                      'COMMIT\n# Completed on Thu Oct 15 10:10:10 2026\n')
                  after = before.replace('10:10:10', '11:11:11').replace('ACCEPT [1:2]',
                      'ACCEPT [99:100]').replace('- [3:4]', '- [101:102]')
                  assert normalize(before) == normalize(after)
                  checked += 1
                  for old, new in [('ACCEPT', 'DROP'), ('custom-chain', 'other-chain'),
                      ('semantic [1:2]', 'semantic [9:10]'), ('*filter', '*nat'),
                      ('v1.8.10', 'v1.8.11'), ('COMMIT\n', ''),
                      ('v1.8.10' + backend, 'v1.8.10 (legacy)'),
                      ('10:10:10', 'unrecognized-timestamp')]:
                      assert normalize(before) != normalize(before.replace(old, new))
                      checked += 1
                  for embedded in ['# Completed on Thu Oct 15 10:10:10 2026',
                      ':INPUT ACCEPT [1:2]', f'# Generated by {program} v1.8.10{backend} on Thu Oct 15 10:10:10 2026']:
                      multiline = before.replace('semantic [1:2]', 'first\n' + embedded + '\nlast')
                      try:
                          normalize(multiline)
                      except subprocess.CalledProcessError:
                          pass
                      else:
                          raise AssertionError('multiline rule must fail closed')
                      checked += 1
          assert checked == 48
          pathlib.Path('listener-evidence/firewall-normalizer.json').write_text(json.dumps(
              dict(checks=checked, passed=True, scope='inert-normalizer-fixtures',
                  ignored_fields=['recognized-producer-timestamps', 'chain-traffic-counters']),
              sort_keys=True) + '\n')
          PY

      - name: Verify socket rejection and production exit event-loop contracts
        run: |
          set -euo pipefail
          cargo test --locked --offline -p volparossa-mptcp --lib socket::tests:: -- --nocapture 2>&1 | tee listener-evidence/socket.log
          cargo test --locked --offline -p volparossa-agent --lib mptcp_flow_runtime::tests:: -- --nocapture 2>&1 | tee listener-evidence/runtime.log
          cargo test --locked --offline -p volparossa-mptcp --lib --no-run --message-format=json > listener-evidence/artifacts.jsonl

      - name: Prove old and new genuine MPTCP streams survive rejection in a disposable namespace
        run: |
          set -euo pipefail
          binary=$(python3 -B - <<'PY'
          import json
          import pathlib
          rows = [json.loads(line) for line in pathlib.Path('listener-evidence/artifacts.jsonl').read_text().splitlines()]
          matches = [row['executable'] for row in rows if row.get('reason') == 'compiler-artifact'
              and row.get('target', {}).get('name') == 'volparossa_mptcp'
              and row.get('profile', {}).get('test') and row.get('executable')]
          assert len(matches) == 1
          executable = pathlib.Path(matches[0])
          assert executable.is_file() and executable.is_relative_to(pathlib.Path.cwd() / 'target')
          print(executable)
          PY
          )
          parent_namespace=$(readlink /proc/self/ns/net)
          snapshot() {
            ip -4 -j route show table all | sha256sum
            ip -6 -j route show table all | sha256sum
            sha256sum /etc/resolv.conf
            sudo -n env LC_ALL=C iptables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
            sudo -n env LC_ALL=C ip6tables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
          }
          snapshot > listener-evidence/host-before.sha256
          printf '%s\n' 'Creates one disposable network namespace, enables only its loopback, runs the exact compiled test, and removes the namespace when its processes exit. No host DNS, firewall, routes or sysctls are changed.'
          sudo -n unshare --net -- bash -c '
            set -euo pipefail
            trap "exit 130" INT
            trap "exit 143" TERM
            test "$(readlink /proc/self/ns/net)" != "$1"
            ip link set lo up
            test "$(cat /proc/sys/net/mptcp/enabled)" = 1
            exec timeout --kill-after=5s 20s "$2" --ignored --exact socket::tests::kernel_mptcp_rejection_preserves_existing_and_next_streams --nocapture
          ' bash "$parent_namespace" "$binary" 2>&1 | tee listener-evidence/kernel.log
          test "$(readlink /proc/self/ns/net)" = "$parent_namespace"

      - name: Require every intended test, not just a successful empty filter
        run: |
          python3 -B - <<'PY'
          import pathlib
          import re
          import json
          root = pathlib.Path('listener-evidence')
          all_passed = []
          for group, passed, ignored in [('socket', 5, 1), ('runtime', 11, 0), ('kernel', 1, 0)]:
              text = (root / (group + '.log')).read_text()
              summaries = re.findall(r'^test result: ok\. (\d+) passed; 0 failed; (\d+) ignored;', text, re.M)
              assert summaries == [(str(passed), str(ignored))], (group, summaries)
              names = re.findall(r'^test ([^\n]+) \.\.\. ok$', text, re.M)
              assert len(names) == len(set(names)) == passed
              all_passed.extend(names)
          assert len(all_passed) == len(set(all_passed)) == 17
          record = dict(unique_passing_tests=17, new_tests=5, test_names=sorted(all_passed),
              scope='source-contracts-and-isolated-kernel-listener',
              full_storage_acceptance=False, storage_failure_causality_proven=False)
          (root / 'tests.json').write_text(json.dumps(record, sort_keys=True) + '\n')
          PY

      - name: Lint the changed packages and tests
        run: cargo clippy --locked --offline -p volparossa-mptcp -p volparossa-agent --lib --tests -- -D warnings

      - name: Verify source and host configuration remain unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
          if test -f listener-evidence/host-before.sha256; then
            {
              ip -4 -j route show table all | sha256sum
              ip -6 -j route show table all | sha256sum
              sha256sum /etc/resolv.conf
              sudo -n env LC_ALL=C iptables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
              sudo -n env LC_ALL=C ip6tables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
            } > listener-evidence/host-after.sha256
            cmp listener-evidence/host-before.sha256 listener-evidence/host-after.sha256
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: storage-exit-accept-${{ github.run_id }}
          path: listener-evidence/
          retention-days: 14
          if-no-files-found: warn

              expected_names = [('', name) for name in top] + [('    ', name) for name in nested]
              assert sorted(declarations) == sorted(expected_names)
              results = re.findall(r'^( *)(ok|not ok) [0-9]+ - (.+)$', output, re.M)
              assert sorted(results) == sorted((indent, 'ok', name) for indent, name in expected_names)
              assert not re.search(r'^ *(?:not )?ok [^\n]+ #\s*(SKIP|TODO)\b|^Bail out!', output, re.M | re.I)
              assert re.findall(r'^1\.\.([0-9]+)$', output, re.M) == [str(len(top))]
              assert re.findall(r'^ +1\.\.([0-9]+)$', output, re.M) == ([str(len(nested))] if nested else [])
              total = len(top) + len(nested)

          if test "$GITHUB_REF" = refs/heads/test/storage-challenge-read-consumers-20261021; then
            python3 -B - "$app_root" "$node_root/node" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import sys
          app_root, node = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          evidence = pathlib.Path('storage-consumer-contract-evidence').resolve()
          pins = json.loads(pathlib.Path('tests/integration/storage-consumer-maintenance-pins-v10.json').read_text())
          expected = {

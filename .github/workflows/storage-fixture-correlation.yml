              valid = '\n'.join(lines).replace('# pass_ ', '# pass ') + '\n'
              assert verify_tap(valid, top, nested)['tests'] == 11
              declaration = '    # Subtest: ' + nested[0] + '\n'
              result = '    ok 1 - ' + nested[0] + '\n'
              cases = {
                  'five_only_summary': valid.replace('# tests 11', '# tests 5').replace('# pass 11', '# pass 5'),
                  'missing_nested_name': valid.replace(declaration, ''),
                  'duplicate_nested_name': valid + declaration,
                  'extra_nested_name': valid + '    # Subtest: unlisted nested test\n',
                  'wrong_nested_name': valid.replace(nested[0], 'unlisted nested test'),
                  'missing_nested_result': valid.replace(result, ''),
                  'duplicate_nested_result': valid + result,
                  'failed_nested_result': valid.replace(result, result.replace('ok 1', 'not ok 1')),
                  'skipped_nested_result': valid.replace(result, result.rstrip() + ' # SKIP private\n'),
                  'todo_nested_result': valid.replace(result, result.rstrip() + ' # TODO private\n'),
                  'cancelled_summary': valid.replace('# cancelled 0', '# cancelled 1'),
                  'missing_top_name': valid.replace('# Subtest: ' + top[0] + '\n', ''),
                  'duplicate_top_name': valid + '# Subtest: ' + top[0] + '\n',
                  'extra_top_name': valid + '# Subtest: unlisted top test\n',
                  'nested_wrong_depth': valid.replace(declaration, declaration.replace('    #', '        #')),
              }
              for label, output in cases.items():
                  try:
                      verify_tap(output, top, nested)
                  except AssertionError:
                      continue
                  raise AssertionError('parser accepted ' + label)
              # The other groups explicitly have no nested tests.
              flat = '# Subtest: flat\nok 1 - flat\n1..1\n# tests 1\n# suites 0\n# pass 1\n# fail 0\n# cancelled 0\n# skipped 0\n# todo 0\n'
              assert verify_tap(flat, ['flat'], [])['nested_tests'] == 0
              try:
                  verify_tap(flat + '    # Subtest: unlisted nested test\n', ['flat'], [])
              except AssertionError:
                  pass
              else:
                  raise AssertionError('parser accepted nested test in flat group')
              return sorted([*cases, 'nested_in_flat_group'])
          controls = parser_controls(*inventories['cloud-private-file'])
          (evidence / 'app-parser-controls.json').write_bytes(canonical(dict(
              negative_controls=controls, controls=len(controls), actual_test_execution=False)))
          results = {}
          for group, (app, paths, count, nested) in groups.items():
              destination = app_root / app
              log = evidence / (group + '-tests.log')
              with log.open('wb') as output:
                  subprocess.run(['timeout', '--signal=TERM', '--kill-after=5s', '240s', str(node),
                      '--test', '--test-reporter=tap', *paths], cwd=destination,
                      stdout=output, stderr=subprocess.STDOUT, timeout=250, check=True)
              assert 0 < log.stat().st_size <= 1024 * 1024
              results[group] = dict(verify_tap(log.read_text(), *inventories[group]),
                  source_commit=expected[app]['revision'])
              assert not git(destination, 'diff', '--name-only', 'HEAD').strip()
              (evidence / (group + '-tests.json')).write_bytes(canonical(results[group]))
          # Cloud private-file: five top-level tests plus six named nested tests.
          # Synthetic GPG/loopback and owned-child checks do not prove the overlay.
          assert sum(value['tests'] for value in results.values()) == 117
          assert sum(value['top_level_tests'] for value in results.values()) == 111
          assert sum(value['nested_tests'] for value in results.values()) == 6
          (evidence / 'app-tests.json').write_bytes(canonical(dict(schema=2, sources=sources, groups=results,
              tests=117, top_level_tests=111, nested_tests=6, parser_negative_controls=controls,
              node_version='24.19.0', runner_tools_pinned=False, actual_consumer_acceptance=False,
              peer_or_overlay_acceptance=False, causal_attribution=False)))
          PY
          fi

      - name: Bind completed contracts to unchanged exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          git diff --exit-code HEAD
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          root = pathlib.Path('storage-consumer-contract-evidence')
          source = json.loads((root / 'source.json').read_text())
          assert source['source_commit'] == os.environ['GITHUB_SHA'] == git('rev-parse', 'HEAD')
          assert source['workflow_commit'] == os.environ['GITHUB_WORKFLOW_SHA']
          assert source['source_tree'] == git('rev-parse', 'HEAD^{tree}')
          read = os.environ['GITHUB_REF'] == 'refs/heads/test/storage-challenge-read-consumers-20261021'
          assert len(source['source_blobs']) == (8 if read else 18)
          for name, blob in {**source['source_blobs'], **source['dependency_blobs']}.items():
              assert git('rev-parse', 'HEAD:' + name) == blob
          untracked = git('ls-files', '--others', '--exclude-standard').splitlines()
          assert all(name.startswith('storage-consumer-contract-evidence/') for name in untracked)
          python = json.loads((root / 'python-tests.json').read_text())
          node = json.loads((root / 'node-tests.json').read_text())
          assert python['unique_tests'] == (331 if read else 328) and node['tests'] == (58 if read else 55) and node['node_version'] == '24.19.0'
          apps = None
          if read:
              apps = json.loads((root / 'app-tests.json').read_text())
              assert apps['node_version'] == '24.19.0' and apps['peer_or_overlay_acceptance'] is False
              assert node['top_level_tests'] == 58 and node['nested_tests'] == 0
              assert node['top_level_test_names'] == node['test_names'] and node['nested_test_names'] == []
              assert {key: (value['top_level_tests'], value['nested_tests'], value['tests'])
                  for key, value in apps['groups'].items()} == {
                  'image-sdk': (79, 0, 79), 'cloud-diagnostics': (27, 0, 27), 'cloud-private-file': (5, 6, 11)}
              assert apps['schema'] == 2 and apps['tests'] == 117 and apps['top_level_tests'] == 111 and apps['nested_tests'] == 6
              for group in apps['groups'].values():
                  top, nested = group['top_level_test_names'], group['nested_test_names']
                  assert len(top) == len(set(top)) == group['top_level_tests']
                  assert len(nested) == len(set(nested)) == group['nested_tests']
                  assert not set(top) & set(nested)
                  assert sorted(top + nested) == group['test_names'] and len(top + nested) == group['tests']
              controls = json.loads((root / 'app-parser-controls.json').read_text())
              assert controls['controls'] == len(set(controls['negative_controls'])) == 16
              assert controls['negative_controls'] == apps['parser_negative_controls']
              assert controls['actual_test_execution'] is False
              assert apps['sources']['image']['revision'] == 'f51b8ace0352377c7068a93fc8f4544f18e52978'
              assert apps['sources']['cloud']['revision'] == '5f143725fd18c98848beb61c9198a82066bfec13'
          receipt = dict(source, python_tests=python['unique_tests'], node_tests=node['tests'], node_version=node['node_version'],
              completed=True, actual_consumer_acceptance=False, causal_attribution=False)
          if apps is not None:
              receipt['app_tests'] = apps
          (root / 'final.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PY

      - name: Retain source-bound contract receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: storage-request-stage-consumer-contracts-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: storage-consumer-contract-evidence/

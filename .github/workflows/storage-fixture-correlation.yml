    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONSUMER_SOURCE_BASE: ${{ github.ref == 'refs/heads/test/storage-challenge-read-consumers-20261021' && '54c752607c2340c1b3bd525c986a91c447c81e50' || '6e30834e6189c19163dcd799c5b4957f3e50ef5e' }}
    steps:
      - name: Check out the exact consumer harness candidate

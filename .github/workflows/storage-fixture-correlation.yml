              actual_consumer_acceptance=False, causal_attribution=False)
          pathlib.Path('storage-consumer-contract-evidence/source.json').write_text(
              json.dumps(receipt, sort_keys=True) + '\n')
          PY

      - name: Inventory and run bounded inert Python groups
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 300s python3 -B - <<'PY'
          import json
          import pathlib
          import os
          import subprocess
          import sys
          groups = {
              'storage-request-stage-consumers': 15,
              'storage-provider-usage-snapshot': 16,
              'storage-fixture-correlation-sampler': 33,
              'storage-provider-activity-sampler': 17,

          assert sorted(results) == sorted(('', 'ok', name) for name in names)
          assert not re.search(r'^ *(?:not )?ok [^\n]+ #\s*(SKIP|TODO)\b|^Bail out!', output, re.M | re.I)
          assert re.findall(r'^1\.\.([0-9]+)$', output, re.M) == [str(expected)]

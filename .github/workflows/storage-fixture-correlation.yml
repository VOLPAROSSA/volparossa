                  top.extend(re.findall(r"^test\('([^'\n]+)',", source, re.M))
                  children.extend(re.findall(r"^  await t\.test\('([^'\n]+)',", source, re.M))
                  assert len(re.findall(r'\bt\.test\(', source)) == len(children)
              assert len(top) == len(set(top)) == count
              assert len(children) == len(set(children)) == len(nested)
              assert children == list(nested) and not set(top) & set(children)
              return top, children
          def verify_tap(output, top, nested):
              assert len(top) == len(set(top)) and len(nested) == len(set(nested))

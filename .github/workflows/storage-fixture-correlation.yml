name: Private Storage fixture correlation contracts

on:
  push:
    branches:
      - fix/storage-fixture-correlation
      - fix/storage-challenge-read-20261021
      - test/storage-request-stage-proof-20261021
      - test/storage-request-stage-consumers-20261021
      - test/storage-challenge-read-consumers-20261021
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-fixture-correlation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 2
  SOURCE_BASE: 7d0f9f0b492c5e692cc9d26f23d95f55f2c1e651

jobs:
  contracts:
    name: Opt-in RAM observation, local authority and closed export
    if: >-
      github.repository == 'VOLPAROSSA/volparossa' &&
      (github.ref == 'refs/heads/fix/storage-challenge-read-20261021' ||
      github.ref == 'refs/heads/fix/storage-fixture-correlation' ||
      github.ref == 'refs/heads/test/storage-request-stage-proof-20261021')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind source and unchanged dependencies
        id: source
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = VOLPAROSSA/volparossa
          case "$GITHUB_REF" in
            refs/heads/fix/storage-fixture-correlation|refs/heads/test/storage-request-stage-proof-20261021|refs/heads/fix/storage-challenge-read-20261021) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$SOURCE_BASE" HEAD
          umask 077
          mkdir storage-fixture-evidence
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = os.environ['SOURCE_BASE']
          if os.environ['GITHUB_REF'] == 'refs/heads/test/storage-request-stage-proof-20261021':
              base = 'e3b78c6376ccfe6ca9a4af1a60ffe65771ab1feb'
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          if os.environ['GITHUB_REF'] == 'refs/heads/fix/storage-challenge-read-20261021':
              base = '0f15a349d3fe34131a806241c3efcb7c8a1cdb8d'
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = git('diff', '--name-only', base, 'HEAD').splitlines()
          assert changed and len(changed) == len(set(changed))
          if os.environ['GITHUB_REF'] == 'refs/heads/test/storage-request-stage-proof-20261021':
              allowed = {
                  '.github/workflows/storage-fixture-correlation.yml',
                  'crates/volparossa-agent/src/content/fixture_correlation.rs',
                  'crates/volparossa-agent/src/content/fixture_correlation/tests.rs',
                  'crates/volparossa-agent/src/content/fixture_correlation/request_tests.rs',
                  'crates/volparossa-agent/src/content/private_storage.rs',
                  'crates/volparossa-agent/src/content/private_storage/observation/fixture_correlation_tests.rs',
                  'crates/volparossa-agent/src/control/fixture_correlation.rs',
                  'crates/volparossa-content/src/provider/activity.rs',
                  'crates/volparossa-content/src/private_storage/wire.rs',
                  'crates/volparossa-content/src/private_storage/wire/bridge_observation.rs',
                  'crates/volparossa-content/src/private_storage/wire/tests.rs',
                  'crates/volparossa-content/src/private_storage/wire/tests/request_stage.rs',
                  'crates/volparossa-local-control/src/fixture_correlation.rs',
                  'crates/volparossa-local-control/src/fixture_correlation/tests.rs',
                  'crates/volparossa-local-control/src/lib.rs',
                  'crates/volparossa/src/content/fixture_correlation.rs',
                  'crates/volparossa/src/content/fixture_correlation_tests.rs',
              }
              assert set(changed) == allowed and len(changed) == len(allowed)
          if os.environ['GITHUB_REF'] == 'refs/heads/fix/storage-challenge-read-20261021':
              allowed = {
                  '.github/workflows/storage-fixture-correlation.yml',
                  'crates/volparossa-agent/src/content/private_storage.rs',
                  'crates/volparossa-agent/src/content/private_storage/observation.rs',
                  'crates/volparossa-agent/src/content/private_storage/observation/challenge.rs',
                  'crates/volparossa-agent/src/content/private_storage/observation/challenge/tests.rs',
                  'crates/volparossa-agent/src/content/private_storage/tests.rs',
                  'crates/volparossa-content/src/private_storage/wire.rs',
                  'crates/volparossa-content/src/private_storage/wire/begin_observation.rs',
                  'crates/volparossa-content/src/private_storage/wire/tests/begin_observation.rs',
                  'crates/volparossa-local-control/src/lib.rs',
                  'crates/volparossa-local-control/src/private_storage.rs',
                  'crates/volparossa-local-control/src/private_storage_detail.rs',
                  'crates/volparossa-local-control/src/private_storage_detail/challenge.rs',
                  'crates/volparossa-local-control/src/private_storage_detail/flow_acquire/tests.rs',
                  'crates/volparossa-local-control/src/private_storage_detail/tests/challenge.rs',
                  'crates/volparossa/src/control_tests.rs',
                  'crates/volparossa/src/storage.rs',
                  'crates/volparossa/src/storage/peer.rs',
                  'crates/volparossa/src/storage/peer_challenge_diagnostics_tests.rs',
                  'crates/volparossa/src/storage/peer_challenge_read.rs',
                  'crates/volparossa/src/storage/peer_challenge_read_tests.rs',
                  'crates/volparossa/src/storage/peer_diagnostics.rs',
                  'crates/volparossa/src/storage/peer_diagnostics_tests.rs',
                  'crates/volparossa/src/storage/peer_tls_close_tests.rs',
                  'crates/volparossa/src/storage/peer_transfer.rs',
                  'tests/integration/storage-consumer-maintenance-smoke.py',
                  'tests/integration/storage-consumer-maintenance.mjs',
                  'tests/integration/test-storage-consumer-maintenance-smoke.py',
                  'tests/integration/test-storage-consumer-maintenance.mjs',
              }
              assert len(allowed) == 29 and set(changed) == allowed
          dependencies = ('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml',
              'crates/volparossa-agent/Cargo.toml',
              'crates/volparossa-content/Cargo.toml',
              'crates/volparossa-local-control/Cargo.toml', 'crates/volparossa/Cargo.toml')
          for name in dependencies:
              assert git('rev-parse', 'HEAD:' + name) == git('rev-parse', base + ':' + name)
          assert not any(name.startswith(('third_party/', 'config/')) for name in changed)
          receipt = dict(schema=1, source_commit=os.environ['GITHUB_SHA'],
              source_tree=git('rev-parse', 'HEAD^{tree}'), base_commit=base,
              workflow_commit=os.environ['GITHUB_WORKFLOW_SHA'],
              source_blobs={name: git('rev-parse', 'HEAD:' + name) for name in changed},
              dependency_blobs={name: git('rev-parse', 'HEAD:' + name) for name in dependencies},
              scope=('private-storage-challenge-read-local-contracts'
                  if os.environ['GITHUB_REF'] == 'refs/heads/fix/storage-challenge-read-20261021' else
                  'development-only-storage-fixture-correlation-local-contracts'),
              live_consumer_acceptance=False, causal_attribution=False,
              feature_equivalence_to_full_workspace_proven=False)
          pathlib.Path('storage-fixture-evidence/source.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PY

      - name: Exercise closed fixture collectors and unchanged diagnostic contracts
        run: |
          set -euo pipefail
          python3 -B tests/integration/test-storage-fixture-correlation-sampler.py
          python3 -B tests/integration/test-storage-provider-activity-sampler.py
          python3 -B tests/integration/test-private-storage-maintenance-wiring.py
          python3 -B tests/integration/test-private-storage-maintenance-smoke.py
          python3 -B tests/integration/test-storage-consumer-maintenance-smoke.py
          python3 -B tests/integration/test-storage-consumer-maintenance-shell.py
          python3 -B tests/integration/test-storage-consumer-maintenance-evidence.py
          python3 -B tests/integration/test-alpha-vm-diagnostics.py
          sh -n tests/integration/storage-consumer-maintenance-smoke.sh
          sh -n tests/integration/run-alpha-topology-vm.sh
          sh -n tests/integration/kvm-alpha-topology.sh
          shellcheck --severity=warning tests/integration/storage-consumer-maintenance-smoke.sh

      - name: Verify pinned profile-10 Node and run the complete inert JavaScript suite
        if: github.ref == 'refs/heads/fix/storage-challenge-read-20261021'
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          umask 077
          node_root=$(mktemp -d "$RUNNER_TEMP/storage-consumer-contract-node.XXXXXXXX")
          trap 'rm -rf -- "$node_root"' EXIT
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 20 --max-time 120 --max-filesize 31633904 \
            https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz \
            --output "$node_root/node.tar.xz"
          python3 -B - "$node_root" <<'PY'
          import hashlib
          import json
          import pathlib
          import tarfile
          import sys
          root = pathlib.Path(sys.argv[1])
          pin = json.loads(pathlib.Path('tests/integration/storage-consumer-maintenance-pins-v10.json').read_text())['runtime']
          assert pin['version'] == '24.19.0' and pin['bytes'] == 31633904
          assert pin['url'] == 'https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz'
          assert pin['sha256'] == '14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647'
          archive = root / 'node.tar.xz'
          assert archive.stat().st_size == pin['bytes']
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == pin['sha256']
          assert set(pin['files']) == {'bin/node', 'LICENSE'}
          # Only fixed destinations; archive names are never used as output paths.
          with tarfile.open(archive, 'r:xz') as bundle:
              for relative, expected in pin['files'].items():
                  member = bundle.getmember('node-v24.19.0-linux-x64/' + relative)
                  assert member.isfile() and not member.mode & 0o6000 and member.size == expected['bytes']
                  with bundle.extractfile(member) as source:
                      data = source.read(expected['bytes'] + 1)
                  assert len(data) == expected['bytes'] and hashlib.sha256(data).hexdigest() == expected['sha256']
                  destination = root / ('node' if relative == 'bin/node' else 'LICENSE')
                  with destination.open('xb') as output:
                      output.write(data)
                  destination.chmod(0o700 if relative == 'bin/node' else 0o600)
          PY
          test "$("$node_root/node" --version)" = v24.19.0
          timeout --signal=TERM --kill-after=5s 120s \
            "$node_root/node" --test --test-reporter=tap tests/integration/test-storage-consumer-maintenance.mjs \
            > storage-fixture-evidence/node-tests.log 2>&1
          python3 -B - <<'PY'
          import json
          import pathlib
          import re
          root = pathlib.Path('storage-fixture-evidence')
          log = root / 'node-tests.log'
          assert 0 < log.stat().st_size <= 1024 * 1024
          output = log.read_text()
          names = re.findall(r'^# Subtest: (.+)$', output, re.M)
          assert len(names) == len(set(names)) == 55
          for field, count in dict(tests=55, suites=0, pass_=55, fail=0, cancelled=0, skipped=0, todo=0).items():
              label = field.rstrip('_')
              assert re.findall(r'^# ' + label + r' (\d+)$', output, re.M) == [str(count)]
          assert sum(name.startswith('request-stage ') for name in names) == 3
          assert sum(name.startswith('challenge-read v10 ') for name in names) == 2
          (root / 'node-tests.json').write_text(json.dumps(dict(node_version='24.19.0',
              archive_sha256='14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647',
              tests=55, test_names=sorted(names), actual_consumer_acceptance=False), sort_keys=True) + '\n')
          PY

      - name: Install the existing pinned Rust toolchain
        id: toolchain
        run: |
          python3 -B scripts/provision-rust189.py runner
          export CARGO_HOME="$RUNNER_TEMP/volparossa-cargo-public-v1"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null GIT_ALLOW_PROTOCOL=https GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false
          export PATH="$RUNNER_TEMP/volparossa-rust-1.89.0/bin:$PATH"
          test "$(command -v rustc)" = "$RUNNER_TEMP/volparossa-rust-1.89.0/bin/rustc"
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting before compilation and retain a correction on failure
        id: format
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
          umask 077
          if cargo fmt --all -- --check > storage-fixture-evidence/format.log 2>&1; then
            git diff --exit-code HEAD
          else
            restore_source() {
              git restore --source=HEAD --worktree -- .
            }
            trap restore_source EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            if cargo fmt --all > storage-fixture-evidence/format-write.log 2>&1; then
              formatter_status=0
            else
              formatter_status=$?
            fi
            git diff --binary --full-index --no-ext-diff --no-color HEAD -- \
              > storage-fixture-evidence/format.patch
            restore_source
            trap - EXIT INT TERM
            git diff --exit-code HEAD
            printf 'Formatting check failed; correction captured; formatter exit: %s\n' "$formatter_status"
            exit 1
          fi

      - name: Install reviewed Protobuf on the disposable hosted runner
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(dpkg --print-architecture)" = amd64
          # Reuse the reviewed official Noble security family from core Quality.
          sudo -n apt-get update
          sudo -n apt-get install --yes --no-install-recommends \
            protobuf-compiler=3.21.12-8.2ubuntu0.4 \
            libprotoc32t64=3.21.12-8.2ubuntu0.4 \
            libprotobuf32t64=3.21.12-8.2ubuntu0.4
          test "$(protoc --version)" = 'libprotoc 3.21.12'

      - name: Fetch unchanged dependencies and compile affected targets
        id: build
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo test --locked --offline -p volparossa-local-control \
            -p volparossa-content -p volparossa-agent -p volparossa --no-run \
            2>&1 | tee storage-fixture-evidence/build.log

      - name: Inventory and execute disjoint new and historical tests
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          contract_group() {
            local label="$1" package="$2" filter="$3"
            local -a target=(--lib)
            if test "$package" = volparossa; then
              target=(--bin volparossa)
            fi
            timeout --kill-after=5s 180s \
              cargo test --locked --offline -p "$package" "${target[@]}" "$filter" -- --list \
              2>&1 | tee "storage-fixture-evidence/$label-inventory.log"
            timeout --kill-after=5s 180s \
              cargo test --locked --offline -p "$package" "${target[@]}" "$filter" \
              2>&1 | tee "storage-fixture-evidence/$label-test.log"
          }
          contract_group wire-new volparossa-local-control fixture_correlation::
          contract_group agent-new volparossa-agent fixture_correlation::
          contract_group cli-new volparossa content::fixture_correlation::
          contract_group wire-activity volparossa-local-control provider_activity::
          contract_group agent-activity volparossa-agent content::provider_activity::
          contract_group cli-activity volparossa content::provider_activity::
          contract_group agent-storage volparossa-agent content::private_storage::
          contract_group agent-tls volparossa-agent content::tls::tests::
          contract_group agent-refresh volparossa-agent content::refresh_tests::
          if test "$GITHUB_REF" = refs/heads/test/storage-request-stage-proof-20261021; then
            contract_group content-request volparossa-content fixture_request_
          fi
          if test "$GITHUB_REF" = refs/heads/fix/storage-challenge-read-20261021; then
            contract_group wire-challenge volparossa-local-control private_storage_detail::tests::challenge::
            contract_group wire-storage volparossa-local-control private_storage::tests::
            contract_group content-challenge volparossa-content private_storage::wire::tests::begin_observation::
            contract_group cli-challenge volparossa storage::peer::diagnostics::challenge_read_tests::
            contract_group cli-legacy volparossa storage::peer::diagnostics::tests::
            contract_group cli-close volparossa storage::peer::diagnostics::tls_close_tests::
          fi
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import re
          root = pathlib.Path('storage-fixture-evidence')
          groups = {
              'wire-new': 'volparossa-local-control', 'agent-new': 'volparossa-agent',
              'cli-new': 'volparossa', 'wire-activity': 'volparossa-local-control',
              'agent-activity': 'volparossa-agent', 'cli-activity': 'volparossa',
              'agent-storage': 'volparossa-agent', 'agent-tls': 'volparossa-agent',
              'agent-refresh': 'volparossa-agent',
          }
          if os.environ['GITHUB_REF'] == 'refs/heads/test/storage-request-stage-proof-20261021':
              groups['content-request'] = 'volparossa-content'
          if os.environ['GITHUB_REF'] == 'refs/heads/fix/storage-challenge-read-20261021':
              groups.update({'wire-challenge': 'volparossa-local-control', 'wire-storage': 'volparossa-local-control', 'content-challenge': 'volparossa-content', 'cli-challenge': 'volparossa', 'cli-legacy': 'volparossa', 'cli-close': 'volparossa'})
          # Retain these exact opt-in kernel tests in the inventory, separately
          # from executed contracts. This job does not supply their namespaces.
          tls_prefix = 'content::tls::tests::'
          tls_isolation = 'requires explicit hosted disposable net/PID namespaces and genuine Linux MPTCP'
          tls_egress_isolation = 'requires exact hosted disposable content-egress namespace and genuine Linux MPTCP'
          tls_ignored = {
              tls_prefix + 'kernel_close::signed_reserve_rejects_abrupt_outer_drop_after_inner_finish': tls_isolation,
              tls_prefix + 'kernel_close::signed_reserve_survives_tcp_provider_and_proxy_drop_before_outer_finish': tls_isolation,
              tls_prefix + 'kernel_close::repeated_egress::three_signed_reserves_use_reusable_production_egress_and_fragmented_hello': tls_egress_isolation,
          }
          tls_names = set(tls_ignored) | {
              tls_prefix + 'provider_tls_has_visible_policy_sni_and_fresh_client_identity_each_session',
              tls_prefix + 'provider_tls_rejects_wrong_server_peer_pin_and_wrong_signed_sni',
              tls_prefix + 'provider_tls_transfers_exact_registered_chunks_with_independent_publisher',
          }

          def verify_group(group, inventory, output):
              names = re.findall(r'^([^\n]+): test$', inventory, re.M)
              assert 1 <= len(names) <= 512 and len(names) == len(set(names)), group
              ignored = tls_ignored if group == 'agent-tls' else {}
              if group == 'agent-tls':
                  assert set(names) == tls_names and len(names) == 6, group
              expected = {name: 'ignored, ' + ignored[name] if name in ignored else 'ok' for name in names}
              observations = re.findall(r'^test ([^\n]+) \.\.\. ([^\n]+)$', output, re.M)
              assert sorted(observations) == sorted(expected.items()), group
              passed = len(names) - len(ignored)
              results = re.findall(r'^test result: ok\. (\d+) passed; 0 failed; (\d+) ignored; 0 measured; \d+ filtered out;', output, re.M)
              assert results == [(str(passed), str(len(ignored)))], group
              return names, [name for name in names if name not in ignored], ignored

          def parser_controls(inventory, output):
              ignored_name = sorted(tls_ignored)[0]
              passed_name = sorted(tls_names - set(tls_ignored))[0]
              ignored_line = 'test ' + ignored_name + ' ... ignored, ' + tls_ignored[ignored_name] + '\n'
              passed_line = 'test ' + passed_name + ' ... ok\n'
              assert output.count(ignored_line) == output.count(passed_line) == 1
              cases = {
                  'wrong_skip': ('agent-tls', inventory, output.replace(ignored_line,
                      ignored_line.replace(ignored_name, 'unlisted::ignored_test'))),
                  'missing_skip': ('agent-tls', inventory, output.replace(ignored_line, '')),
                  'additional_skip': ('agent-tls', inventory, output.replace(passed_line,
                      'test ' + passed_name + ' ... ignored, unlisted reason\n')),
                  'reason_mismatch': ('agent-tls', inventory, output.replace(ignored_line,
                      ignored_line.replace(tls_ignored[ignored_name], 'unlisted reason'))),
                  'duplicate_skip': ('agent-tls', inventory, output + ignored_line),
                  'duplicate_pass': ('agent-tls', inventory, output + passed_line),
                  'failed_test': ('agent-tls', inventory, output.replace(passed_line,
                      'test ' + passed_name + ' ... FAILED\n')),
                  'missing_inventory': ('agent-tls', inventory.replace(ignored_name + ': test\n', ''), output),
                  'skip_other_group': ('wire-new', 'baseline::case: test\n',
                      'test baseline::case ... ignored, unlisted reason\n'
                      'test result: ok. 0 passed; 0 failed; 1 ignored; 0 measured; 0 filtered out;\n'),
              }
              for label, args in cases.items():
                  try:
                      verify_group(*args)
                  except AssertionError:
                      continue
                  raise AssertionError('parser accepted ' + label)
              return sorted(cases)

          all_names, executed_names, ignored_names, counts = [], [], [], {}
          executed_counts, ignored_counts = {}, {}
          new_counts = {}
          controls = []
          for group, package in groups.items():
              inventory = (root / (group + '-inventory.log')).read_text()
              output = (root / (group + '-test.log')).read_text()
              names, passed, ignored = verify_group(group, inventory, output)
              if group == 'agent-tls':
                  controls = parser_controls(inventory, output)
              counts[group] = len(names)
              executed_counts[group], ignored_counts[group] = len(passed), len(ignored)
              new_counts[group] = sum(name.rsplit('::', 1)[-1].startswith(
                  ('fixture_v3_', 'fixture_request_')) for name in names)
              all_names.extend(package + ':' + name for name in names)
              executed_names.extend(package + ':' + name for name in passed)
              ignored_names.extend(dict(package=package, test_name=name, reason=reason)
                  for name, reason in sorted(ignored.items()))
          assert len(all_names) == len(set(all_names)), 'overlapping test groups'
          if os.environ['GITHUB_REF'] == 'refs/heads/test/storage-request-stage-proof-20261021':
              expected_new = {'wire-new': 4, 'agent-new': 12, 'cli-new': 1,
                  'content-request': 5}
              assert {group: count for group, count in new_counts.items() if count} == expected_new
              assert sum(new_counts.values()) == 22
          if os.environ['GITHUB_REF'] == 'refs/heads/fix/storage-challenge-read-20261021':
              read_tests = [name for name in executed_names if name.rsplit('::', 1)[-1].startswith('challenge_read_')]
              assert len(read_tests) == 9, read_tests
          assert len(ignored_names) == 3 and len(executed_names) + len(ignored_names) == len(all_names)
          receipt = dict(schema=2, unique_tests=len(all_names), group_counts=counts,
              executed_tests=len(executed_names), executed_group_counts=executed_counts,
              ignored_group_counts=ignored_counts, ignored_tests=ignored_names,
              executed_test_names=sorted(executed_names), parser_negative_controls=controls,
              test_names=sorted(all_names), live_consumer_acceptance=False, causal_attribution=False)
          (root / 'tests.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          PY

      - name: Lint the affected packages
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo clippy --locked --offline -p volparossa-local-control \
            -p volparossa-content -p volparossa-agent -p volparossa --all-targets --all-features -- -D warnings \
            2>&1 | tee storage-fixture-evidence/clippy.log

      - name: Recheck source even after failure
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

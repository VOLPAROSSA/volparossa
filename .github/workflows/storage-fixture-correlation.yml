              'tests/integration/storage-consumer-maintenance.mjs',
              'tests/integration/storage-fixture-correlation-sampler.py',
              'tests/integration/test-storage-consumer-maintenance-shell.py',
              'tests/integration/test-storage-consumer-maintenance.mjs',
              'tests/integration/storage-consumer-provider-usage.py',
              'tests/integration/storage-provider-usage-snapshot.py',
              'tests/integration/test-storage-provider-usage-snapshot.py',
              'tests/integration/test-storage-request-stage-consumers.py',
              'tests/integration/test-storage-provider-activity-sampler.py',
              'tests/integration/test-private-storage-maintenance-smoke.py',
              'tests/integration/test-private-storage-maintenance-wiring.py',

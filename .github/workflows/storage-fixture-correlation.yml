          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$CONSUMER_SOURCE_BASE" HEAD
          umask 077
          mkdir storage-consumer-contract-evidence
          python3 -B - <<'PY'
          import json

            https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz \
            --output "$node_root/node.tar.xz"
          python3 -B - "$node_root" <<'PY'
          import hashlib
          import json
          import pathlib
          import tarfile
          import sys
          root = pathlib.Path(sys.argv[1])
          pin = json.loads(pathlib.Path('tests/integration/storage-consumer-maintenance-pins-v10.json').read_text())['runtime']
          assert pin['version'] == '24.19.0' and pin['bytes'] == 31633904

              GIT_NO_REPLACE_OBJECTS='1')
          def git(root, *args):
              command = ['git', '-c', 'credential.helper=', '-c', 'http.extraHeader=',
                  '-c', 'core.hooksPath=/dev/null', '-c', 'core.autocrlf=false',
                  '-c', 'protocol.allow=never', '-c', 'protocol.https.allow=always', '-C', str(root), *args]
              return subprocess.check_output(command, env=environment, stderr=subprocess.STDOUT, timeout=120)
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n').encode()
          sources = {}
          for app, record in expected.items():
              source = pins['sources'][app]
              assert source['repository'] == record['repository'] and source['revision'] == record['revision']
              destination = app_root / app
              destination.mkdir(mode=0o700)
              git(destination, 'init', '--quiet')
              git(destination, 'fetch', '--quiet', '--no-tags', '--depth=1', '--no-recurse-submodules',
                  record['repository'], record['revision'])
              assert git(destination, 'rev-parse', 'FETCH_HEAD').decode().strip() == record['revision']
              git(destination, 'checkout', '--quiet', '--detach', 'FETCH_HEAD')
              assert git(destination, 'rev-parse', 'HEAD^{tree}').decode().strip() == record['tree']
              assert not git(destination, 'remote').strip()  # No remote or credential is persisted.
              assert not git(destination, 'status', '--porcelain', '--untracked-files=all').strip()
              files = []
              for raw in git(destination, 'ls-tree', '-rz', '--full-tree', 'HEAD').split(b'\0'):
                  if not raw:
                      continue
                  entry, path = raw.split(b'\t', 1)
                  mode, kind, blob = entry.decode().split()
                  relative = pathlib.PurePosixPath(path.decode())
                  assert mode in ('100644', '100755') and kind == 'blob'
                  assert not relative.is_absolute() and '..' not in relative.parts
                  local = destination / relative
                  assert local.is_file() and not local.is_symlink() and local.stat().st_size <= 4 * 1024 * 1024
                  data = local.read_bytes()
                  files.append(dict(path=str(relative), mode=mode, blob=blob, bytes=len(data),

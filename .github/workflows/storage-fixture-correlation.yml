              'tests/integration/storage-consumer-maintenance-pins-v10.json')
          if read:
              dependencies = tuple(name for name in git('ls-tree', '-r', '--name-only', base).splitlines()
                  if name.endswith('.rs') or pathlib.PurePosixPath(name).name in
                  ('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml'))
              assert len(dependencies) == 1170
              pin_path = 'tests/integration/storage-consumer-maintenance-pins-v10.json'
              current, previous = pathlib.Path(pin_path).read_text(), git('show', base + ':' + pin_path) + '\n'
              assert json.loads(current)['runtime'] == json.loads(previous)['runtime']
              assert current[current.index('  "runtime":'):] == previous[previous.index('  "runtime":'):]
          for name in dependencies:
              assert git('rev-parse', 'HEAD:' + name) == git('rev-parse', base + ':' + name)
          receipt = dict(schema=1, source_commit=os.environ['GITHUB_SHA'],
              source_tree=git('rev-parse', 'HEAD^{tree}'), base_commit=base,

              assert 0 < len(version) <= 8192
              tools[name] = dict(version=version.decode(), executable_pinned=False)
          (evidence / 'app-tools.json').write_bytes(canonical(tools))
          nested_private = (
              'two actual decryptions publish only fully verified output without consuming input',
              'existing destination and tampered ciphertext never publish or overwrite plaintext',
              'actual GPG authentication failure keeps requested output absent',
              'OpenPGP rejects changed encrypted data even when the outer receipt is replaced',
              'core contract fixture sees ciphertext only; actual decryption survives local cipher removal',

          assert base == ('54c752607c2340c1b3bd525c986a91c447c81e50' if read else '6e30834e6189c19163dcd799c5b4957f3e50ef5e')
          assert re.fullmatch('[0-9a-f]{40}', os.environ['GITHUB_SHA'])
          allowed = {
              '.github/workflows/storage-fixture-correlation.yml',

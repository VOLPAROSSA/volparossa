      - name: Retain original scoped source and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: storage-fixture-correlation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: storage-fixture-evidence/

  consumer-contracts:
    name: Scoped consumer source and synthetic contract checks
    if: >-
      github.repository == 'VOLPAROSSA/volparossa' &&
      (github.ref == 'refs/heads/test/storage-request-stage-consumers-20261021' ||
      github.ref == 'refs/heads/test/storage-challenge-read-consumers-20261021') &&

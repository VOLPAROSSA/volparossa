            workflow='.github/workflows/protected-resident-model.yml'
            original=subprocess.check_output(['git','show',configuration_base+':'+workflow])
            candidate=pathlib.Path(workflow).read_bytes()
            actual=b'\n  public-model:\n'
            assert candidate.split(actual,1)[1]==original.split(actual,1)[1]
            actual_job=actual+candidate.split(actual,1)[1]
            assert len(actual_job)==7067
            assert hashlib.sha256(actual_job).hexdigest()=='e44d67525c0d12f1711064c8f674f35fce559e85b679c6f30fd715fbdf4c90f2'
            host_configuration_scope=dict(base_commit=configuration_base,
              source_blobs={name:git('rev-parse','HEAD:'+name) for name in sorted(configuration_allowed)},

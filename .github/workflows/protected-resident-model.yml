          rustup toolchain install 1.85.0 --profile minimal --no-self-update --component clippy --component rustfmt
          # Same reviewed Noble security compiler/library family as main Quality.
          # https://security.ubuntu.com/ubuntu/dists/noble-security/universe/binary-amd64/Packages.xz
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            protobuf-compiler=3.21.12-8.2ubuntu0.4 \
            libprotoc32t64=3.21.12-8.2ubuntu0.4 \

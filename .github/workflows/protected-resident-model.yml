            retained_feature='81c6b6a5522b0f1cadf98345a7180974f46a2344'
            retained_tree='411c728475a8adf77a5a7273a86084c597775c44'
            feature_base='7d0f9f0b492c5e692cc9d26f23d95f55f2c1e651'
            assert base==integration_main
            assert git('rev-parse',retained_feature+'^{tree}')==retained_tree
            assert git('merge-base',integration_main,retained_feature)==feature_base
            subprocess.run(['git','merge-base','--is-ancestor',integration_main,'HEAD'],check=True)
            feature_paths=git('diff','--name-only',feature_base,retained_feature).splitlines()
            excluded={'docs/IMPLEMENTATION_STATUS.md'}
            assert len(feature_paths)==len(set(feature_paths))==53 and excluded<=set(feature_paths)

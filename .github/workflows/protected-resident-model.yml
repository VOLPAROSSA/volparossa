            changed=git('diff','--name-only',integration_main,'HEAD').splitlines()
            assert len(changed)==len(set(changed))==52 and set(changed)==included
            reconciled={'Cargo.lock','THIRD_PARTY_LICENSES.md',
              'tests/integration/protected-resident-model-run.py',
              '.github/workflows/protected-resident-model.yml',
              'tests/integration/test-protected-resident-model-run.py',

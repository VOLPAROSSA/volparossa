            changed=git('diff','--name-only',configuration_base,'HEAD').splitlines()
            assert len(changed)==len(set(changed))==len(configuration_allowed)==6 and set(changed)==configuration_allowed
            dependencies=('Cargo.lock','Cargo.toml','rust-toolchain.toml',
              'crates/volparossa/Cargo.toml','crates/volparossa-content/Cargo.toml',
              'crates/volparossa/src/compute/resident_guest.rs',

name: Public resident model integration contracts

on:
  push:
    branches: [feature/protected-resident-model, diagnostic/protected-export-inventory-20261021, fix/protected-requester-diagnostic-20261021, fix/protected-result-failure-20261021, fix/protected-socket-diagnostic-20261021, fix/protected-native-exit-observation-20261021, fix/protected-bwrap-stage-20261022, fix/protected-model-root-transition-20261022, fix/model-corruption-transition-20261022]
  workflow_dispatch:
    inputs:
      scenario:
        description: Source checks or the explicit public-only immutable model trial
        type: choice
        default: source-contracts
        options: [source-contracts, public-model]
        required: true
      expected_source:
        description: Exact reviewed commit required for the public model trial
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: protected-resident-model-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  contracts:
    if: >-
      github.repository == 'VOLPAROSSA/volparossa' &&
      ((github.ref == 'refs/heads/integration/resident-model-main-20261022' &&
      github.event_name == 'workflow_dispatch' && inputs.scenario == 'public-model' &&
      inputs.expected_source == github.sha) ||
      ((github.ref == 'refs/heads/integration/resident-model-main-20261022' ||
      github.ref == 'refs/heads/fix/model-host-observation-20261022' ||
      github.ref == 'refs/heads/fix/resident-connect-observation-20261023' ||
      github.ref == 'refs/heads/fix/resident-host-config-20261023') &&
      github.event_name == 'workflow_dispatch' && inputs.scenario == 'source-contracts') ||
      (github.ref == 'refs/heads/feature/protected-resident-model' ||
      ((github.ref == 'refs/heads/diagnostic/protected-export-inventory-20261021' ||
      github.ref == 'refs/heads/fix/protected-requester-diagnostic-20261021' ||
      github.ref == 'refs/heads/fix/protected-result-failure-20261021' ||
      github.ref == 'refs/heads/fix/protected-socket-diagnostic-20261021' ||
      github.ref == 'refs/heads/fix/protected-native-exit-observation-20261021' ||
      github.ref == 'refs/heads/fix/protected-bwrap-stage-20261022' ||
      github.ref == 'refs/heads/fix/protected-model-root-transition-20261022' ||
      github.ref == 'refs/heads/fix/model-corruption-transition-20261022') &&
      (github.event_name == 'push' || inputs.scenario == 'source-contracts'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind source and unchanged package versions
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir resident-model-evidence
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tomllib
          base=('89d3aea585ed8a1e4d7db3beac76846d3d3e2dc1'
            if os.environ['GITHUB_REF']=='refs/heads/integration/resident-model-main-20261022'
            else '339294e0f31c7ebccf7bbffcd18819fefe84dfcc')
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          old=tomllib.loads(git('show',base+':Cargo.lock'))
          new=tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          assert [(p['name'],p['version'],p.get('checksum')) for p in old['package']]==[(p['name'],p['version'],p.get('checksum')) for p in new['package']]
          if os.environ['GITHUB_REF']=='refs/heads/diagnostic/protected-export-inventory-20261021':
            diagnostic_base='3a1a15930fa69b89c9275f980e02eb6b89c94fb7'
            subprocess.run(['git','merge-base','--is-ancestor',diagnostic_base,'HEAD'],check=True)
            diagnostic_allowed={
              '.github/workflows/protected-resident-model.yml',
              'tests/integration/protected-resident-model-build.py',
              'tests/integration/protected-resident-model-workload.py',
              'tests/integration/test-protected-resident-model-build.py',
              'tests/integration/test-protected-resident-model-workload.py',
              'tests/integration/test-protected-resident-model-run.py'}
            diagnostic_changed=git('diff','--name-only',diagnostic_base,'HEAD').splitlines()
            assert len(diagnostic_changed)==len(diagnostic_allowed) and set(diagnostic_changed)==diagnostic_allowed
          requester_scope=None
          if os.environ['GITHUB_REF']=='refs/heads/fix/protected-requester-diagnostic-20261021':
            requester_base='c728ef98e7903d6ae147661ef46200f2316bf88d'
            subprocess.run(['git','merge-base','--is-ancestor',requester_base,'HEAD'],check=True)
            requester_allowed={
              '.github/workflows/protected-resident-model.yml',
              'crates/volparossa/src/compute/resident_guest/public_trial.rs',
              'crates/volparossa/src/compute/resident_guest/public_trial/tests.rs',
              'tests/integration/protected-resident-model-run.py',
              'tests/integration/test-protected-resident-model-run.py'}
            requester_changed=git('diff','--name-only',requester_base,'HEAD').splitlines()
            assert len(requester_changed)==len(requester_allowed) and set(requester_changed)==requester_allowed
            dependencies=('Cargo.lock','Cargo.toml','rust-toolchain.toml',
              'crates/volparossa/Cargo.toml','crates/volparossa-content/Cargo.toml')
            for name in dependencies:
              assert git('rev-parse','HEAD:'+name)==git('rev-parse',requester_base+':'+name)
            requester_scope=dict(base_commit=requester_base,
              source_blobs={name:git('rev-parse','HEAD:'+name) for name in sorted(requester_allowed)},
              dependency_blobs={name:git('rev-parse','HEAD:'+name) for name in dependencies},
              diagnostic_only=True,actual_model_execution=False)
          result_failure_scope=None
          if os.environ['GITHUB_REF']=='refs/heads/fix/protected-result-failure-20261021':
            failure_base='b47d80d80c650791a6273c291a99c154536f4dab'
            subprocess.run(['git','merge-base','--is-ancestor',failure_base,'HEAD'],check=True)
            failure_allowed={
              '.github/workflows/protected-resident-model.yml',
              'crates/volparossa/src/compute/resident_guest/wire.rs',
              'crates/volparossa/src/compute/resident_guest/session.rs',
              'crates/volparossa/src/compute/resident_guest/public_trial.rs',
              'crates/volparossa/src/compute/resident_guest/tests.rs',
              'crates/volparossa/src/compute/resident_guest/public_trial/tests.rs',
              'crates/volparossa/src/compute/supervise/native_session.rs',
              'crates/volparossa/src/compute/supervise/native_session/tests.rs',
              'crates/volparossa/src/compute/supervise/diagnostic.rs',
              'tests/integration/protected-resident-model-run.py',
              'tests/integration/test-protected-resident-model-run.py'}
            failure_changed=git('diff','--name-only',failure_base,'HEAD').splitlines()
            assert len(failure_changed)==len(failure_allowed) and set(failure_changed)==failure_allowed
            dependencies=('Cargo.lock','Cargo.toml','rust-toolchain.toml',
              'crates/volparossa/Cargo.toml','crates/volparossa-content/Cargo.toml')
            for name in dependencies:
              assert git('rev-parse','HEAD:'+name)==git('rev-parse',failure_base+':'+name)
            result_failure_scope=dict(base_commit=failure_base,
              source_blobs={name:git('rev-parse','HEAD:'+name) for name in sorted(failure_allowed)},
              dependency_blobs={name:git('rev-parse','HEAD:'+name) for name in dependencies},
              diagnostic_only=True,actual_model_execution=False)
          socket_diagnostic_scope=None
          if os.environ['GITHUB_REF']=='refs/heads/fix/protected-socket-diagnostic-20261021':
            socket_base='9a96c1281e3fa6b5a9e8ad0490c37d5f17cd66bc'
            subprocess.run(['git','merge-base','--is-ancestor',socket_base,'HEAD'],check=True)
            socket_allowed={
              '.github/workflows/protected-resident-model.yml',
              'crates/volparossa/src/compute/resident_guest/public_trial.rs',
              'crates/volparossa/src/compute/resident_guest/public_trial/tests.rs',
              'tests/integration/protected-resident-model-run.py',
              'tests/integration/test-protected-resident-model-run.py'}
            socket_changed=git('diff','--name-only',socket_base,'HEAD').splitlines()
            assert len(socket_changed)==len(socket_allowed) and set(socket_changed)==socket_allowed
            dependencies=('Cargo.lock','Cargo.toml','rust-toolchain.toml',
              'crates/volparossa/Cargo.toml','crates/volparossa-content/Cargo.toml')
            for name in dependencies:
              assert git('rev-parse','HEAD:'+name)==git('rev-parse',socket_base+':'+name)
            socket_diagnostic_scope=dict(base_commit=socket_base,
              source_blobs={name:git('rev-parse','HEAD:'+name) for name in sorted(socket_allowed)},
              dependency_blobs={name:git('rev-parse','HEAD:'+name) for name in dependencies},
              diagnostic_only=True,actual_model_execution=False)
          native_exit_scope=None
          if os.environ['GITHUB_REF']=='refs/heads/fix/protected-native-exit-observation-20261021':
            native_exit_base='fd1018edc8ebeb225e9d36dcb188b067f7b5a4a9'
            subprocess.run(['git','merge-base','--is-ancestor',native_exit_base,'HEAD'],check=True)
            native_exit_allowed={
              '.github/workflows/protected-resident-model.yml',
              'crates/volparossa/src/compute/supervise/native_session.rs',
              'crates/volparossa/src/compute/supervise/native_session/worker.rs',
              'crates/volparossa/src/compute/supervise/native_session/tests.rs',
              'crates/volparossa/src/compute/supervise/diagnostic.rs',
              'tests/integration/protected-resident-model-run.py',
              'tests/integration/test-protected-resident-model-run.py'}
            native_exit_changed=git('diff','--name-only',native_exit_base,'HEAD').splitlines()
            assert len(native_exit_changed)==len(native_exit_allowed) and set(native_exit_changed)==native_exit_allowed
            dependencies=('Cargo.lock','Cargo.toml','rust-toolchain.toml',
              'crates/volparossa/Cargo.toml','crates/volparossa-content/Cargo.toml')
            for name in dependencies:
              assert git('rev-parse','HEAD:'+name)==git('rev-parse',native_exit_base+':'+name)
            native_exit_scope=dict(base_commit=native_exit_base,
              source_blobs={name:git('rev-parse','HEAD:'+name) for name in sorted(native_exit_allowed)},
              dependency_blobs={name:git('rev-parse','HEAD:'+name) for name in dependencies},
              diagnostic_only=True,actual_model_execution=False,
              status_semantics='observed_before_native_session_cleanup',
              stderr_semantics='bounded_existing_drain_classification',
              eof_matrix='legacy_null_or_class_with_optional_precleanup_status_v1')
          bwrap_stage_scope=None
          if os.environ['GITHUB_REF']=='refs/heads/fix/protected-bwrap-stage-20261022':
            bwrap_base='3fceb0f82716a4ee10d1b9d11c7d5011fec31179'
            subprocess.run(['git','merge-base','--is-ancestor',bwrap_base,'HEAD'],check=True)
            bwrap_allowed={
              '.github/workflows/protected-resident-model.yml',
              'THIRD_PARTY_LICENSES.md',
              'crates/volparossa/src/compute/supervise.rs',
              'crates/volparossa/src/compute/supervise/diagnostic.rs',
              'crates/volparossa/src/compute/supervise/native_session.rs',
              'crates/volparossa/src/compute/supervise/native_session/worker.rs',
              'crates/volparossa/src/compute/supervise/native_session/tests.rs',
              'crates/volparossa/src/compute/resident_guest/tests.rs',
              'tests/integration/protected-resident-model-run.py',
              'tests/integration/test-protected-resident-model-run.py'}
            changed=git('diff','--name-only',bwrap_base,'HEAD').splitlines()
            assert len(changed)==len(bwrap_allowed)==10 and set(changed)==bwrap_allowed
            dependencies=('Cargo.lock','Cargo.toml','rust-toolchain.toml',
              'crates/volparossa/Cargo.toml','crates/volparossa-content/Cargo.toml')
            for name in dependencies:
              assert git('rev-parse','HEAD:'+name)==git('rev-parse',bwrap_base+':'+name)
            workflow='.github/workflows/protected-resident-model.yml'
            old=subprocess.check_output(['git','show',bwrap_base+':'+workflow])
            new=pathlib.Path(workflow).read_bytes()
            actual=b'\n  public-model:\n'
            assert new.split(actual,1)[1]==old.split(actual,1)[1]
            bwrap_stage_scope=dict(base_commit=bwrap_base,
              source_blobs={name:git('rev-parse','HEAD:'+name) for name in sorted(bwrap_allowed)},
              dependency_blobs={name:git('rev-parse','HEAD:'+name) for name in dependencies},
              actual_job_sha256=hashlib.sha256(actual+new.split(actual,1)[1]).hexdigest(),
              diagnostic_only=True,actual_model_execution=False,
              default_diagnostic_encoding_unchanged=True,
              stderr_semantics='closed_family_of_existing_first_bounded_prefix_not_runtime_cause')
          root_transition_scope=None
          if os.environ['GITHUB_REF']=='refs/heads/fix/protected-model-root-transition-20261022':
            transition_base='8b37a08bcf64a8d6e34932f0d0f4ee75082c813e'
            subprocess.run(['git','merge-base','--is-ancestor',transition_base,'HEAD'],check=True)
            transition_allowed={
              '.github/workflows/protected-resident-model.yml',
              'packaging/protected-resident-model/init',
              'tests/integration/test-protected-resident-model-initrd.py',
              'tests/integration/test-protected-resident-model-run.py'}
            changed=git('diff','--name-only',transition_base,'HEAD').splitlines()
            assert len(changed)==len(transition_allowed)==4 and set(changed)==transition_allowed
            dependencies=('Cargo.lock','Cargo.toml','rust-toolchain.toml',
              'crates/volparossa/Cargo.toml','crates/volparossa-content/Cargo.toml')
            for name in dependencies:
              assert git('rev-parse','HEAD:'+name)==git('rev-parse',transition_base+':'+name)
            workflow='.github/workflows/protected-resident-model.yml'
            old=subprocess.check_output(['git','show',transition_base+':'+workflow])
            new=pathlib.Path(workflow).read_bytes()
            actual=b'\n  public-model:\n'
            assert new.split(actual,1)[1]==old.split(actual,1)[1]
            root_transition_scope=dict(base_commit=transition_base,
              source_blobs={name:git('rev-parse','HEAD:'+name) for name in sorted(transition_allowed)},
              dependency_blobs={name:git('rev-parse','HEAD:'+name) for name in dependencies},
              actual_job_sha256=hashlib.sha256(actual+new.split(actual,1)[1]).hexdigest(),
              source_contracts_only=True,actual_model_execution=False,guest_boot=False,
              root_transition='private_child_mount_move_before_chroot')
          corruption_transition_scope=None
          if os.environ['GITHUB_REF']=='refs/heads/fix/model-corruption-transition-20261022':
            corruption_base='a9737718688ec285a86acb7a4d330dbb444e10b5'
            subprocess.run(['git','merge-base','--is-ancestor',corruption_base,'HEAD'],check=True)
            corruption_allowed={
              '.github/workflows/protected-resident-model.yml',
              'tests/integration/protected-resident-model-run.py',
              'tests/integration/test-protected-resident-model-run.py'}
            changed=git('diff','--name-only',corruption_base,'HEAD').splitlines()
            assert len(changed)==len(corruption_allowed)==3 and set(changed)==corruption_allowed
            dependencies=('Cargo.lock','Cargo.toml','rust-toolchain.toml',
              'crates/volparossa/Cargo.toml','crates/volparossa-content/Cargo.toml')
            for name in dependencies:
              assert git('rev-parse','HEAD:'+name)==git('rev-parse',corruption_base+':'+name)
            workflow='.github/workflows/protected-resident-model.yml'
            old=subprocess.check_output(['git','show',corruption_base+':'+workflow])
            new=pathlib.Path(workflow).read_bytes()
            actual=b'\n  public-model:\n'
            assert new.split(actual,1)[1]==old.split(actual,1)[1]
            corruption_transition_scope=dict(base_commit=corruption_base,
              source_blobs={name:git('rev-parse','HEAD:'+name) for name in sorted(corruption_allowed)},
              dependency_blobs={name:git('rev-parse','HEAD:'+name) for name in dependencies},
              actual_job_sha256=hashlib.sha256(actual+new.split(actual,1)[1]).hexdigest(),
              source_contracts_only=True,actual_model_execution=False,guest_boot=False,
              cleanup_semantics='all_launched_scopes_joined_before_payload_removal')
          host_observation_scope=None
          if os.environ['GITHUB_REF']=='refs/heads/fix/model-host-observation-20261022':
            host_base='e4824ae3c9a3f606a6013540461f5d148e3a76b6'
            subprocess.run(['git','merge-base','--is-ancestor',host_base,'HEAD'],check=True)
            host_allowed={
              '.github/workflows/protected-resident-model.yml',
              'THIRD_PARTY_LICENSES.md',
              'tests/integration/protected-resident-model-run.py',
              'tests/integration/test-protected-resident-model-run.py',
              'tests/integration/protected-resident-model-host-observation.py',
              'tests/integration/test-protected-resident-model-host-observation.py'}
            changed=git('diff','--name-only',host_base,'HEAD').splitlines()
            assert len(changed)==len(set(changed))==len(host_allowed)==6 and set(changed)==host_allowed
            dependencies=('Cargo.lock','Cargo.toml','rust-toolchain.toml',
              'crates/volparossa/Cargo.toml','crates/volparossa-content/Cargo.toml',
              'crates/volparossa/src/compute/resident_guest.rs',
              'crates/volparossa/src/compute/resident_guest/public_trial.rs',
              'crates/volparossa/src/compute/supervise/native_session.rs',
              'packaging/protected-resident-model/init',
              'packaging/protected-resident-model/entrypoint',
              'packaging/protected-resident-model/profile-v1.json',
              'tests/integration/protected-resident-image-pins-v1.json',
              'tests/integration/protected-resident-model-debian-lock-v1.json',
              'tests/integration/protected-resident-model-build.py',
              'tests/integration/protected-resident-model-install.py',
              'tests/integration/protected-resident-model-assemble.py',
              'tests/integration/protected-resident-model-workload.py')
            for name in dependencies:
              assert git('rev-parse','HEAD:'+name)==git('rev-parse',host_base+':'+name),name
            workflow='.github/workflows/protected-resident-model.yml'
            original=subprocess.check_output(['git','show',host_base+':'+workflow])
            candidate=pathlib.Path(workflow).read_bytes()
            actual=b'\n  public-model:\n'
            assert candidate.split(actual,1)[1]==original.split(actual,1)[1]
            host_observation_scope=dict(base_commit=host_base,
              source_blobs={name:git('rev-parse','HEAD:'+name) for name in sorted(host_allowed)},
              dependency_blobs={name:git('rev-parse','HEAD:'+name) for name in dependencies},
              actual_job_sha256=hashlib.sha256(actual+candidate.split(actual,1)[1]).hexdigest(),
              source_contracts_only=True,actual_model_execution=False,
              diagnostic_only=True,strict_raw_equality_unchanged=True,historical_cause_proven=False)
          host_configuration_scope=None
          if os.environ['GITHUB_REF']=='refs/heads/fix/resident-host-config-20261023':
            configuration_base='ce438c27df80cdba46e990b157b3e5c52e94543c'
            subprocess.run(['git','merge-base','--is-ancestor',configuration_base,'HEAD'],check=True)
            configuration_allowed={
              '.github/workflows/protected-resident-model.yml',
              'THIRD_PARTY_LICENSES.md',
              'tests/integration/protected-resident-model-run.py',
              'tests/integration/test-protected-resident-model-run.py',

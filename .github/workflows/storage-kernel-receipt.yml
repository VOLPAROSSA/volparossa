name: Signed Storage receipt over kernel MPTCP

on:
  push:
    branches: [test/storage-challenge-kernel-mptcp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-kernel-receipt-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  SOURCE_BASE: eaf9fa237a83dc3ded35c6afb301cdd35b6b90c9
  TEST_NAME: content::tls::tests::storage::kernel::signed_storage_finalize_over_kernel_mptcp_tls
  FIREWALL_NORMALIZER: |
    BEGIN {
      ctime = "(Sun|Mon|Tue|Wed|Thu|Fri|Sat) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) ( [1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] [0-9][0-9][0-9][0-9]"
    }
    {
      quoted = 0
      escaped = 0
      for (i = 1; i <= length($0); i++) {
        character = substr($0, i, 1)
        if (escaped) { escaped = 0; continue }
        if (character == "\\") { escaped = 1; continue }
        if (character == "\"") quoted = !quoted
      }
      if (quoted || escaped) exit 1
    }
    $0 ~ ("^# Generated by ip(6)?tables-save v[0-9][0-9A-Za-z.+:~_-]*( \\(nf_tables\\))? on " ctime "$") {
      sub(/ on .*$/, " on [timestamp]")
    }
    $0 ~ ("^# Completed on " ctime "$") {
      $0 = "# Completed on [timestamp]"
    }
    /^:[-A-Za-z0-9_.+]+ (ACCEPT|DROP|-) \[[0-9]+:[0-9]+\]$/ {
      sub(/ \[[0-9]+:[0-9]+\]$/, " [counters]")
    }
    { print }

jobs:
  receipt:
    if: >-
      github.repository == 'VOLPAROSSA/volparossa' &&
      github.ref == 'refs/heads/test/storage-challenge-kernel-mptcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind unchanged production and previous tests to the exact candidate
        id: scope
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$SOURCE_BASE" HEAD
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          base = os.environ['SOURCE_BASE']
          path = 'crates/volparossa-agent/src/content/tls/tests/storage.rs'
          expected = {path, path[:-3] + '/kernel.rs', '.github/workflows/storage-kernel-receipt.yml'}
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          assert set(changed) == expected
          original = subprocess.check_output(['git', 'show', base + ':' + path])
          needle = b'mod challenge;\n'
          assert original.count(needle) == 1
          assert pathlib.Path(path).read_bytes() == original.replace(needle, needle + b'mod kernel;\n', 1)
          blobs = {name: subprocess.check_output(['git', 'rev-parse', 'HEAD:' + name], text=True).strip()
              for name in sorted(expected | {'scripts/run-isolated-test.sh'})}
          evidence = pathlib.Path('storage-kernel-receipt-evidence')
          evidence.mkdir()
          (evidence / 'source.json').write_text(json.dumps(dict(schema=1,
              source_commit=os.environ['GITHUB_SHA'], workflow_commit=os.environ['GITHUB_WORKFLOW_SHA'],
              source_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              test_base=base, production_source_unchanged=True, previous_tests_unchanged=True,
              blobs=blobs, test_name=os.environ['TEST_NAME'],
              scope='signed-storage-kernel-mptcp-loopback-production-tls',
              full_relay_or_cloud_acceptance=False, failure_causality_proven=False), sort_keys=True) + '\n')
          PY

      - name: Prepare the pinned compiler on the disposable hosted runner
        id: toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
          test "$(dpkg --print-architecture)" = amd64
          sudo -n apt-get update
          sudo -n apt-get install --yes --no-install-recommends protobuf-compiler=3.21.12-8.2ubuntu0.3
          test "$(protoc --version)" = 'libprotoc 3.21.12'
          cargo fetch --locked

      - name: Compile the exact agent library test binary without running tests
        id: build
        run: |
          set -euo pipefail
          cargo test --locked --offline -p volparossa-agent --lib --no-run --message-format=json \
            > storage-kernel-receipt-evidence/build.jsonl \
            2> storage-kernel-receipt-evidence/build.log
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          root = pathlib.Path('storage-kernel-receipt-evidence')
          records = [json.loads(line) for line in (root / 'build.jsonl').read_text().splitlines()]
          executables = [row['executable'] for row in records if row.get('reason') == 'compiler-artifact'
              and row.get('target', {}).get('name') == 'volparossa_agent'
              and row.get('profile', {}).get('test') and row.get('executable')]
          assert len(executables) == 1
          binary = pathlib.Path(executables[0]).resolve(strict=True)
          assert binary.is_file() and binary.is_relative_to(pathlib.Path.cwd() / 'target')
          inventory = subprocess.check_output([str(binary), '--ignored', '--exact', os.environ['TEST_NAME'], '--list'], text=True)
          assert inventory.splitlines() == [os.environ['TEST_NAME'] + ': test', '', '1 test, 0 benchmarks']
          (root / 'inventory.log').write_text(inventory)
          (root / 'binary.txt').write_text(str(binary) + '\n')
          PY

      - name: Check firewall snapshot normalization before the isolated test
        run: |
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          def normalize(text):
              return subprocess.check_output(['awk', os.environ['FIREWALL_NORMALIZER']],
                  input=text.encode(), env={**os.environ, 'LC_ALL': 'C'})
          checked = 0
          for program in ['iptables-save', 'ip6tables-save']:
              for backend in ['', ' (nf_tables)']:
                  before = (f'# Generated by {program} v1.8.10{backend} on Thu Oct 15 10:10:10 2026\n'
                      '*filter\n:INPUT ACCEPT [1:2]\n:custom-chain - [3:4]\n'
                      '-A INPUT -m comment --comment "semantic [1:2]" -j custom-chain\n'
                      'COMMIT\n# Completed on Thu Oct 15 10:10:10 2026\n')
                  after = before.replace('10:10:10', '11:11:11').replace('ACCEPT [1:2]',
                      'ACCEPT [99:100]').replace('- [3:4]', '- [101:102]')
                  assert normalize(before) == normalize(after)
                  checked += 1
                  for old, new in [('ACCEPT', 'DROP'), ('custom-chain', 'other-chain'),
                      ('semantic [1:2]', 'semantic [9:10]'), ('*filter', '*nat'),
                      ('v1.8.10', 'v1.8.11'), ('COMMIT\n', ''),
                      ('v1.8.10' + backend, 'v1.8.10 (legacy)'),
                      ('10:10:10', 'unrecognized-timestamp')]:
                      assert normalize(before) != normalize(before.replace(old, new))
                      checked += 1
                  for embedded in ['# Completed on Thu Oct 15 10:10:10 2026',
                      ':INPUT ACCEPT [1:2]', f'# Generated by {program} v1.8.10{backend} on Thu Oct 15 10:10:10 2026']:
                      try:
                          normalize(before.replace('semantic [1:2]', 'first\n' + embedded + '\nlast'))
                      except subprocess.CalledProcessError:
                          pass
                      else:
                          raise AssertionError('multiline rule must fail closed')
                      checked += 1
          assert checked == 48
          pathlib.Path('storage-kernel-receipt-evidence/firewall-normalizer.json').write_text(
              json.dumps(dict(checks=checked, passed=True, scope='inert-normalizer-fixtures'), sort_keys=True) + '\n')
          PY

      - name: Run the signed receipt once in a disposable unprivileged loopback namespace
        run: |
          set -euo pipefail
          parent_namespace=$(readlink /proc/self/ns/net)
          {
            ip -4 -j route show table all | sha256sum
            ip -6 -j route show table all | sha256sum
            sha256sum /etc/resolv.conf
            sudo -n env LC_ALL=C iptables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
            sudo -n env LC_ALL=C ip6tables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
          } > storage-kernel-receipt-evidence/host-before.sha256
          read -r binary < storage-kernel-receipt-evidence/binary.txt
          VOLPAROSSA_TEST_ALLOW_SUDO_NETNS=1 scripts/run-isolated-test.sh --command \
            "$binary" "$TEST_NAME" VOLPAROSSA_EXACT_CONTENT_PARENT_NETNS loopback \
            --ignored --exact "$TEST_NAME" --nocapture \
            2>&1 | tee storage-kernel-receipt-evidence/test.log
          test "$(readlink /proc/self/ns/net)" = "$parent_namespace"
          python3 -B - <<'PY'
          import os
          import pathlib
          import re
          root = pathlib.Path('storage-kernel-receipt-evidence')
          text = (root / 'test.log').read_text()
          summaries = [line for line in text.splitlines() if line.startswith('test result:')]
          assert len(summaries) == 1
          assert re.fullmatch(r'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s', summaries[0])
          assert re.findall(r'^test (.+) \.\.\. ok$', text, re.M) == [os.environ['TEST_NAME']]
          PY

      - name: Lint the same agent library and tests
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo clippy --locked --offline -p volparossa-agent --lib --tests -- -D warnings \
            2>&1 | tee storage-kernel-receipt-evidence/clippy.log

      - name: Check formatting without changing the tested source
        if: ${{ always() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --all -- --check

      - name: Verify original source and host network configuration
        if: ${{ always() && steps.scope.outcome == 'success' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
          if test -f storage-kernel-receipt-evidence/host-before.sha256; then
            {
              ip -4 -j route show table all | sha256sum
              ip -6 -j route show table all | sha256sum
              sha256sum /etc/resolv.conf
              sudo -n env LC_ALL=C iptables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
              sudo -n env LC_ALL=C ip6tables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
            } > storage-kernel-receipt-evidence/host-after.sha256
            cmp storage-kernel-receipt-evidence/host-before.sha256 storage-kernel-receipt-evidence/host-after.sha256
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: storage-kernel-receipt-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: storage-kernel-receipt-evidence/

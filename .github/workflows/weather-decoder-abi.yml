name: Weather decoder Debian 13 ABI
run-name: Exact source-built Weather decoder in disposable Debian 13

on:
  workflow_dispatch:
  push:
    branches: [feature/weather-decoder-abi]
    paths:
      - .github/workflows/weather-decoder-abi.yml
      - tests/helper/weather-decoder-abi-v1.json
      - tests/integration/weather-decoder-abi.py
      - tests/integration/test-weather-decoder-abi.py
      - tests/integration/test-weather-decoder-abi-wiring.py
      - tests/integration/run-alpha-topology-vm.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: weather-decoder-abi-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  debian13:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the exact source and offline contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          sh -n tests/integration/run-alpha-topology-vm.sh
          python3 -B tests/integration/test-weather-decoder-abi.py
          python3 -B tests/integration/test-weather-decoder-abi-wiring.py
      - name: Install VM tools only on this disposable runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl jq util-linux iproute2
          test -c /dev/kvm
          test "$(stat -Lc '%u' /dev/kvm)" = 0
          kvm_gid=$(stat -Lc '%g' /dev/kvm)
          case "$kvm_gid" in ''|0|0*|*[!0-9]*) exit 1 ;; esac
          test "$(getent group "$kvm_gid" | awk -F: -v gid="$kvm_gid" \
            '$1 == "kvm" && $3 == gid { print $1 ":" $3 }')" = "kvm:$kvm_gid"
          qemu-system-x86_64 -accel help | grep -Fx kvm
          output="$RUNNER_TEMP/weather-decoder-abi"
          install -d -m 0700 "$output"
          printf 'VOLPAROSSA_ABI_OUTPUT=%s\nVOLPAROSSA_KVM_GID=%s\n' "$output" "$kvm_gid" >> "$GITHUB_ENV"
      - name: Retrieve only the reviewed public decoder artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          record=tests/helper/weather-decoder-abi-v1.json
          test "$(jq -r '.hosted_run.id' "$record")" = 38214736539
          gh api repos/VOLPAROSSA/volparossa-weather/actions/runs/38214736539 \
            --jq '{id,run_attempt,head_sha,status,conclusion}' > "$RUNNER_TEMP/weather-build-run.json"
          jq -e --arg commit "$(jq -r '.weather_commit' "$record")" \
            '.id == 38214736539 and .run_attempt == 1 and .head_sha == $commit and
             .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/weather-build-run.json"
          gh api repos/VOLPAROSSA/volparossa-weather/actions/artifacts/11731895956 \
            --jq '{id,name,size_in_bytes,digest,expired,workflow_run}' > "$RUNNER_TEMP/weather-decoder-artifact.json"
          jq -e --arg digest "sha256:$(jq -r '.evidence.artifacts.decoder.sha256' "$record")" \
            --arg commit "$(jq -r '.weather_commit' "$record")" \
            '.id == 11731895956 and .name == ("hosted-decoder-unadmitted-" + $commit) and
             .digest == $digest and .expired == false and .size_in_bytes == 14057646 and
             .workflow_run.id == 38214736539 and .workflow_run.head_sha == $commit' \
            "$RUNNER_TEMP/weather-decoder-artifact.json"
          inputs="$RUNNER_TEMP/weather-decoder-inputs"
          test ! -e "$inputs"
          gh run download 38214736539 --repo VOLPAROSSA/volparossa-weather \
            --name hosted-decoder-unadmitted-7d61077aa415de8f46f79384a1dd08f403c4898c --dir "$inputs"
          python3 -B tests/integration/weather-decoder-abi.py verify-inputs "$inputs"
          printf 'VOLPAROSSA_ABI_INPUTS=%s\n' "$inputs" >> "$GITHUB_ENV"
      - name: Fetch and verify the existing pinned Debian 13 image
        run: |
          set -euo pipefail
          manifest=tests/helper/debian13-amd64-image-v1.json
          image="$RUNNER_TEMP/debian-13-genericcloud-amd64-20260826-2582.qcow2"
          curl --fail --show-error --silent --location \
            --connect-timeout 30 --max-time 1200 --max-filesize 2147483648 \
            --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --output "$image" "$(jq -er '.url' "$manifest")"
          chmod 0600 "$image"
          printf '%s  %s\n' \
            184761b0dad0f9ace02f9298050ca96ce3caa39a461a47706d47ff9698b59933918b91b40177fbd4d392f6446af8b4d18ecb94caca988169b19641606bf34003 \
            "$image" | sha512sum --check --strict -
          printf 'VOLPAROSSA_ABI_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Run the exact decoder unprivileged and offline inside Debian 13
        run: |
          set -euo pipefail
          runner_uid=$(id -u)
          case "$runner_uid" in ''|0|0*|*[!0-9]*) exit 1 ;; esac
          sudo -n -- /usr/bin/setpriv --reuid "$runner_uid" --regid "$VOLPAROSSA_KVM_GID" \
            --clear-groups --inh-caps=-all --ambient-caps=-all --bounding-set=-all \
            --no-new-privs --reset-env -- \
            "$GITHUB_WORKSPACE/tests/integration/run-alpha-topology-vm.sh" --execute --yes \
            --scenario weather-decoder-abi --decoder-abi-inputs "$VOLPAROSSA_ABI_INPUTS" \
            --image "$VOLPAROSSA_ABI_IMAGE" --output "$VOLPAROSSA_ABI_OUTPUT" \
            --expected-commit "$GITHUB_SHA"
      - name: Retain bounded ABI results only
        if: always() && env.VOLPAROSSA_ABI_OUTPUT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather-decoder-debian13-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.VOLPAROSSA_ABI_OUTPUT }}
      - name: State the scope
        if: always()
        run: |
          printf '%s\n' \
            'ABI trial only: inspect original step results and guest report.' \
            'No weather-origin request, browser execution, model, private bundle or production decoder admission.' \
            'A passing relocated decoder probe is not joined Weather delivery.' >> "$GITHUB_STEP_SUMMARY"

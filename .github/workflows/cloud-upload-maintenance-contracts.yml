name: Joined finite Cloud upload and TLS close contracts

on:
  push:
    branches: [feature/cloud-upload-tls-v9]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-upload-maintenance-contracts-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  STORAGE_SOURCE: 2ce38aa9e336f48f11f21d9ffdd7c95ddc9083fb
  UPLOAD_SOURCE: 4f5e5d7e8d0e017a8881d4ae83a2e6e59c21fba6
  JOIN_BASE: 33faa7449ee982f8114c001107692eedf03cb5d5
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'
  FIREWALL_NORMALIZER: |
    BEGIN {
      ctime = "(Sun|Mon|Tue|Wed|Thu|Fri|Sat) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) ( [1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] [0-9][0-9][0-9][0-9]"
    }
    {
      quoted = 0
      escaped = 0
      for (i = 1; i <= length($0); i++) {
        character = substr($0, i, 1)
        if (escaped) { escaped = 0; continue }
        if (character == "\\") { escaped = 1; continue }
        if (character == "\"") quoted = !quoted
      }
      if (quoted || escaped) exit 1
    }
    $0 ~ ("^# Generated by ip(6)?tables-save v[0-9][0-9A-Za-z.+:~_-]*( \\(nf_tables\\))? on " ctime "$") {
      sub(/ on .*$/, " on [timestamp]")
    }
    $0 ~ ("^# Completed on " ctime "$") {
      $0 = "# Completed on [timestamp]"
    }
    /^:[-A-Za-z0-9_.+]+ (ACCEPT|DROP|-) \[[0-9]+:[0-9]+\]$/ {
      sub(/ \[[0-9]+:[0-9]+\]$/, " [counters]")
    }
    { print }

jobs:
  contracts:
    if: >-
      github.repository == 'VOLPAROSSA/volparossa' &&
      github.ref == 'refs/heads/feature/cloud-upload-tls-v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact composition and unchanged parent sources
        id: source
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$STORAGE_SOURCE" HEAD
          git merge-base --is-ancestor "$UPLOAD_SOURCE" HEAD
          umask 077
          mkdir cloud-upload-contract-evidence
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          storage, upload, base = (os.environ[k] for k in ('STORAGE_SOURCE', 'UPLOAD_SOURCE', 'JOIN_BASE'))
          assert git('merge-base', storage, upload) == base
          def changed(ref): return set(git('diff', '--name-only', base, ref).splitlines())
          def entry(ref, name): return git('ls-tree', ref, '--', name)
          left, right = changed(storage), changed(upload)
          workflow = '.github/workflows/cloud-upload-maintenance-contracts.yml'
          additions = {'tests/integration/cloud-upload-maintenance-pins-v6.json'}
          reviewed = {workflow, '.github/workflows/alpha-topology.yml',
              'docs/IMPLEMENTATION_STATUS.md', 'tests/integration/kvm-alpha-topology.sh',
              'tests/integration/run-alpha-topology-vm.sh',
              'tests/integration/cloud-upload-maintenance-provision.py',
              'tests/integration/cloud-upload-maintenance-smoke.py',
              'tests/integration/cloud-upload-maintenance-smoke.sh',
              'tests/integration/cloud-upload-maintenance-evidence.py',
              'tests/integration/cloud-upload-maintenance.mjs',
              'tests/integration/test-cloud-upload-maintenance-provision.py',
              'tests/integration/test-cloud-upload-maintenance-smoke.py',
              'tests/integration/test-cloud-upload-maintenance-shell.py',
              'tests/integration/test-cloud-upload-maintenance-evidence.py',
              'tests/integration/test-cloud-upload-maintenance-vm-wiring.py',
              'tests/integration/test-cloud-upload-maintenance.mjs',
              'tests/integration/test-kvm-alpha-topology-contract.sh', *additions}
          actual = set(git('diff', '--name-only', storage, 'HEAD').splitlines())
          assert actual == right | additions, actual.symmetric_difference(right | additions)
          assert changed('HEAD') == left | right | additions
          bindings = {}
          for name in sorted(left | right | additions):
              a, b = entry(storage, name), entry(upload, name)
              if name not in reviewed:
                  expected = a if name in left else b
                  if name in left & right: assert a == b, name
                  assert entry('HEAD', name) == expected, name
              bindings[name] = dict(storage=a, upload=b, joined=entry('HEAD', name))
          dependencies = ('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml',
              'crates/volparossa/Cargo.toml', 'crates/volparossa-agent/Cargo.toml',
              'crates/volparossa-local-control/Cargo.toml',
              'crates/volparossa-agent/src/mptcp_transport/acquire_diagnostic.rs',
              'crates/volparossa-helper/src/worker_transport.rs',
              'crates/volparossa-helper/src/engine_v3.rs',
              'tests/integration/agent-private-task-code.py',
              'tests/integration/agent-private-task-code-pins.json',
              'tests/helper/debian13-amd64-image-v1.json',
              'tests/integration/storage-consumer-maintenance-pins.json',
              *(f'tests/integration/storage-consumer-maintenance-pins-v{v}.json' for v in range(2, 11)),
              'tests/integration/cloud-upload-maintenance-pins.json',
              *(f'tests/integration/cloud-upload-maintenance-pins-v{v}.json' for v in range(2, 6)))
          for name in dependencies:
              parent = upload if '/cloud-upload-maintenance-pins' in name else storage
              assert entry('HEAD', name) == entry(parent, name), name
          runner = 'scripts/run-isolated-test.sh'
          assert entry('HEAD', runner) == entry(storage, runner) == entry(upload, runner)
          assert git('rev-parse', 'HEAD:' + runner) == 'ba5c00260f42777c7fa72f46c6f9029f530a41aa'
          record = dict(version=2, source_commit=os.environ['GITHUB_SHA'],
              workflow_commit=os.environ['GITHUB_WORKFLOW_SHA'], source_tree=git('rev-parse', 'HEAD^{tree}'),
              storage_source=storage, upload_source=upload, join_base=base,
              source_blobs={n:entry('HEAD', n) for n in sorted(actual)},
              parent_bindings=bindings, dependency_blobs={n:entry('HEAD', n) for n in dependencies},
              runner_blob=git('rev-parse', 'HEAD:' + runner),
              scope='finite-upload-profile-6-shared-consumer-10-and-tls-close-v9-contracts',
              kernel_test_scope='signed-reserve-loopback-mptcp-and-tcp-provider-close-order',
              historical_consumer_pins_unchanged=True, historical_upload_pins_unchanged=True,
              actual_peer_maintenance=False, real_datapath_execution=False,
              original_tls_failure_resolved=False)
          pathlib.Path('cloud-upload-contract-evidence/source.json').write_text(json.dumps(record, sort_keys=True)+'\n')
          PY
      - name: Install existing pinned Rust toolchain on hosted runner
        id: toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update --component clippy --component rustfmt
          rustc --version --verbose
          cargo --version --verbose
      - name: Install reviewed Protobuf on disposable hosted runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(dpkg --print-architecture)" = amd64
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler=3.21.12-8.2ubuntu0.3
          test "$(protoc --version)" = 'libprotoc 3.21.12'
      - name: Stage only the existing verified Node runtime on the hosted runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          timeout --kill-after=5s 240s python3 -B - <<'PY'
          import json, os, pathlib, runpy, subprocess, tarfile, tempfile
          helper = runpy.run_path('tests/integration/agent-private-task-code.py')
          pins = json.loads(pathlib.Path('tests/integration/storage-consumer-maintenance-pins-v9.json').read_text())
          selected = json.loads(pathlib.Path('tests/integration/storage-consumer-maintenance-pins-v10.json').read_text())
          runtime = pins['runtime']
          upload = json.loads(pathlib.Path('tests/integration/cloud-upload-maintenance-pins-v6.json').read_text())
          assert runtime == selected['runtime'] == upload['runtime'] == helper['load_pins']()['runtime']
          assert runtime['version'] == '24.19.0'
          root = pathlib.Path(tempfile.mkdtemp(prefix='storage-contract-node.', dir=os.environ['RUNNER_TEMP']))
          archive = root / 'node.tar.xz'
          helper['fetch'](runtime['url'], archive, runtime)
          with tarfile.open(archive, 'r:xz') as bundle:
              helper['extract_runtime'](bundle, root / 'runtime', runtime['files'])
          binary = root / 'runtime/bin/node'
          assert subprocess.check_output([str(binary), '--version'], text=True, timeout=10).strip() == 'v24.19.0'
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(binary.parent) + '\n')
          pathlib.Path('cloud-upload-contract-evidence/node-runtime.json').write_text(json.dumps(dict(
              version=1, runtime=runtime, archive_verified=True, files_verified=True,
              package_scripts_executed=False, application_sources_downloaded=False), sort_keys=True) + '\n')
          PY
      - name: Exercise inert consumer profile and maintenance export contracts
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          for suite in storage-consumer-maintenance-provision storage-consumer-maintenance-smoke storage-consumer-maintenance-evidence storage-consumer-maintenance-shell private-storage-maintenance-smoke private-storage-maintenance-wiring storage-fixture-correlation-sampler storage-provider-activity-sampler storage-consumer-network cloud-upload-maintenance-provision cloud-upload-maintenance-smoke cloud-upload-maintenance-evidence cloud-upload-maintenance-shell cloud-upload-maintenance-vm-wiring storage-acquire-diagnostic alpha-vm-diagnostics; do
            test_seconds=180
            if test "$suite" = cloud-upload-maintenance-evidence; then test_seconds=360; fi
            timeout --kill-after=5s "$test_seconds" python3 -B "tests/integration/test-$suite.py" -v \
              2>&1 | tee "cloud-upload-contract-evidence/python-$suite.log"
          done
          timeout --kill-after=5s 180s node --test --test-reporter=tap tests/integration/test-storage-consumer-maintenance.mjs \
            2>&1 | tee cloud-upload-contract-evidence/node-consumer.log
          timeout --kill-after=5s 180s node --test --test-reporter=tap tests/integration/test-cloud-upload-maintenance.mjs \
            2>&1 | tee cloud-upload-contract-evidence/node-upload.log
          for script in private-storage-maintenance-smoke storage-consumer-maintenance-smoke cloud-upload-maintenance-smoke private-storage-fragments-smoke kvm-alpha-topology run-alpha-topology-vm; do
            sh -n "tests/integration/$script.sh"
          done
          python3 -B - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('cloud-upload-contract-evidence')
          suites = ('storage-consumer-maintenance-provision', 'storage-consumer-maintenance-smoke',
              'storage-consumer-maintenance-evidence', 'storage-consumer-maintenance-shell',
              'private-storage-maintenance-smoke', 'private-storage-maintenance-wiring',
              'storage-fixture-correlation-sampler', 'storage-provider-activity-sampler', 'storage-consumer-network',
              'cloud-upload-maintenance-provision', 'cloud-upload-maintenance-smoke',
              'cloud-upload-maintenance-evidence', 'cloud-upload-maintenance-shell',
              'cloud-upload-maintenance-vm-wiring', 'storage-acquire-diagnostic', 'alpha-vm-diagnostics')
          expected_python = {'storage-consumer-maintenance-provision':14,
              'storage-consumer-maintenance-smoke':54, 'storage-consumer-maintenance-evidence':31,
              'storage-consumer-maintenance-shell':9, 'private-storage-maintenance-smoke':85,
              'private-storage-maintenance-wiring':41, 'storage-fixture-correlation-sampler':27,
              'storage-provider-activity-sampler':17, 'storage-consumer-network':12,
              'cloud-upload-maintenance-provision':14, 'cloud-upload-maintenance-smoke':19,
              'cloud-upload-maintenance-evidence':36, 'cloud-upload-maintenance-shell':17,
              'cloud-upload-maintenance-vm-wiring':13, 'storage-acquire-diagnostic':33,
              'alpha-vm-diagnostics':10}
          counts, names = {}, []
          for suite in suites:
              path = root / f'python-{suite}.log'
              assert path.stat().st_size <= 1048576, suite
              raw = path.read_text()
              totals = re.findall(r'^Ran ([0-9]+) tests? in [0-9.]+s$', raw, re.M)
              passed = re.findall(r'^(test_\S+) \(([^\n]+)\) \.\.\. ok$', raw, re.M)
              assert len(totals) == 1 and 1 <= int(totals[0]) <= 512, suite
              assert len(passed) == int(totals[0]), suite
              assert re.findall(r'^OK(?: .*)?$', raw, re.M) == ['OK'], suite
              assert not re.search(r'\bskipped\b|^FAILED', raw, re.M), suite
              counts[suite] = len(passed)
              names.extend(suite + ':' + scope + ':' + name for name, scope in passed)
          assert len(names) == len(set(names))
          assert counts == expected_python and len(names) == 432
          node_names, node_counts = [], {}
          for suite in ('consumer', 'upload'):
              node = (root / f'node-{suite}.log').read_text()
              passed = re.findall(r'^ok [0-9]+ - ([^\n]+)$', node, re.M)
              totals = re.findall(r'^# tests ([0-9]+)$', node, re.M)
              assert len(totals) == 1 and 1 <= int(totals[0]) <= 512
              assert len(passed) == len(set(passed)) == int(totals[0])
              assert re.findall(r'^# pass ([0-9]+)$', node, re.M) == totals
              for field in ('fail', 'cancelled', 'skipped', 'todo'):
                  assert re.findall(r'^# ' + field + r' ([0-9]+)$', node, re.M) == ['0']
              node_counts[suite] = len(passed)
              node_names.extend(suite + ':' + name for name in passed)
          assert len(node_names) == len(set(node_names))
          assert node_counts == dict(consumer=50, upload=15) and len(node_names) == 65
          (root / 'harness-tests.json').write_text(json.dumps(dict(version=2, python_counts=counts,
              python_unique_tests=len(names), python_test_names=sorted(names), node_counts=node_counts,
              node_unique_tests=len(node_names), node_test_names=sorted(node_names),
              live_consumer_acceptance=False, real_datapath_execution=False), sort_keys=True) + '\n')
          PY
      - name: Compile affected agent local control and CLI tests
        id: build
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo test --locked --offline -p volparossa-agent -p volparossa-local-control -p volparossa --no-run --message-format=json \
            > cloud-upload-contract-evidence/build.jsonl 2> cloud-upload-contract-evidence/build.log
          python3 -B - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('cloud-upload-contract-evidence')
          records = [json.loads(line) for line in (root / 'build.jsonl').read_text().splitlines()]
          executables = [row['executable'] for row in records if row.get('reason') == 'compiler-artifact'
              and row.get('target', {}).get('name') == 'volparossa_agent'
              and row.get('profile', {}).get('test') and row.get('executable')]
          assert len(executables) == 1
          binary = pathlib.Path(executables[0]).resolve(strict=True)
          assert binary.is_file() and binary.is_relative_to(pathlib.Path.cwd() / 'target')
          tests = (
              'content::tls::tests::kernel_close::signed_reserve_survives_tcp_provider_and_proxy_drop_before_outer_finish',
              'content::tls::tests::kernel_close::signed_reserve_rejects_abrupt_outer_drop_after_inner_finish',
          )
          for index, name in enumerate(tests):
              inventory = subprocess.check_output([str(binary), '--ignored', '--exact', name, '--list'], text=True)
              assert inventory.splitlines() == [name + ': test', '', '1 test, 0 benchmarks']
              (root / f'kernel-{index}-inventory.log').write_text(inventory)
          (root / 'kernel-tests.json').write_text(json.dumps(tests) + '\n')
          (root / 'binary.txt').write_text(str(binary) + '\n')
          PY
      - name: Inventory and execute disjoint retirement contracts
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          group() {
            local label="$1" filter="$2"
            timeout --kill-after=5s 180s cargo test --locked --offline -p volparossa-agent --lib "$filter" -- --list \
              2>&1 | tee "cloud-upload-contract-evidence/$label-inventory.log"
            timeout --kill-after=5s 180s cargo test --locked --offline -p volparossa-agent --lib "$filter" \
              2>&1 | tee "cloud-upload-contract-evidence/$label-test.log"
          }
          group new lost_helper_retirement_
          group admission tcp_flow_admission_
          group disconnect route_setup::tests::client_disconnect_
          group expiry route_setup::tests::client_route_expiry_
          group classification route_setup::tests::mptcp_acquire_
          timeout --kill-after=5s 180s cargo test --locked --offline -p volparossa --bin volparossa enrollment_authority:: -- --list \
            2>&1 | tee cloud-upload-contract-evidence/authority-inventory.log
          timeout --kill-after=5s 180s cargo test --locked --offline -p volparossa --bin volparossa enrollment_authority:: \
            2>&1 | tee cloud-upload-contract-evidence/authority-test.log
          python3 -B - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('cloud-upload-contract-evidence')
          counts, all_names = {}, []
          for label in ('new', 'admission', 'disconnect', 'expiry', 'classification', 'authority'):
              inventory = (root / (label + '-inventory.log')).read_text()
              output = (root / (label + '-test.log')).read_text()
              names = re.findall(r'^([^\n]+): test$', inventory, re.M)
              assert 1 <= len(names) <= 512 and len(names) == len(set(names)), label
              results = re.findall(r'^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; \d+ filtered out;', output, re.M)
              assert results == [str(len(names))], label
              for name in names:
                  assert len(re.findall(r'^test ' + re.escape(name) + r' \.\.\. ok$', output, re.M)) == 1
              counts[label] = len(names)
              all_names.extend(names)
          assert counts == dict(new=7, admission=8, disconnect=3, expiry=2, classification=1, authority=5)
          assert len(all_names) == 26
          assert len(all_names) == len(set(all_names))
          (root / 'rust-tests.json').write_text(json.dumps(dict(version=1, counts=counts,
              unique_tests=len(all_names), test_names=sorted(all_names), live_consumer_acceptance=False,
              real_datapath_execution=False, original_timeout_cause_proven=False), sort_keys=True) + '\n')
          PY
      - name: Inventory and execute new closed TLS v9 contracts across all three layers
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          group() {
            local label="$1" package="$2"
            shift 2
            timeout --kill-after=5s 180s cargo test --locked --offline -p "$package" "$@" tls_close_v9_ -- --list \
              2>&1 | tee "cloud-upload-contract-evidence/v9-$label-inventory.log"
            timeout --kill-after=5s 180s cargo test --locked --offline -p "$package" "$@" tls_close_v9_ \
              2>&1 | tee "cloud-upload-contract-evidence/v9-$label-test.log"
          }
          group local-control volparossa-local-control --lib
          group agent volparossa-agent --lib
          group cli volparossa --bin volparossa
          python3 -B - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('cloud-upload-contract-evidence')
          counts, all_names = {}, []
          for label, expected in (('local-control', 4), ('agent', 10), ('cli', 10)):
              inventory = (root / f'v9-{label}-inventory.log').read_text()
              output = (root / f'v9-{label}-test.log').read_text()
              names = re.findall(r'^([^\n]+): test$', inventory, re.M)
              assert len(names) == len(set(names)) == expected, label
              results = re.findall(r'^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; \d+ filtered out;', output, re.M)
              assert results == [str(expected)], label
              for name in names:
                  assert len(re.findall(r'^test ' + re.escape(name) + r' \.\.\. ok$', output, re.M)) == 1
              counts[label] = expected
              all_names.extend(names)
          previous = json.loads((root / 'rust-tests.json').read_text())['test_names']
          assert len(all_names) == len(set(all_names)) == 24
          assert not set(all_names).intersection(previous)
          (root / 'tls-v9-tests.json').write_text(json.dumps(dict(version=1, counts=counts,
              unique_tests=24, test_names=sorted(all_names), previous_contracts=26,
              total_disjoint_contracts=50, live_consumer_acceptance=False,
              original_timeout_cause_proven=False), sort_keys=True) + '\n')
          PY
      - name: Check firewall snapshot normalization before the isolated test
        run: |
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          def normalize(text):
              return subprocess.check_output(['awk', os.environ['FIREWALL_NORMALIZER']],
                  input=text.encode(), env={**os.environ, 'LC_ALL': 'C'})
          checked = 0
          for program in ['iptables-save', 'ip6tables-save']:
              for backend in ['', ' (nf_tables)']:
                  before = (f'# Generated by {program} v1.8.10{backend} on Thu Oct 15 10:10:10 2026\n'
                      '*filter\n:INPUT ACCEPT [1:2]\n:custom-chain - [3:4]\n'
                      '-A INPUT -m comment --comment "semantic [1:2]" -j custom-chain\n'
                      'COMMIT\n# Completed on Thu Oct 15 10:10:10 2026\n')
                  after = before.replace('10:10:10', '11:11:11').replace('ACCEPT [1:2]',
                      'ACCEPT [99:100]').replace('- [3:4]', '- [101:102]')
                  assert normalize(before) == normalize(after)
                  checked += 1
                  for old, new in [('ACCEPT', 'DROP'), ('custom-chain', 'other-chain'),
                      ('semantic [1:2]', 'semantic [9:10]'), ('*filter', '*nat'),
                      ('v1.8.10', 'v1.8.11'), ('COMMIT\n', ''),
                      ('v1.8.10' + backend, 'v1.8.10 (legacy)'),
                      ('10:10:10', 'unrecognized-timestamp')]:
                      assert normalize(before) != normalize(before.replace(old, new))
                      checked += 1
                  for embedded in ['# Completed on Thu Oct 15 10:10:10 2026',
                      ':INPUT ACCEPT [1:2]', f'# Generated by {program} v1.8.10{backend} on Thu Oct 15 10:10:10 2026']:
                      try:
                          normalize(before.replace('semantic [1:2]', 'first\n' + embedded + '\nlast'))
                      except subprocess.CalledProcessError:
                          pass
                      else:
                          raise AssertionError('multiline rule must fail closed')
                      checked += 1
          assert checked == 48
          pathlib.Path('cloud-upload-contract-evidence/firewall-normalizer.json').write_text(
              json.dumps(dict(checks=checked, passed=True, scope='inert-normalizer-fixtures'), sort_keys=True) + '\n')
          PY
      - name: Run both exact TLS close contracts in disposable loopback namespaces
        run: |
          set -euo pipefail
          parent_namespace=$(readlink /proc/self/ns/net)
          printf '%s\n' "$parent_namespace" > cloud-upload-contract-evidence/parent-netns.txt
          {
            ip -4 -j route show table all | sha256sum
            ip -6 -j route show table all | sha256sum
            sha256sum /etc/resolv.conf
            sudo -n env LC_ALL=C iptables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
            sudo -n env LC_ALL=C ip6tables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
          } > cloud-upload-contract-evidence/host-before.sha256
          read -r binary < cloud-upload-contract-evidence/binary.txt
          mapfile -t kernel_tests < <(python3 -B -c 'import json; print(*json.load(open("cloud-upload-contract-evidence/kernel-tests.json")), sep="\n")')
          test "${#kernel_tests[@]}" = 2
          kernel_status=0
          for index in 0 1; do
            test_name=${kernel_tests[$index]}
            set +e
            VOLPAROSSA_TEST_ALLOW_SUDO_NETNS=1 scripts/run-isolated-test.sh --command \
              "$binary" "$test_name" VOLPAROSSA_EXACT_CONTENT_PARENT_NETNS loopback \
              --ignored --exact "$test_name" --nocapture \
              2>&1 | tee "cloud-upload-contract-evidence/kernel-$index-test.log"
            status=$?
            set -e
            printf '%s\n' "$status" > "cloud-upload-contract-evidence/kernel-$index-exit.txt"
            if test "$status" != 0; then kernel_status=1; fi
          done
          test "$(readlink /proc/self/ns/net)" = "$parent_namespace"
          python3 -B - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('cloud-upload-contract-evidence')
          tests = json.loads((root / 'kernel-tests.json').read_text())
          assert len(tests) == len(set(tests)) == 2
          for index, name in enumerate(tests):
              assert (root / f'kernel-{index}-exit.txt').read_text().strip() == '0'
              output = (root / f'kernel-{index}-test.log').read_text()
              summaries = [line for line in output.splitlines() if line.startswith('test result:')]
              assert len(summaries) == 1
              assert re.fullmatch(r'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s', summaries[0])
              assert re.findall(r'^test (.+) \.\.\. ok$', output, re.M) == [name]
          (root / 'kernel-results.json').write_text(json.dumps(dict(version=1,
              unique_tests=2, test_names=tests, passed=True,
              genuine_loopback_kernel_mptcp=True, real_loopback_tcp_provider=True,
              production_nested_tls_and_proxy=True, signed_reserve_receipt_verified=True,
              normal_close_after_peer_drop=True, abrupt_outer_close_rejected=True,
              full_relay_datapath_proven=False, multiple_live_subflows_proven=False,
              live_consumer_acceptance=False, original_timeout_cause_proven=False), sort_keys=True) + '\n')
          PY
          exit "$kernel_status"
      - name: Lint affected agent local control and CLI
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo clippy --locked --offline -p volparossa-agent -p volparossa-local-control -p volparossa --all-targets --all-features -- -D warnings \
            2>&1 | tee cloud-upload-contract-evidence/clippy.log
      - name: Check formatting without changing source
        if: ${{ always() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee cloud-upload-contract-evidence/format.log
      - name: Verify host network configuration after isolated tests
        if: always()
        run: |
          set -euo pipefail
          if test -f cloud-upload-contract-evidence/host-before.sha256; then
            read -r parent_namespace < cloud-upload-contract-evidence/parent-netns.txt
            test "$(readlink /proc/self/ns/net)" = "$parent_namespace"
            {
              ip -4 -j route show table all | sha256sum
              ip -6 -j route show table all | sha256sum
              sha256sum /etc/resolv.conf
              sudo -n env LC_ALL=C iptables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
              sudo -n env LC_ALL=C ip6tables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
            } > cloud-upload-contract-evidence/host-after.sha256
            cmp cloud-upload-contract-evidence/host-before.sha256 cloud-upload-contract-evidence/host-after.sha256
          fi
      - name: Preserve original source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
      - name: Retain original source and bounded test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: cloud-upload-contracts-${{ github.run_id }}
          path: cloud-upload-contract-evidence/
          if-no-files-found: warn
          retention-days: 14

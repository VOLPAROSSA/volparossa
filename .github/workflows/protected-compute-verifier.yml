name: Protected compute verifier fixtures
run-name: Pinned public SNP certificate and report verification only

on:
  workflow_dispatch:
  push:
    branches: [feature/protected-compute-verifier]
    paths:
      - .github/workflows/protected-compute-verifier.yml
      - tests/integration/protected-compute-verifier*
      - tests/integration/test-protected-compute-verifier.py
      - third_party/licenses/virtee-sev-8.0.0-Apache-2.0.txt

permissions:
  contents: read

concurrency:
  group: protected-compute-verifier-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  public-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact VOLPAROSSA source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check inert fixture and workflow contracts
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -B tests/integration/test-protected-compute-verifier.py
      - name: Install declared compiler only on disposable runner
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          test ! -e build/protected-compute-verifier
          install -d -m 0700 build/protected-compute-verifier/evidence
          rustc +1.85.0 --version --verbose > build/protected-compute-verifier/evidence/rustc.txt
          cargo +1.85.0 --version --verbose > build/protected-compute-verifier/evidence/cargo.txt
      - name: Fetch exact upstream source and verify public fixtures
        env:
          VERIFIER_SOURCE: ${{ runner.temp }}/volparossa-protected-compute-verifier-source
        run: |
          set -euo pipefail
          # Outside the core Cargo workspace; do not patch either manifest.
          test ! -e "$VERIFIER_SOURCE"
          git init "$VERIFIER_SOURCE"
          git -C "$VERIFIER_SOURCE" remote add origin https://github.com/virtee/sev.git
          timeout --kill-after=15s 180s git -C "$VERIFIER_SOURCE" fetch --depth=1 origin a966d06d9bf0e68afe2733e7bfbf278fd7fd65b5
          git -C "$VERIFIER_SOURCE" checkout --detach FETCH_HEAD
          python3 -B tests/integration/protected-compute-verifier.py source "$VERIFIER_SOURCE"
          python3 -B tests/integration/protected-compute-verifier.py prepare "$VERIFIER_SOURCE"
      - name: Fetch locked upstream dependencies without running tests
        env:
          VERIFIER_SOURCE: ${{ runner.temp }}/volparossa-protected-compute-verifier-source
          CARGO_HOME: ${{ github.workspace }}/build/protected-compute-verifier/cargo-home
        run: |
          set -euo pipefail
          python3 -B tests/integration/protected-compute-verifier.py source-effective "$VERIFIER_SOURCE"
          timeout --kill-after=15s 300s cargo +1.85.0 fetch --locked --manifest-path "$VERIFIER_SOURCE/Cargo.toml"
          python3 -B tests/integration/protected-compute-verifier.py source-effective "$VERIFIER_SOURCE"
      - name: Execute only four public cryptographic fixtures
        env:
          VERIFIER_SOURCE: ${{ runner.temp }}/volparossa-protected-compute-verifier-source
          CARGO_HOME: ${{ github.workspace }}/build/protected-compute-verifier/cargo-home
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/protected-compute-verifier/target
          CARGO_BUILD_JOBS: '2'
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          umask 077
          python3 -B tests/integration/protected-compute-verifier.py source-effective "$VERIFIER_SOURCE"
          # All inputs are public. Offline Cargo prevents dependency resolution;
          # this does not claim an OS network sandbox or confidential hardware.
          set +e
          timeout --kill-after=15s 900s cargo +1.85.0 test --locked --offline \
            --manifest-path "$VERIFIER_SOURCE/Cargo.toml" \
            --no-default-features --features snp,crypto_nossl --test certs 'snp::' \
            -- --test-threads=1 2>&1 | python3 -B tests/integration/protected-compute-verifier.py \
              capture build/protected-compute-verifier/evidence/tests.log
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > build/protected-compute-verifier/evidence/cargo-exit.txt
          printf '%s\n' "${statuses[1]}" > build/protected-compute-verifier/evidence/capture-exit.txt
          set -e
          python3 -B tests/integration/protected-compute-verifier.py receipt \
            "$VERIFIER_SOURCE" build/protected-compute-verifier/evidence "${statuses[0]}" "${statuses[1]}"
      - name: Retain original public fixture evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protected-compute-public-fixtures-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/protected-compute-verifier/evidence/rustc.txt
            build/protected-compute-verifier/evidence/cargo.txt
            build/protected-compute-verifier/evidence/cargo-exit.txt
            build/protected-compute-verifier/evidence/capture-exit.txt
            build/protected-compute-verifier/evidence/tests.log
            build/protected-compute-verifier/evidence/report.json

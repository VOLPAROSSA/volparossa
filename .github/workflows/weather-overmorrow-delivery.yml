name: Public Overmorrow products through protected core
run-name: Exact public v5 inputs — real two-product peer delivery and Overmorrow native tables

on:
  workflow_dispatch:
  push:
    branches: [feature/weather-overmorrow-v5]
    paths:
      - .github/workflows/weather-overmorrow-delivery.yml
      - tests/integration/weather-public-overmorrow-v5.json
      - tests/integration/weather-client-bundle.py
      - tests/integration/weather-client-delivery.sh
      - tests/integration/weather-products-delivery.py
      - tests/integration/weather-products-delivery.sh
      - tests/integration/run-alpha-topology-vm.sh
      - tests/integration/test-weather-overmorrow-hosted-wiring.py

permissions:
  contents: read
  actions: read

concurrency:
  group: weather-overmorrow-delivery-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  joined:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind exact source and inert joined contracts
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          python3 -B tests/integration/test-weather-overmorrow-hosted-wiring.py
          python3 -B tests/integration/test-weather-client-bundle.py
          python3 -B tests/integration/test-weather-products-delivery.py
          python3 -B tests/integration/test-weather-products-delivery-shell.py
          python3 -B tests/integration/test-weather-client-runner.py
          sh -n tests/integration/run-alpha-topology-vm.sh
          sh -n tests/integration/weather-products-delivery.sh
          record=tests/integration/weather-public-overmorrow-v5.json
          jq -e '.schema == 1 and .kind == "volparossa-weather-public-overmorrow-admission" and
            .scope == "disposable-joined-weather-only" and
            (.sources.weather.commit | test("^[0-9a-f]{40}$")) and
            (.artifacts.proof.commit | test("^[0-9a-f]{40}$")) and
            (.sources.browser.commit | test("^[0-9a-f]{40}$"))' "$record"
          printf 'WEATHER_SOURCE_COMMIT=%s\nHISTORICAL_WEATHER_COMMIT=%s\nBROWSER_SOURCE_COMMIT=%s\n' \
            "$(jq -r '.sources.weather.commit' "$record")" \
            "$(jq -r '.artifacts.proof.commit' "$record")" \
            "$(jq -r '.sources.browser.commit' "$record")" >> "$GITHUB_ENV"
          umask 077
          inputs="$RUNNER_TEMP/weather-overmorrow-public-inputs"
          output="$RUNNER_TEMP/weather-overmorrow-delivery"
          test ! -e "$inputs"
          test ! -e "$output"
          install -d -m 0700 "$inputs" "$inputs/provenance" "$output"
          printf 'WEATHER_INPUTS=%s\nWEATHER_OUTPUT=%s\n' "$inputs" "$output" >> "$GITHUB_ENV"
      - name: Retrieve exact reviewed Weather consumer sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VOLPAROSSA/volparossa-weather
          ref: ${{ env.WEATHER_SOURCE_COMMIT }}
          path: .cache/weather-public-source
          persist-credentials: false
      - name: Retrieve original hosted table-verifier source as nonexecuting data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VOLPAROSSA/volparossa-weather
          ref: ${{ env.HISTORICAL_WEATHER_COMMIT }}
          path: .cache/weather-historical-source
          persist-credentials: false
      - name: Retrieve exact reviewed Browser helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VOLPAROSSA/volparossa-browser
          ref: ${{ env.BROWSER_SOURCE_COMMIT }}
          path: .cache/browser-public-source
          persist-credentials: false
      - name: Retrieve only admitted public artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          record=tests/integration/weather-public-overmorrow-v5.json
          for kind in assets proof decoder abi; do
            repository=$(jq -er --arg kind "$kind" '.artifacts[$kind].repository' "$record")
            run_id=$(jq -er --arg kind "$kind" '.artifacts[$kind].run_id' "$record")
            artifact_id=$(jq -er --arg kind "$kind" '.artifacts[$kind].id' "$record")
            artifact_name=$(jq -er --arg kind "$kind" '.artifacts[$kind].name' "$record")
            case "$repository" in VOLPAROSSA/volparossa|VOLPAROSSA/volparossa-weather) ;; *) exit 1 ;; esac
            case "$run_id:$artifact_id" in *[!0-9:]*|:*|*:) exit 1 ;; esac
            gh api "repos/$repository/actions/runs/$run_id" \
              --jq '{id,run_attempt,head_sha,status,conclusion}' > "$WEATHER_INPUTS/provenance/$kind-run.json"
            gh api "repos/$repository/actions/artifacts/$artifact_id" \
              --jq '{id,name,size_in_bytes,digest,expired,workflow_run}' > "$WEATHER_INPUTS/provenance/$kind-artifact.json"
            python3 -B - "$record" "$kind" "$WEATHER_INPUTS/provenance" <<'PY'
          # BEGIN PUBLIC_ARTIFACT_METADATA
          import json, re, sys
          from pathlib import Path
          record, kind, directory = Path(sys.argv[1]), sys.argv[2], Path(sys.argv[3])
          pin = json.loads(record.read_text())["artifacts"][kind]
          run = json.loads((directory / (kind + "-run.json")).read_text())
          artifact = json.loads((directory / (kind + "-artifact.json")).read_text())
          assert set(pin) == {"repository", "run_id", "commit", "id", "name", "sha256", "bytes"}
          assert pin["repository"] in {"VOLPAROSSA/volparossa", "VOLPAROSSA/volparossa-weather"}
          assert all(type(pin[key]) is int and pin[key] > 0 for key in ("run_id", "id", "bytes"))
          assert pin["bytes"] <= 256 * 1024**2 and re.fullmatch(r"[0-9a-f]{40}", pin["commit"])
          assert re.fullmatch(r"[0-9a-f]{64}", pin["sha256"])
          assert re.fullmatch(r"[a-z0-9-]{1,160}", pin["name"])
          assert run == dict(id=pin["run_id"], run_attempt=1, head_sha=pin["commit"],
                             status="completed", conclusion="success")
          assert artifact["id"] == pin["id"] and artifact["name"] == pin["name"]
          assert artifact["size_in_bytes"] == pin["bytes"] and artifact["expired"] is False
          assert artifact["digest"] == "sha256:" + pin["sha256"]
          assert artifact["workflow_run"]["id"] == pin["run_id"]
          assert artifact["workflow_run"]["head_sha"] == pin["commit"]
          # END PUBLIC_ARTIFACT_METADATA
          PY
            test ! -e "$WEATHER_INPUTS/$kind"
            gh run download "$run_id" --repo "$repository" --name "$artifact_name" --dir "$WEATHER_INPUTS/$kind"
          done
      - name: Capture and fully verify v5 without executing its runtimes
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C .cache/weather-public-source rev-parse HEAD)" = "$WEATHER_SOURCE_COMMIT"
          test "$(git -C .cache/weather-historical-source rev-parse HEAD)" = "$HISTORICAL_WEATHER_COMMIT"
          test "$(git -C .cache/browser-public-source rev-parse HEAD)" = "$BROWSER_SOURCE_COMMIT"
          archive="$WEATHER_INPUTS/weather-client-v5.tar"
          python3 -B tests/integration/weather-client-bundle.py capture-v5 \
            "$GITHUB_WORKSPACE/.cache/weather-public-source" "$GITHUB_WORKSPACE/.cache/weather-historical-source" \
            "$GITHUB_WORKSPACE/.cache/browser-public-source" \
            "$WEATHER_INPUTS/assets" "$WEATHER_INPUTS/proof" "$WEATHER_INPUTS/decoder" "$WEATHER_INPUTS/abi" \
            "$archive" > "$WEATHER_INPUTS/provenance/capture.json"
          jq -e '.synthetic_ui_proven == true and .synthetic_native_tables_proven == true and
            .current_origin_acquisition_proven == false and .joined_delivery_proven == false' \
            "$WEATHER_INPUTS/provenance/capture.json"
          manifest=$(jq -er '.manifest_sha256 | select(test("^[0-9a-f]{64}$"))' "$WEATHER_INPUTS/provenance/capture.json")
          python3 -B tests/integration/weather-client-bundle.py verify-runtime "$archive" "$manifest" \
            > "$WEATHER_INPUTS/provenance/verify-runtime.json"
          python3 -B tests/integration/weather-client-bundle.py runtime-version "$archive" "$manifest" \
            > "$WEATHER_INPUTS/provenance/runtime-version.json"
          jq -e '.bundle_version == 5 and .runtime_executed == false' "$WEATHER_INPUTS/provenance/runtime-version.json"
          printf 'WEATHER_ARCHIVE=%s\nWEATHER_MANIFEST=%s\n' "$archive" "$manifest" >> "$GITHUB_ENV"
      - name: Install tools only on this disposable hosted runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential cmake git libevent-dev pkg-config qemu-system-x86 qemu-utils \
            cloud-image-utils openssh-client curl jq util-linux iproute2
          test -c /dev/kvm
          test "$(stat -Lc '%u' /dev/kvm)" = 0
          kvm_gid=$(stat -Lc '%g' /dev/kvm)
          case "$kvm_gid" in ''|0|0*|*[!0-9]*) exit 1 ;; esac
          test "$(getent group "$kvm_gid" | awk -F: -v gid="$kvm_gid" \
            '$1 == "kvm" && $3 == gid { print $1 ":" $3 }')" = "kvm:$kvm_gid"
          qemu-system-x86_64 -accel help | grep -Fx kvm
          printf 'WEATHER_KVM_GID=%s\n' "$kvm_gid" >> "$GITHUB_ENV"
      - name: Build the existing exact pinned mqvpn runtime
        run: |
          set -euo pipefail
          native/volparossa-mpquic/scripts/fetch-upstream.sh --yes
          VMP_BUILD_JOBS=2 VMP_RUN_TESTS=no native/volparossa-mpquic/scripts/build-upstream.sh
          binary="$GITHUB_WORKSPACE/native/volparossa-mpquic/build/volparossa-mpquic"
          test -f "$binary"
          test -x "$binary"
          test "$("$binary" --api-version)" = 7
          test "$(stat -Lc '%s' "$binary")" -le 67108864
          printf 'WEATHER_MPQUIC=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Retrieve and verify the existing pinned Debian 13 image
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/debian-13-genericcloud-amd64-20260826-2582.qcow2"
          curl --fail --show-error --silent --location --connect-timeout 30 --max-time 1200 \
            --max-filesize 2147483648 --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --output "$image" "$(jq -er '.url' tests/helper/debian13-amd64-image-v1.json)"
          chmod 0600 "$image"
          printf '%s  %s\n' \
            184761b0dad0f9ace02f9298050ca96ce3caa39a461a47706d47ff9698b59933918b91b40177fbd4d392f6446af8b4d18ecb94caca988169b19641606bf34003 \
            "$image" | sha512sum --check --strict -
          printf 'WEATHER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Run actual protected cold peer delivery and both Overmorrow native tables
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          # BEGIN FINAL_SOURCE_PREFLIGHT
          import os, subprocess, sys
          assert subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() == os.environ["GITHUB_SHA"]
          status = subprocess.check_output(["git", "-c", "core.quotePath=true", "status", "--porcelain=v1",
              "--untracked-files=normal", "--ignore-submodules=none"])
          if status:
              print("source worktree must be clean", file=sys.stderr)
              # Only Git-quoted status names from this public CI checkout; no contents.
              print(status[:8192].decode("ascii", errors="backslashreplace"), file=sys.stderr)
              if len(status) > 8192:
                  print("status output truncated", file=sys.stderr)
              raise SystemExit(64)
          # END FINAL_SOURCE_PREFLIGHT
          PY
          runner_uid=$(id -u)
          case "$runner_uid" in ''|0|0*|*[!0-9]*) exit 1 ;; esac
          sudo -n -- /usr/bin/setpriv --reuid "$runner_uid" --regid "$WEATHER_KVM_GID" \
            --clear-groups --inh-caps=-all --ambient-caps=-all --bounding-set=-all \
            --no-new-privs --reset-env -- \
            "$GITHUB_WORKSPACE/tests/integration/run-alpha-topology-vm.sh" --execute --yes \
            --scenario content-provider --image "$WEATHER_IMAGE" --mpquic "$WEATHER_MPQUIC" \
            --weather-client-bundle "$WEATHER_ARCHIVE" --weather-client-manifest-sha256 "$WEATHER_MANIFEST" \
            --output "$WEATHER_OUTPUT" --expected-commit "$GITHUB_SHA"
      - name: Require current aggregate and joined two-product evidence
        run: |
          set -euo pipefail
          python3 -B tests/integration/content-provider-smoke.py report \
            "$WEATHER_OUTPUT/content-provider-smoke.json" "$GITHUB_SHA"
          python3 -B - "$WEATHER_OUTPUT" "$WEATHER_MANIFEST" <<'PY'
          # BEGIN JOINED_EVIDENCE
          import hashlib, json, os, runpy, stat, sys
          from pathlib import Path
          output, manifest = Path(sys.argv[1]), sys.argv[2]
          checker = runpy.run_path(str(Path("tests/integration/weather-products-delivery.py").resolve()))
          values, raw = {}, {}
          for suffix in ("cold-evidence", "evidence", "acquisition", "original-report", "tree-before",
                         "tree-after", "cache-before", "cache-after", "input-cleanup"):
              path = output / ("weather-products-delivery-" + suffix + ".json")
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as stream:
                  info = os.fstat(stream.fileno())
                  assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_uid == os.getuid()
                  assert not info.st_mode & 0o022 and 0 < info.st_size <= 65536
                  raw[suffix] = stream.read(65537)
                  assert len(raw[suffix]) == info.st_size
                  after = os.fstat(stream.fileno())
                  assert all(getattr(after, field) == getattr(info, field) for field in
                      ("st_dev", "st_ino", "st_mode", "st_nlink", "st_uid", "st_gid", "st_size", "st_mtime_ns", "st_ctime_ns"))
              values[suffix] = json.loads(raw[suffix], object_pairs_hook=checker["B"]["B"]["unique_pairs"])
              checker["validate_export"](suffix, values[suffix])
          evidence, cold, browser = (values[key] for key in ("evidence", "cold-evidence", "original-report"))
          acquisition = values["acquisition"]
          assert evidence["schema"] == browser["schema"] == 5
          assert cold["schema"] == acquisition["schema"] == 4
          assert acquisition["decoder_sha256"] == cold["decoder_sha256"] == evidence["decoder_sha256"]
          assert evidence["bundle_manifest_sha256"] == cold["bundle_manifest_sha256"] == manifest
          assert browser["source"]["bundle_manifest_sha256"] == manifest
          # Original synthetic UI/table proofs remain historical, not joined results.
          admitted = checker["B"]["public_overmorrow_admission"]()["files"]
          prefix = "volparossa-weather/integrations/overmorrow/"
          for key, retained, driver in (
              ("synthetic_ui_proof", "hosted-browser-proof.json", "smoke_browser.py"),
              ("synthetic_table_proof", "hosted-table-proof.json", "smoke_table_browser.py")):
              proof = browser["source"][key]
              assert proof["sha256"] == admitted[prefix + retained]["sha256"]
              assert proof["driver_sha256"] == admitted[prefix + driver]["sha256"]
              assert proof["core_executed"] is False and proof["overlay_proven"] is False
          assert browser["source"]["synthetic_table_proof"]["verifier_sha256"] == admitted[
              prefix + "hosted-proof/historical-smoke_core_browser_v3.py"]["sha256"]
          for key, relative in (("driver_sha256", "smoke_core_browser.py"),
                                ("preparer_sha256", "prepare_core_browser.mjs")):
              assert browser["source"][key] == admitted[prefix + relative]["sha256"]
          assert evidence["core_sha256"] == cold["core_sha256"] == browser["expected"]["core_sha256"]
          assert evidence["products"] == cold["products"]
          for key in ("weather", "air_quality"):
              product, acquired, observed = evidence["products"][key], acquisition["products"][key], browser["products"][key]
              assert acquired["forecast_sha256"] == product["forecast_sha256"]
              assert acquired["forecast_bytes"] == product["forecast_bytes"]
              assert len(acquired["fields"]) == product["acquired_fields"]
              for field in ("forecast_sha256", "manifest_id", "cold_receipt_sha256"):
                  assert observed["expected"][field] == product[field]
              checks = observed["checks"]
              assert checks["initial_dom_display_sha256"] == checks["refresh_dom_display_sha256"] == observed["expected"]["display_sha256"]
              assert checks["browser_api_requests"] == 2 and checks["provider_requests_checked"] == 1
              assert all(checks[name] is True for name in ("initial_dom_matches_cold_publication",
                  "refresh_dom_matches_cold_publication", "exact_native_times_and_values",
                  "explicit_missing_capabilities", "no_external_resources", "source_attribution"))
          assert evidence["browser_report_sha256"] == hashlib.sha256(raw["original-report"]).hexdigest()
          assert evidence["success"] is True and evidence["scope"]["end_to_end_proven"] is True
          assert evidence["scope"]["actual_overmorrow_ui"] is True and evidence["scope"]["actual_ui_refresh"] is True
          assert browser["scope"]["actual_overmorrow_ui"] is True and browser["scope"]["real_core_adapter"] is True
          assert browser["scope"]["actual_http_bridge"] is True and browser["scope"]["separate_native_runs"] is True
          assert browser["passed"] is True and browser["phase"] == "complete"
          assert browser["scope"]["synthetic_weather"] is False and browser["scope"]["synthetic_air_quality"] is False
          assert all(browser["cleanup"].values()) and all(browser["outer_cleanup"].values())
          assert values["tree-before"] == values["tree-after"]
          assert values["cache-before"] == values["cache-after"]
          assert values["tree-before"]["manifest_sha256"] == manifest
          assert values["input-cleanup"] == dict(directory_removed=True, files_removed=True)
          # END JOINED_EVIDENCE
          PY
      - name: Retain bounded original evidence, never the input bundle or profiles
        if: always() && env.WEATHER_OUTPUT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather-overmorrow-delivery-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.WEATHER_OUTPUT }}
            ${{ env.WEATHER_INPUTS }}/provenance/*.json
      - name: State exact scope and failure visibility
        if: always()
        run: |
          printf '%s\n' \
            'Inspect original reports: success requires real acquisition, two protected cold transfers, and exact initial/refresh Overmorrow native tables.' \
            'Origin HTTPS acquisition is outside the overlay; publications keep independent runs, native times and expiry.' \
            'Original synthetic UI/table proofs remain unchanged historical evidence; current acquisition/cold schema 4 and joined browser/final schema 5 are separate.' \
            'No private legacy bundle, decoder-admission-only success, browser-triggered cold-fetch claim, mobile proof or production release authority.' \
            'Failure, including source rate limiting, is retained without automatic retry.' >> "$GITHUB_STEP_SUMMARY"

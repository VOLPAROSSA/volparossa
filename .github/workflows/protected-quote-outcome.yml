name: Protected quote outcome contracts
run-name: Quote and key-confirmation source checks without hardware or route claims

on:
  workflow_dispatch:
  push:
    branches: [feature/protected-compute-quote-outcome, feature/protected-compute-key-confirmation]

permissions:
  contents: read

concurrency:
  group: protected-quote-outcome-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require unchanged source and a disposable hosted runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = VOLPAROSSA/volparossa
          test "$(id -u)" != 0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse 'HEAD^{tree}'
          git ls-tree HEAD Cargo.lock
      - name: Install the declared compiler on this disposable runner only
        run: |
          set -euo pipefail
          python3 -B scripts/provision-rust189.py runner
          export CARGO_HOME="$RUNNER_TEMP/volparossa-cargo-public-v1"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null GIT_ALLOW_PROTOCOL=https GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/usr/bin/false
          export PATH="$RUNNER_TEMP/volparossa-rust-1.89.0/bin:$PATH"
          rustc --version --verbose
          cargo --version --verbose
      - name: Check formatting and unchanged historical evidence contracts
        run: |
          set -euo pipefail
          python3 -B scripts/test-public-rsa-scope.py
          cargo fmt --all -- --check
          python3 -B tests/integration/test-protected-compute-admission.py
          python3 -B tests/integration/test-protected-compute-guest.py
          python3 -B tests/integration/test-protected-compute-quote.py
          python3 -B tests/integration/test-protected-quote-route.py
          python3 -B tests/integration/test-protected-quote-route-wiring.py
          python3 -B tests/integration/test-alpha-vm-diagnostics.py
          python3 -B tests/integration/test-weather-client-runner.py
          python3 -B tests/integration/test-weather-android-vm-wiring.py
          timeout --signal=TERM --kill-after=5s 60s python3 -B tests/integration/test-qemu-child-lifecycle.py
          python3 -B tests/integration/test-agent-cooperative-browser.py
          python3 -B tests/integration/test-cooperative-code-vm-contract.py
      - name: Fetch locked dependencies without modifying source
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 600s cargo fetch --locked
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Exercise guest and signed outcome software contracts offline
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 1200s cargo test --locked --offline \
            -p volparossa-content --lib provider::compute::guest:: -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 300s cargo test --locked --offline \
            -p volparossa-content --lib provider::compute::quote:: -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 300s cargo test --locked --offline \
            -p volparossa-content --lib private_message::confirmation:: -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 300s cargo test --locked --offline \
            -p volparossa-content --lib provider::compute::attestation::session::outcome_tests:: -- --test-threads=1
      - name: Exercise agent handoff and CLI refusal semantics offline
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 300s cargo test --locked --offline \
            -p volparossa-local-control --lib quote:: -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 1200s cargo test --locked --offline \
            -p volparossa-agent --lib quote_ -- --test-threads=1
          timeout --signal=TERM --kill-after=15s 600s cargo test --locked --offline \
            -p volparossa --bin volparossa quote_ -- --test-threads=1
      - name: Check the four affected packages with strict Clippy
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 900s cargo clippy --locked --offline \
            -p volparossa-content -p volparossa-agent -p volparossa-local-control -p volparossa --all-targets -- -D warnings
      - name: Recheck source and lockfile after execution
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse 'HEAD^{tree}'
          git ls-tree HEAD Cargo.lock

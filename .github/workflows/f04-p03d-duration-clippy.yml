name: F04 P03d Duration targeted Clippy evidence
on:
  push:
    branches: [proof/p03d-f04-duration-clippy-20261027]
permissions:
  contents: read
concurrency:
  group: f04-p03d-duration-clippy-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CANDIDATE: 93a0a486cf0a40dd19f970e2f590721aaa87d10d
  BASELINE: 2b8b179c625e774a5a5ef765018704915c093e1c
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
          fetch-depth: 2
      - name: Bind source and minimal change scope
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_REPOSITORY" = VOLPAROSSA/volparossa
          test "$GITHUB_REF" = refs/heads/proof/p03d-f04-duration-clippy-20261027
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir evidence
          test ! -e "$RUNNER_TEMP/f04-p03d-baseline-target"
          test ! -e "$RUNNER_TEMP/f04-p03d-candidate-target"
          git fetch --no-tags --depth=1 origin "$BASELINE"
          python3 -B - <<'PY_BIND'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          candidate, baseline = os.environ['CANDIDATE'], os.environ['BASELINE']
          assert git('rev-parse', 'HEAD^') == baseline
          paths = git('diff', '--name-only', baseline, candidate).splitlines()
          assert paths == ['crates/volparossa-content/src/origin_https.rs', 'crates/volparossa-content/src/provider.rs', 'crates/volparossa-content/src/provider/custody/session.rs', 'crates/volparossa-content/src/transfer.rs', 'docs/IMPLEMENTATION_STATUS.md']
          record = dict(candidate=candidate, baseline=baseline,
              candidate_tree=git('rev-parse', 'HEAD^{tree}'),
              proof_workflow_commit=os.environ['GITHUB_WORKFLOW_SHA'],
              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              paths={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
              scope='Four exact Content duration ceilings; strict known remaining lints, numeric observer and four selected existing tests',
              full_workspace_clippy=False, runtime_acceptance=False)
          Path('evidence/source.json').write_text(json.dumps(record, indent=2)+'\n')
          PY_BIND
          git worktree add --detach "$RUNNER_TEMP/f04-clippy-before" "$BASELINE"
      - name: Provision unchanged authenticated Rust 1.99.1 profile
        run: python3 -B scripts/provision-rust199.py runner
      - name: Record compiler and fetch locked inputs
        run: |
          set -euo pipefail
          rustc -Vv | tee evidence/rustc.txt
          cargo clippy -V | tee evidence/clippy.txt
          cp "$RUNNER_TEMP/volparossa-rust-1.99.1/receipt.json" evidence/compiler-receipt.json
          cargo fetch --locked 2>&1 | tee evidence/fetch.log
      - name: Check formatting of only Content
        run: cargo fmt --check -p volparossa-content
      - name: Observe exact integer Duration values with the pinned compiler
        run: |
          set -euo pipefail
          cat > evidence/duration-probe.rs <<'RS'
          use std::time::Duration;
          fn main() {
              let old = Duration::from_secs(900);
              let new = Duration::from_mins(15);
              let cases = [Duration::ZERO, Duration::from_nanos(1), old - Duration::from_nanos(1), old, old + Duration::from_nanos(1), Duration::MAX];
              println!("old_seconds={}", old.as_secs());
              println!("old_nanos={}", old.subsec_nanos());
              println!("new_seconds={}", new.as_secs());
              println!("new_nanos={}", new.subsec_nanos());
              println!("total_nanos={}", new.as_nanos());
              println!("equal={}", old == new);
              println!("checked_product={}", 15_u64.checked_mul(60).expect("constant multiplication"));
              println!("boundary_cases={}", cases.len());
              println!("bounds_equal={}", cases.iter().all(|v| (*v > old) == (*v > new) && (*v == old) == (*v == new)));
          }
          RS
          rustc --edition=2024 evidence/duration-probe.rs -o "$RUNNER_TEMP/p03d-duration-values" 2>&1 | tee evidence/duration-probe-build.log
          "$RUNNER_TEMP/p03d-duration-values" | tee evidence/duration-values.txt
          python3 -B - <<'PY_VALUES'
          import json
          from pathlib import Path
          values = dict(line.split('=', 1) for line in Path('evidence/duration-values.txt').read_text().splitlines())
          expected = dict(old_seconds='900', old_nanos='0', new_seconds='900', new_nanos='0', total_nanos='900000000000', equal='true', checked_product='900', boundary_cases='6', bounds_equal='true')
          assert values == expected, values
          Path('evidence/duration-values.json').write_text(json.dumps(values, indent=2))
          PY_VALUES
      - name: Retain strict Content diagnostics before and after without suppressions
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/evidence"
          for variant in baseline candidate; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/f04-p03d-$variant-target"
            if test "$variant" = baseline; then
              cd "$RUNNER_TEMP/f04-clippy-before"
            else
              cd "$GITHUB_WORKSPACE"
            fi
            set +e
            cargo clippy --keep-going --locked --offline -p volparossa-content --all-targets --all-features --message-format=json -- -D warnings > "$output/$variant-clippy.jsonl" 2> "$output/$variant-clippy-stderr.log"
            status=$?
            set -e
            test "$status" = 101
            echo "$status" > "$output/$variant-clippy-exit.txt"
          done
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY_CLIPPY'
          import json
          from pathlib import Path
          expected_baseline = {('clippy::chunks_exact_to_as_chunks', 'crates/volparossa-content/src/provider/compute/attestation/policy.rs', 149), ('clippy::duration_suboptimal_units', 'crates/volparossa-content/src/provider.rs', 833), ('clippy::duration_suboptimal_units', 'crates/volparossa-content/src/provider/custody/session.rs', 249), ('clippy::collapsible_if', 'crates/volparossa-local-control/src/private_storage_outcome.rs', 267), ('clippy::duration_suboptimal_units', 'crates/volparossa-content/src/origin_https.rs', 168), ('clippy::manual_is_multiple_of', 'crates/volparossa-content/src/private_storage/protocol/receipt.rs', 201), ('clippy::chunks_exact_to_as_chunks', 'crates/volparossa-content/src/provider/replication/persistence.rs', 202), ('clippy::manual_is_multiple_of', 'crates/volparossa-content/src/provider/compute/dataset/document.rs', 132), ('clippy::chunks_exact_to_as_chunks', 'crates/volparossa-content/src/provider/compute/attestation/policy.rs', 132), ('clippy::collapsible_if', 'crates/volparossa-content/src/transfer/parallel/adaptive.rs', 171), ('clippy::collapsible_if', 'crates/volparossa-content/src/transfer/parallel.rs', 386), ('clippy::chunks_exact_to_as_chunks', 'crates/volparossa-content/src/origin_https/digest.rs', 378), ('clippy::duration_suboptimal_units', 'crates/volparossa-content/src/transfer.rs', 57), ('clippy::chunks_exact_to_as_chunks', 'crates/volparossa-content/src/store.rs', 531), ('clippy::collapsible_if', 'crates/volparossa-content/src/provider/digest.rs', 193)}
          expected_candidate = {entry for entry in expected_baseline if entry[0] != 'clippy::duration_suboptimal_units'}
          observed = {}
          for variant, expected in [('baseline', expected_baseline), ('candidate', expected_candidate)]:
              errors = set()
              finished = []
              for line in Path('evidence/'+variant+'-clippy.jsonl').read_text().splitlines():
                  item = json.loads(line)
                  if item.get('reason') == 'build-finished':
                      finished.append(item['success'])
                  if item.get('reason') != 'compiler-message' or item['message']['level'] != 'error':
                      continue
                  message = item['message']
                  print(variant, message.get('rendered', message['message']))
                  assert message.get('code') is not None
                  for span in message['spans']:
                      if span['is_primary']:
                          errors.add((message['code']['code'], span['file_name'], span['line_start']))
              assert errors == expected, (variant, errors - expected, expected - errors)
              assert finished == [False], finished
              assert Path('evidence/'+variant+'-clippy-exit.txt').read_text().strip() == '101'
              observed[variant] = sorted(errors)
          assert len(observed['baseline']) == 15 and len(observed['candidate']) == 11
          assert sum(v[1].startswith('crates/volparossa-content/') for v in observed['baseline']) == 14
          assert sum(v[1].startswith('crates/volparossa-content/') for v in observed['candidate']) == 10
          dependency = ('clippy::collapsible_if', 'crates/volparossa-local-control/src/private_storage_outcome.rs', 267)
          assert dependency in map(tuple, observed['baseline']) and dependency in map(tuple, observed['candidate'])
          Path('evidence/clippy-summary.json').write_text(json.dumps(dict(diagnostics=observed, removed_duration_diagnostics=4, content_counts=dict(baseline=14, candidate=10), unchanged_known_dependency_diagnostics=1, strict_content_clippy_green=False), indent=2))
          PY_CLIPPY
      - name: Run only four existing deadline and quota tests on separate sources
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/evidence"
          selections=(
            'origin|origin_https|expiry_includes_monotonic_elapsed_time_and_complete_request_deadlines'
            'provider|provider|registry_selector_and_receiver_quotas_are_bounded_without_adopting_foreign_files'
            'transfer|stream_transfer|a_silent_peer_expires_the_exchange_without_mutating_the_cache'
            'custody|lib|provider::custody::tests::custody_waiting_chunk_admission_keeps_original_deadline'
          )
          for variant in baseline candidate; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/f04-p03d-$variant-target"
            if test "$variant" = baseline; then
              cd "$RUNNER_TEMP/f04-clippy-before"
            else
              cd "$GITHUB_WORKSPACE"
            fi
            for selection in "${selections[@]}"; do
              IFS='|' read -r key target test_name <<< "$selection"
              suite=(--test "$target")
              if test "$target" = lib; then
                suite=(--lib)
              fi
              cargo test --locked --offline -p volparossa-content "${suite[@]}" --all-features "$test_name" -- --exact --list 2>&1 | tee "$output/$variant-$key-inventory.log"
              cargo test --locked --offline -p volparossa-content "${suite[@]}" --all-features "$test_name" -- --exact 2>&1 | tee "$output/$variant-$key-tests.log"
            done
          done
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY_TEST'
          import hashlib, json, os, re
          from pathlib import Path
          selections = {
              'origin': 'expiry_includes_monotonic_elapsed_time_and_complete_request_deadlines',
              'provider': 'registry_selector_and_receiver_quotas_are_bounded_without_adopting_foreign_files',
              'transfer': 'a_silent_peer_expires_the_exchange_without_mutating_the_cache',
              'custody': 'provider::custody::tests::custody_waiting_chunk_admission_keeps_original_deadline',
          }
          results = {}
          for variant in ('baseline', 'candidate'):
              source_root = (Path(os.environ['RUNNER_TEMP']) / 'f04-clippy-before' if variant == 'baseline' else Path(os.environ['GITHUB_WORKSPACE']))
              target_root = Path(os.environ['RUNNER_TEMP']) / ('f04-p03d-'+variant+'-target')
              inventories = []
              results[variant] = {}
              for key, name in selections.items():
                  inventory = Path('evidence/'+variant+'-'+key+'-inventory.log').read_text()
                  inventories.append(inventory)
                  assert re.findall('^([a-zA-Z0-9_:]+): test$', inventory, re.M) == [name]
                  paths = re.findall('Running (?:unittests src/lib[.]rs|tests/(?:origin_https|provider|stream_transfer)[.]rs) [(]([^)]+)[)]', inventory)
                  assert len(paths) == 1, (variant, key, paths)
                  executable = Path(paths[0]).resolve()
                  assert executable.is_file() and executable.is_relative_to(target_root.resolve())
                  log = Path('evidence/'+variant+'-'+key+'-tests.log').read_text()
                  summaries = re.findall('^test result: ok[.] 1 passed; 0 failed; 0 ignored; 0 measured; ([0-9]+) filtered out;', log, re.M)
                  assert len(summaries) == 1 and 'test '+name+' ... ok' in log and str(executable) in log
                  results[variant][key] = dict(source_root=str(source_root), target_root=str(target_root), executable=str(executable), executable_sha256=hashlib.sha256(executable.read_bytes()).hexdigest(), test_name=name, passed=1, failed=0, ignored=0, filtered=int(summaries[0]))
              compile_line = 'Compiling volparossa-content v0.1.0 ('+str(source_root / 'crates/volparossa-content')+')'
              assert compile_line in ''.join(inventories), (variant, compile_line)
          for key in selections:
              assert results['baseline'][key]['executable'] != results['candidate'][key]['executable']
          Path('evidence/regression-summary.json').write_text(json.dumps(results, indent=2))
          PY_TEST
          git diff --exit-code
      - name: Preserve scoped evidence including known failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f04-p03d-duration-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

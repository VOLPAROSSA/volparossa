name: Alpha production-helper topology

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: alpha-production-helper-topology-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  alpha-topology:
    name: Debian 13 KVM twelve-node smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/alpha-vertical-runtime')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Bind exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$GITHUB_SHA"
          test -z "$(git status --short --untracked-files=all)"
          test -x tests/integration/kvm-alpha-topology.sh
          test -x tests/integration/run-alpha-topology-vm.sh
          sh -n tests/integration/kvm-alpha-topology.sh
          sh -n tests/integration/run-alpha-topology-vm.sh

      - name: Install official Ubuntu VM tools
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes --no-install-recommends \
            build-essential cmake git libevent-dev pkg-config \
            qemu-system-x86 qemu-utils cloud-image-utils openssh-client \
            curl jq util-linux
          qemu-system-x86_64 --version
          qemu-img --version
          ssh -V
          output="$RUNNER_TEMP/alpha-topology"
          install -d -m 0700 "$output"
          printf 'VOLPAROSSA_ALPHA_OUTPUT=%s\n' "$output" >>"$GITHUB_ENV"

      - name: Build exact pinned mqvpn/xquic runtime
        run: |
          set -euo pipefail
          native_binary="$(pwd -P)/native/volparossa-mpquic/build/volparossa-mpquic"
          native/volparossa-mpquic/scripts/fetch-upstream.sh --yes
          VMP_BUILD_JOBS=2 VMP_RUN_TESTS=no \
            native/volparossa-mpquic/scripts/build-upstream.sh
          test -f "$native_binary"
          test -x "$native_binary"
          test "$("$native_binary" --api-version)" = 6
          native_size=$(stat -Lc '%s' "$native_binary")
          test "$native_size" -gt 0
          test "$native_size" -le 67108864
          sha256sum "$native_binary"
          printf 'VOLPAROSSA_ALPHA_MPQUIC=%s\n' "$native_binary" >>"$GITHUB_ENV"

      - name: Build exact candidate Debian package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/volparossa-package-target
          VMP_BUILD_JOBS: 2
          VMP_RUN_TESTS: no
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            ./packaging/build-deb.sh --build
          mapfile -t packages < <(find "$(pwd -P)/dist" -maxdepth 1 -type f \
            -name 'volparossa_*_amd64.deb' -print)
          test "${#packages[@]}" -eq 1
          package=${packages[0]}
          test -f "$package"
          test ! -L "$package"
          test "$(dpkg-deb -f "$package" Package)" = volparossa
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          sha256sum "$package"
          printf 'VOLPAROSSA_ALPHA_PACKAGE=%s\n' "$package" >>"$GITHUB_ENV"

      - name: Require KVM and create output directory
        run: |
          set -euo pipefail
          test -c /dev/kvm
          test "$(stat -Lc '%u' /dev/kvm)" = 0
          kvm_gid=$(stat -Lc '%g' /dev/kvm)
          case "$kvm_gid" in ''|0|0*|*[!0-9]*) exit 1 ;; esac
          test "$(getent group "$kvm_gid" | awk -F: -v gid="$kvm_gid" \
            '$1 == "kvm" && $3 == gid { print $1 ":" $3 }')" = "kvm:$kvm_gid"
          qemu-system-x86_64 -accel help | grep -Fx kvm
          printf 'VOLPAROSSA_KVM_GID=%s\n' "$kvm_gid" >>"$GITHUB_ENV"

      - name: Download and verify pinned Debian 13 image
        run: |
          set -euo pipefail
          manifest=tests/helper/debian13-amd64-image-v1.json
          image_sha512=184761b0dad0f9ace02f9298050ca96ce3caa39a461a47706d47ff9698b59933918b91b40177fbd4d392f6446af8b4d18ecb94caca988169b19641606bf34003
          image_filename=debian-13-genericcloud-amd64-20260826-2582.qcow2
          image_url=$(jq -er '.url | select(type == "string" and length > 0)' "$manifest")
          image="$RUNNER_TEMP/$image_filename"
          curl --fail --show-error --silent --location \
            --connect-timeout 30 --max-time 1200 --max-filesize 2147483648 \
            --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --output "$image" "$image_url"
          chmod 0600 "$image"
          printf '%s  %s\n' "$image_sha512" "$image" \
            | sha512sum --check --strict -
          printf 'VOLPAROSSA_ALPHA_IMAGE=%s\n' "$image" >>"$GITHUB_ENV"

      - name: Run disposable production-helper topology
        id: topology
        run: |
          set -euo pipefail
          runner_uid=$(id -u)
          case "$runner_uid" in ''|0|0*|*[!0-9]*) exit 1 ;; esac
          set +e
          sudo -n -- /usr/bin/setpriv \
            --reuid "$runner_uid" \
            --regid "$VOLPAROSSA_KVM_GID" \
            --clear-groups \
            --inh-caps=-all \
            --ambient-caps=-all \
            --bounding-set=-all \
            --no-new-privs \
            --reset-env \
            -- \
            "$(pwd -P)/tests/integration/run-alpha-topology-vm.sh" \
            --execute --yes \
            --image "$VOLPAROSSA_ALPHA_IMAGE" \
            --mpquic "$VOLPAROSSA_ALPHA_MPQUIC" \
            --package "$VOLPAROSSA_ALPHA_PACKAGE" \
            --output "$VOLPAROSSA_ALPHA_OUTPUT" \
            --expected-commit "$GITHUB_SHA"
          topology_status=$?
          set -e
          printf 'exit_code=%s\n' "$topology_status" >>"$GITHUB_OUTPUT"

      - name: Summarise exact reached point
        if: always()
        run: |
          set -euo pipefail
          report="$VOLPAROSSA_ALPHA_OUTPUT/report.json"
          if test -f "$report"; then
            jq -r '
              "last phase: \(.last_phase)",
              "helpers ready: \(.production_helpers.ready)",
              "native MPQUIC ready: \(.native_mpquic.ready)",
              "agents ready: \(.agents_ready)",
              "A01 bootstrap resilience succeeded: \(.a01_bootstrap_resilience.succeeded)",
              "A02 transparent TCP succeeded: \(.a02_transparent_tcp.succeeded)",
              "A03 MPTCP aggregation succeeded: \(.a03_mptcp_aggregation.succeeded)",
              "A04 MPTCP relay failover succeeded: \(.a04_mptcp_relay_failover.succeeded)",
              "Connect succeeded: \(.client_connect.succeeded)",
              "A05 UDP echo succeeded: \(.a05_udp_echo.succeeded)",
              "A06 HTTP/3 MPQUIC succeeded: \(.a06_http3_mpquic.succeeded)",
              "A07 HTTP/3 Relay failover succeeded: \(.a07_http3_relay_failover.succeeded)",
              "A08 allowed TLS domain succeeded: \(.a08_allowed_destination.succeeded)",
              "A09 forbidden destinations denied: \(.a09_forbidden_destinations.succeeded)",
              "A10 ECH and unverifiable TLS denied: \(.a10_unverifiable_ech.succeeded)",
              "A11 Relay outer privacy succeeded: \(.a11_relay_outer_privacy.succeeded)",
              "A12 Exit source privacy succeeded: \(.a12_exit_source_privacy.succeeded)",
              "A13 No direct Client-Exit succeeded: \(.a13_no_direct_client_exit.succeeded)",
              "A14 Forced-crash cleanup succeeded: \(.a14_forced_crash_cleanup.succeeded)",
              "A15 Host state unchanged: \(.a15_host_state_unchanged.succeeded)",
              "observed blocker: \(.client_connect.observed_blocker)",
              "cleanup complete: \(.cleanup.complete)"
            ' "$report" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'The VM did not publish a topology report.' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          package_report="$VOLPAROSSA_ALPHA_OUTPUT/package/package-lifecycle.json"
          if test -f "$package_report"; then
            jq -r '
              "package lifecycle: \(.overall)",
              "package version: \(.package.version)",
              "installed services started: \(.service_start.helper and .service_start.native_mpquic and .service_start.agent)",
              "upgrade restarted active processes: \(.upgrade.active_processes_restarted)",
              "uninstall preserved identity: \(.uninstall.identity_preserved)",
              "package test networking unchanged: \(.network_state_unchanged)"
            ' "$package_report" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'The VM did not publish package lifecycle evidence.' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded topology diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-production-helper-topology-${{ github.run_id }}
          path: ${{ env.VOLPAROSSA_ALPHA_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7

      - name: Require successful A01-A15 evidence
        env:
          TOPOLOGY_EXIT_CODE: ${{ steps.topology.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$TOPOLOGY_EXIT_CODE" = 0
          jq -e '
            .a01_bootstrap_resilience.succeeded == true and
            .a01_bootstrap_resilience.evidence.success == true and
            .a01_bootstrap_resilience.evidence.topology.independently_removed == true and
            .a01_bootstrap_resilience.evidence.bootstrap1_removed.fresh_advertisement.sequence_after >
              .a01_bootstrap_resilience.evidence.bootstrap1_removed.fresh_advertisement.sequence_before and
            .a01_bootstrap_resilience.evidence.bootstrap2_removed.fresh_advertisement.sequence_after >
              .a01_bootstrap_resilience.evidence.bootstrap2_removed.fresh_advertisement.sequence_before and
            .a01_bootstrap_resilience.evidence.bootstrap1_removed.remaining_contact_link_bytes_delta > 0 and
            .a01_bootstrap_resilience.evidence.bootstrap2_removed.remaining_contact_link_bytes_delta > 0 and
            (.a01_bootstrap_resilience.evidence.bootstrap1_removed.selection.paths | length) == 2 and
            (.a01_bootstrap_resilience.evidence.bootstrap2_removed.selection.paths | length) == 2 and
            .a02_transparent_tcp.succeeded == true and
            .a02_transparent_tcp.evidence.success == true and
            .a02_transparent_tcp.evidence.no_direct_client_exit.observed_packets == 0 and
            .a03_mptcp_aggregation.succeeded == true and
            .a03_mptcp_aggregation.evidence.success == true and
            .a03_mptcp_aggregation.evidence.measured_throughput_gain_ratio > 1.25 and
            .a04_mptcp_relay_failover.succeeded == true and
            .a04_mptcp_relay_failover.evidence.success == true and
            .a04_mptcp_relay_failover.evidence.application_flow_completed == true and
            .a05_udp_echo.succeeded == true and
            .a05_udp_echo.evidence.success == true and
            .a06_http3_mpquic.succeeded == true and
            .a06_http3_mpquic.evidence.success == true and
            .a06_http3_mpquic.evidence.application.protocol == "HTTP/3" and
            .a06_http3_mpquic.evidence.hostname_policy.hostname == "destination.volparossa.test" and
            .a06_http3_mpquic.evidence.hostname_policy.kernel_original_destination.ip == "47.163.4.2" and
            .a06_http3_mpquic.evidence.hostname_policy.exit_dns_pin.exact_original_destination_match == true and
            .a06_http3_mpquic.evidence.hostname_policy.client_initial_inspected_before_route == true and
            .a06_http3_mpquic.evidence.hostname_policy.exit_initial_reverified_before_egress == true and
            .a06_http3_mpquic.evidence.native_mpquic.required_path_count == 2 and
            (.a06_http3_mpquic.evidence.native_mpquic.paths | length) == 2 and
            .a06_http3_mpquic.evidence.path_evidence.client_capture.relay1_wireguard_data_bytes > 1048576 and
            .a06_http3_mpquic.evidence.path_evidence.client_capture.relay2_wireguard_data_bytes > 1048576 and
            .a06_http3_mpquic.evidence.path_evidence.exit_capture.relay1_wireguard_data_bytes > 1048576 and
            .a06_http3_mpquic.evidence.path_evidence.exit_capture.relay2_wireguard_data_bytes > 1048576 and
            .a06_http3_mpquic.evidence.no_direct_client_exit.observed_packets == 0 and
            .a07_http3_relay_failover.succeeded == true and
            .a07_http3_relay_failover.evidence.success == true and
            .a07_http3_relay_failover.evidence.application_flow_completed == true and
            .a07_http3_relay_failover.evidence.ordinary_quic_fallback_allowed == false and
            .a07_http3_relay_failover.evidence.direct_client_exit_packets == 0 and
            .a07_http3_relay_failover.evidence.path_evidence.client_capture.before_marker.relay1_wireguard_data_bytes > 1048576 and
            .a07_http3_relay_failover.evidence.path_evidence.client_capture.before_marker.relay2_wireguard_data_bytes > 1048576 and
            .a07_http3_relay_failover.evidence.path_evidence.client_capture.after_marker.relay2_wireguard_data_bytes > 1048576 and
            .a07_http3_relay_failover.evidence.path_evidence.exit_capture.before_marker.relay1_wireguard_data_bytes > 1048576 and
            .a07_http3_relay_failover.evidence.path_evidence.exit_capture.before_marker.relay2_wireguard_data_bytes > 1048576 and
            .a07_http3_relay_failover.evidence.path_evidence.exit_capture.after_marker.relay2_wireguard_data_bytes > 1048576 and
            .a08_allowed_destination.succeeded == true and
            .a08_allowed_destination.evidence.success == true and
            .a08_allowed_destination.evidence.protected_flow.transparent_client_hello_forwarded_unchanged == true and
            .a08_allowed_destination.evidence.protected_flow.tls_handshake_and_payload_completed == true and
            .a08_allowed_destination.evidence.destination.accepted_connections == 1 and
            .a08_allowed_destination.evidence.dns.udp.mode == "udp" and
            .a08_allowed_destination.evidence.dns.tcp.mode == "tcp" and
            .a08_allowed_destination.evidence.dns.udp.response_source == {"ip":"9.9.9.9","port":53} and
            .a08_allowed_destination.evidence.dns.tcp.response_source == {"ip":"9.9.9.9","port":53} and
            .a08_allowed_destination.evidence.dns.answer_addresses == ["47.163.4.2"] and
            .a08_allowed_destination.evidence.dns.udp_completion_events_after > .a08_allowed_destination.evidence.dns.udp_completion_events_before and
            .a08_allowed_destination.evidence.dns.tcp_completion_events_after > .a08_allowed_destination.evidence.dns.tcp_completion_events_before and
            .a09_forbidden_destinations.succeeded == true and
            .a09_forbidden_destinations.evidence.success == true and
            (.a09_forbidden_destinations.evidence.denied_cases | length) == 5 and
            .a09_forbidden_destinations.evidence.destination_egress_connections_for_denials == 0 and
            .a10_unverifiable_ech.succeeded == true and
            .a10_unverifiable_ech.evidence.success == true and
            (.a10_unverifiable_ech.evidence.denied_cases | length) == 2 and
            .a10_unverifiable_ech.evidence.destination_egress_connections_for_denials == 0 and
            .a11_relay_outer_privacy.succeeded == true and
            .a11_relay_outer_privacy.evidence.success == true and
            .a11_relay_outer_privacy.evidence.relay1.internet_destination_outer_packets == 0 and
            .a11_relay_outer_privacy.evidence.relay2.internet_destination_outer_packets == 0 and
            .a12_exit_source_privacy.succeeded == true and
            .a12_exit_source_privacy.evidence.success == true and
            .a12_exit_source_privacy.evidence.capture.client_public_packets == 0 and
            .a13_no_direct_client_exit.succeeded == true and
            .a13_no_direct_client_exit.evidence.success == true and
            .a13_no_direct_client_exit.evidence.client_capture.direct_client_exit_packets == 0 and
            (.a13_no_direct_client_exit.evidence.direct_physical_routes | length) == 0 and
            .a14_forced_crash_cleanup.succeeded == true and
            .a14_forced_crash_cleanup.evidence.success == true and
            .a14_forced_crash_cleanup.evidence.owned_before.helper_worker_custody.worker_network_namespace_count >= 4 and
            .a14_forced_crash_cleanup.evidence.owned_before.helper_worker_custody.helper_fdstore_descriptors >= 8 and
            .a14_forced_crash_cleanup.evidence.cleanup.worker_custody_after.referenced_namespace_count == 0 and
            .a14_forced_crash_cleanup.evidence.cleanup.worker_custody_after.remaining_reference_count == 0 and
            .a14_forced_crash_cleanup.evidence.cleanup.remaining_worker_network_namespaces == 0 and
            .a14_forced_crash_cleanup.evidence.cleanup.remaining_worker_namespace_references == 0 and
            .a14_forced_crash_cleanup.evidence.cleanup.remaining_helper_fdstore_descriptors == 0 and
            .a14_forced_crash_cleanup.evidence.cleanup.remaining_owned_objects == 0 and
            .a15_host_state_unchanged.succeeded == true and
            .a15_host_state_unchanged.evidence.success == true and
            .a15_host_state_unchanged.evidence.before_sha256 == .a15_host_state_unchanged.evidence.after_sha256 and
            .cleanup.complete == true and
            .cleanup.remaining_namespaces == 0 and
            .cleanup.remaining_units == 0 and
            .cleanup.remaining_owned_objects == 0
          ' "$VOLPAROSSA_ALPHA_OUTPUT/report.json" >/dev/null
          test "$(cat "$VOLPAROSSA_ALPHA_OUTPUT/package/guest-exit-status")" = 0
          jq -e '
            .schema_version == 1 and
            .environment == {
              "debian_version":"13",
              "architecture":"amd64",
              "virtualization":"kvm"
            } and
            .fresh_install.services_enabled == false and
            .fresh_install.filesystem_contract == true and
            .doctor_before_upgrade == true and
            .service_start.helper == true and
            .service_start.native_mpquic == true and
            .service_start.agent == true and
            .service_start.live_status == true and
            .upgrade.maintainer_path_exercised == true and
            .upgrade.active_processes_restarted == true and
            .upgrade.identity_preserved == true and
            .doctor_after_upgrade == true and
            .uninstall.active_services_stopped == true and
            .uninstall.package_files_absent == true and
            .uninstall.identity_preserved == true and
            .uninstall.config_preserved == true and
            .network_state_unchanged == true and
            .overall == "PASS"
          ' "$VOLPAROSSA_ALPHA_OUTPUT/package/package-lifecycle.json" >/dev/null
          jq -e 'all(.checks[]; .status != "fail")' \
            "$VOLPAROSSA_ALPHA_OUTPUT/package/doctor-before-upgrade.json" >/dev/null
          jq -e 'all(.checks[]; .status != "fail")' \
            "$VOLPAROSSA_ALPHA_OUTPUT/package/doctor-after-upgrade.json" >/dev/null

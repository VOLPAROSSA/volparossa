name: F04 P03b Config targeted Clippy evidence
on:
  push:
    branches: [proof/p03b-f04-config-clippy-20261027]
permissions:
  contents: read
concurrency:
  group: f04-p03b-config-clippy-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CANDIDATE: 19721396d7a9914e07df02a851f26753d4feb215
  BASELINE: d2b515a93255eb4d9409d32ed9069090e25e80ec
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
          fetch-depth: 2
      - name: Bind source and minimal change scope
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_REPOSITORY" = VOLPAROSSA/volparossa
          test "$GITHUB_REF" = refs/heads/proof/p03b-f04-config-clippy-20261027
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir evidence
          git fetch --no-tags --depth=1 origin "$BASELINE"
          python3 -B - <<'PY_BIND'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          candidate, baseline = os.environ['CANDIDATE'], os.environ['BASELINE']
          assert git('rev-parse', 'HEAD^') == baseline
          paths = git('diff', '--name-only', baseline, candidate).splitlines()
          assert paths == ['crates/volparossa-config/src/lib.rs', 'docs/IMPLEMENTATION_STATUS.md']
          record = dict(candidate=candidate, baseline=baseline,
              candidate_tree=git('rev-parse', 'HEAD^{tree}'),
              proof_workflow_commit=os.environ['GITHUB_WORKFLOW_SHA'],
              run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              paths={p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
              scope='Config targeted Clippy and unchanged library regression suite before and after only',
              full_workspace_clippy=False, runtime_acceptance=False)
          Path('evidence/source.json').write_text(json.dumps(record, indent=2)+'\n')
          PY_BIND
          git worktree add --detach "$RUNNER_TEMP/f04-clippy-before" "$BASELINE"
      - name: Provision unchanged authenticated Rust 1.99.1 profile
        run: python3 -B scripts/provision-rust199.py runner
      - name: Record compiler and fetch locked inputs
        run: |
          set -euo pipefail
          rustc -Vv | tee evidence/rustc.txt
          cargo clippy -V | tee evidence/clippy.txt
          cp "$RUNNER_TEMP/volparossa-rust-1.99.1/receipt.json" evidence/compiler-receipt.json
          cargo fetch --locked 2>&1 | tee evidence/fetch.log
      - name: Reproduce all three original Config diagnostics without changing lint levels
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/f04-clippy-target"
          cd "$RUNNER_TEMP/f04-clippy-before"
          set +e
          cargo clippy --keep-going --locked --offline -p volparossa-config \
            --all-targets --all-features --message-format=json -- -D warnings \
            > "$GITHUB_WORKSPACE/evidence/baseline.jsonl" 2> "$GITHUB_WORKSPACE/evidence/baseline-stderr.log"
          status=$?
          set -e
          test "$status" = 101
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY_BEFORE'
          import json
          from pathlib import Path
          errors = set()
          for line in Path('evidence/baseline.jsonl').read_text().splitlines():
              item = json.loads(line)
              if item.get('reason') != 'compiler-message':
                  continue
              message = item['message']
              if message['level'] != 'error':
                  continue
              print(message.get('rendered', message['message']))
              code = message.get('code')
              assert code is not None
              for span in message['spans']:
                  if span['is_primary']:
                      errors.add((code['code'], span['file_name'], span['line_start']))
          expected = {
              ('clippy::collapsible_if', 'crates/volparossa-config/src/lib.rs', 677),
              ('clippy::collapsible_if', 'crates/volparossa-config/src/lib.rs', 730),
              ('clippy::collapsible_if', 'crates/volparossa-config/src/lib.rs', 738),
          }
          assert errors == expected, errors
          Path('evidence/baseline-errors.json').write_text(json.dumps(sorted(errors), indent=2)+'\n')
          PY_BEFORE
      - name: Check exact corrected package with unchanged strict lint levels
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/f04-clippy-target"
          cargo fmt --check -p volparossa-config
          cargo clippy --keep-going --locked --offline -p volparossa-config \
            --all-targets --all-features -- -D warnings 2>&1 | tee evidence/candidate-clippy.log
      - name: Compare unchanged Config inventory and execute baseline and candidate regressions
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/f04-clippy-target"
          output="$GITHUB_WORKSPACE/evidence"
          for variant in baseline candidate; do
            if test "$variant" = baseline; then
              cd "$RUNNER_TEMP/f04-clippy-before"
            else
              cd "$GITHUB_WORKSPACE"
            fi
            cargo test --locked --offline -p volparossa-config --lib --all-features -- --list \
              2>&1 | tee "$output/$variant-inventory.log"
            cargo test --locked --offline -p volparossa-config --lib --all-features \
              2>&1 | tee "$output/$variant-tests.log"
          done
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY_TEST'
          import json, re
          from pathlib import Path
          inventories = []
          for variant in ('baseline', 'candidate'):
              inventory = Path('evidence/'+variant+'-inventory.log').read_text()
              names = sorted(re.findall(r'^([a-zA-Z0-9_:]+): test$', inventory, re.M))
              assert len(names) == 36 and len(set(names)) == 36
              required = {
                  'tests::independent_egress_interface_is_optional_and_never_enables_roles',
                  'tests::local_only_uplink_needs_no_fabricated_origin_or_exit_capacity',
                  'tests::service_origin_hints_are_explicit_and_canonical',
              }
              assert required.issubset(names)
              inventories.append(names)
              log = Path('evidence/'+variant+'-tests.log').read_text()
              results = re.findall(r'^test result: ok\. ([0-9]+) passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;', log, re.M)
              assert results == ['36'], results
              for name in names:
                  assert 'test '+name+' ... ok' in log, name
          assert inventories[0] == inventories[1]
          Path('evidence/regression-summary.json').write_text(json.dumps(dict(
              baseline_passed=36, candidate_passed=36, failed=0, ignored=0,
              unchanged_test_names=inventories[0]), indent=2))
          PY_TEST
          git diff --exit-code
      - name: Preserve exact source and original diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f04-p03b-config-clippy-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

name: F04 fixed candidate locked inputs, formatter patch and strict compile proof
on:
  push:
    branches: [proof/p03f-f04-collapse-corrected-20261027]
permissions:
  contents: read
concurrency:
  group: f04-p03f-collapse-corrected-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  # Principal replaces only after independent review. Placeholder fails closed.
  CANDIDATE: '0000000000000000000000000000000000000000'
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Admit hosted proof before checkout or provisioning
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" != 0
          test "$GITHUB_REPOSITORY" = VOLPAROSSA/volparossa
          test "$GITHUB_REF" = refs/heads/proof/p03f-f04-collapse-corrected-20261027
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE" != 0000000000000000000000000000000000000000
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Bind exact clean candidate, three initial locks and proof code
        run: |
          python3 -B scripts/test-f04-source-validation.py
          python3 -B scripts/run-f04-source-validation.py prepare
      - name: Provision candidate authenticated Rust 1.89.0 directly
        run: |
          set -euo pipefail
          python3 -B source/scripts/provision-rust189.py runner 2>&1 | tee evidence/provision.log
          cp "$RUNNER_TEMP/volparossa-rust-1.89.0/receipt.json" evidence/compiler-receipt.json
      - name: Prepare existing pinned Protobuf on disposable hosted runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          timeout --kill-after=15s 180s sudo apt-get -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update 2>&1 | tee evidence/apt-update.log
          timeout --kill-after=15s 180s sudo apt-get install --yes --no-install-recommends \
            protobuf-compiler=3.21.12-8.2ubuntu0.4 \
            libprotoc32t64=3.21.12-8.2ubuntu0.4 \
            libprotobuf32t64=3.21.12-8.2ubuntu0.4 2>&1 | tee evidence/apt-install.log
          protoc --version > evidence/protoc.txt
          dpkg-query -W protobuf-compiler libprotoc32t64 libprotobuf32t64 > evidence/protobuf-packages.txt
      - name: Resolve fixture only, capture and undo formatting, compile strict committed source
        run: python3 -B scripts/run-f04-source-validation.py run
      - name: Always report strict failures and original source and cleanup bindings
        if: always()
        run: python3 -B scripts/run-f04-source-validation.py summarize
      - name: Preserve only text evidence, patches and original/resolved locks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f04-source-validation-COMPILE-ONLY-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

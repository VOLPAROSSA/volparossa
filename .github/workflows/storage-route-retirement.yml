name: Storage retirement and closed TLS diagnostics

on:
  push:
    branches: [fix/storage-route-retirement]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-route-retirement-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SOURCE_BASE: a7b15bdea48d64f31849bfb7ee2bbee6995bc957
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'
  FIREWALL_NORMALIZER: |
    BEGIN {
      ctime = "(Sun|Mon|Tue|Wed|Thu|Fri|Sat) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) ( [1-9]|[12][0-9]|3[01]) ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] [0-9][0-9][0-9][0-9]"
    }
    {
      quoted = 0
      escaped = 0
      for (i = 1; i <= length($0); i++) {
        character = substr($0, i, 1)
        if (escaped) { escaped = 0; continue }
        if (character == "\\") { escaped = 1; continue }
        if (character == "\"") quoted = !quoted
      }
      if (quoted || escaped) exit 1
    }
    $0 ~ ("^# Generated by ip(6)?tables-save v[0-9][0-9A-Za-z.+:~_-]*( \\(nf_tables\\))? on " ctime "$") {
      sub(/ on .*$/, " on [timestamp]")
    }
    $0 ~ ("^# Completed on " ctime "$") {
      $0 = "# Completed on [timestamp]"
    }
    /^:[-A-Za-z0-9_.+]+ (ACCEPT|DROP|-) \[[0-9]+:[0-9]+\]$/ {
      sub(/ \[[0-9]+:[0-9]+\]$/, " [counters]")
    }
    { print }

jobs:
  contracts:
    if: >-
      github.repository == 'VOLPAROSSA/volparossa' &&
      github.ref == 'refs/heads/fix/storage-route-retirement'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and historical consumer pins
        id: source
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$SOURCE_BASE" HEAD
          umask 077
          mkdir storage-retirement-evidence
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          allowed = set('''
          .github/workflows/storage-route-retirement.yml
          .github/workflows/alpha-topology.yml
          docs/IMPLEMENTATION_STATUS.md
          crates/volparossa-agent/src/route_setup.rs
          crates/volparossa-agent/src/helper_v3.rs
          crates/volparossa-agent/src/mptcp_transport.rs
          crates/volparossa-agent/src/mptcp_transport/acquire_diagnostic.rs
          crates/volparossa-agent/src/mptcp_transport/acquire_diagnostic/tests.rs
          crates/volparossa-agent/src/mptcp_transport/retirement/diagnostic_tests.rs
          crates/volparossa-agent/src/route_setup/content_stream.rs
          crates/volparossa-agent/src/content/fixture_correlation.rs
          crates/volparossa-agent/src/content/fixture_correlation/tests.rs
          crates/volparossa-agent/src/content/private_storage/observation.rs
          crates/volparossa-agent/src/content/private_storage/observation/fixture_correlation_tests.rs
          crates/volparossa-agent/src/content/private_storage/observation/flow_acquire.rs
          crates/volparossa-agent/src/content/private_storage/observation/flow_acquire/tests.rs
          crates/volparossa-local-control/src/fixture_correlation.rs
          crates/volparossa-local-control/src/fixture_correlation/tests.rs
          crates/volparossa/src/content/fixture_correlation.rs
          crates/volparossa/src/content/fixture_correlation_tests.rs
          tests/integration/storage-fixture-correlation-sampler.py
          tests/integration/test-storage-fixture-correlation-sampler.py
          crates/volparossa-agent/src/route_setup/tests/lost_helper_retirement_tests.rs
          crates/volparossa-agent/src/route_setup/tests/tcp_flow_admission_tests.rs
          crates/volparossa-agent/src/content/tls.rs
          crates/volparossa-agent/src/content/tls/tests/kernel_close.rs
          crates/volparossa-agent/src/content/tls/tests/kernel_close/repeated_egress.rs
          scripts/run-isolated-test.sh
          crates/volparossa-agent/src/content/tls/close_diagnostic_tests.rs
          crates/volparossa-agent/src/content/private_storage.rs
          crates/volparossa-agent/src/content/private_storage/outcome.rs
          crates/volparossa-agent/src/content/private_storage/outcome/tests.rs
          crates/volparossa-agent/src/content/private_storage/tests.rs
          crates/volparossa-local-control/src/lib.rs
          crates/volparossa-local-control/src/private_storage_outcome.rs
          crates/volparossa/src/storage.rs
          crates/volparossa/src/storage/peer.rs
          crates/volparossa/src/storage/peer_diagnostics.rs
          crates/volparossa/src/storage/peer_flow_acquire.rs
          crates/volparossa/src/storage/peer_flow_acquire_tests.rs
          crates/volparossa/src/storage/peer_outcome.rs
          crates/volparossa/src/storage/peer_outcome_tests.rs
          crates/volparossa/src/storage/peer_outcome_transfer_tests.rs
          crates/volparossa/src/storage/peer_tls_close.rs
          crates/volparossa/src/storage/peer_tls_close_tests.rs
          tests/integration/kvm-alpha-topology.sh
          tests/integration/run-alpha-topology-vm.sh
          tests/integration/private-storage-maintenance-smoke.py
          tests/integration/private-storage-maintenance-smoke.sh
          tests/integration/storage-consumer-maintenance-evidence.py
          tests/integration/storage-consumer-maintenance-provision.py
          tests/integration/storage-consumer-maintenance-smoke.py
          tests/integration/storage-consumer-maintenance-smoke.sh
          tests/integration/storage-consumer-maintenance.mjs
          tests/integration/storage-consumer-maintenance-pins-v10.json
          tests/integration/test-private-storage-maintenance-smoke.py
          tests/integration/test-private-storage-maintenance-wiring.py
          tests/integration/test-storage-consumer-maintenance-evidence.py
          tests/integration/test-storage-consumer-maintenance-provision.py
          tests/integration/test-storage-consumer-maintenance-shell.py
          tests/integration/test-storage-consumer-maintenance-smoke.py
          tests/integration/test-storage-consumer-maintenance.mjs
          '''.split())
          changed = git('diff', '--name-only', os.environ['SOURCE_BASE'], 'HEAD').splitlines()
          assert len(changed) == len(set(changed)) and set(changed) == allowed
          dependencies = ('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml',
              'crates/volparossa-agent/Cargo.toml',
              'crates/volparossa-local-control/Cargo.toml', 'crates/volparossa/Cargo.toml',
              'crates/volparossa-helper/src/worker_transport.rs',
              'crates/volparossa-helper/src/engine_v3.rs',
              'tests/integration/agent-private-task-code.py',
              'tests/integration/agent-private-task-code-pins.json',
              'tests/integration/storage-consumer-network.py',
              'tests/helper/debian13-amd64-image-v1.json',
              'tests/integration/storage-consumer-maintenance-pins.json',
              *(f'tests/integration/storage-consumer-maintenance-pins-v{version}.json'
                for version in range(2, 10)))
          for name in dependencies:
              assert git('rev-parse', 'HEAD:' + name) == git('rev-parse', os.environ['SOURCE_BASE'] + ':' + name)
          runner = 'scripts/run-isolated-test.sh'
          assert git('rev-parse', os.environ['SOURCE_BASE'] + ':' + runner) == 'ba5c00260f42777c7fa72f46c6f9029f530a41aa'
          assert git('rev-parse', 'HEAD:' + runner) == '14e551d91b4ac5bf8feb7a3275b6ce6e86d7f99b'
          record = dict(version=1, source_commit=os.environ['GITHUB_SHA'],
              workflow_commit=os.environ['GITHUB_WORKFLOW_SHA'], source_tree=git('rev-parse', 'HEAD^{tree}'),
              base_commit=os.environ['SOURCE_BASE'],
              source_blobs={name:git('rev-parse', 'HEAD:' + name) for name in changed},
              dependency_blobs={name:git('rev-parse', 'HEAD:' + name) for name in dependencies},
              runner_blob=git('rev-parse', 'HEAD:' + runner),
              scope='retained-route-retirement-tls-close-v9-and-consumer-profile-10-contracts',
              kernel_test_scope='signed-reserve-close-order-and-repeated-production-sni-dns-egress',
              tls_production_diagnostic_changed=True, historical_consumer_pins_unchanged=True,
              fixture_helper_diagnostic_version=2, fixture_fragment_copy_binding=False,
              live_consumer_acceptance=False, original_timeout_cause_proven=False,
              full_relay_datapath_execution=False, feature_equivalence_to_full_workspace_proven=False)
          pathlib.Path('storage-retirement-evidence/source.json').write_text(json.dumps(record, sort_keys=True) + '\n')
          PY
      - name: Install existing pinned Rust toolchain on hosted runner
        id: toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
          rustc --version --verbose
          cargo --version --verbose
      - name: Install reviewed Protobuf on disposable hosted runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(dpkg --print-architecture)" = amd64
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler=3.21.12-8.2ubuntu0.3
          test "$(protoc --version)" = 'libprotoc 3.21.12'
      - name: Stage only the existing verified Node runtime on the hosted runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          timeout --kill-after=5s 240s python3 -B - <<'PY'
          import json, os, pathlib, runpy, subprocess, tarfile, tempfile
          helper = runpy.run_path('tests/integration/agent-private-task-code.py')
          pins = json.loads(pathlib.Path('tests/integration/storage-consumer-maintenance-pins-v9.json').read_text())
          selected = json.loads(pathlib.Path('tests/integration/storage-consumer-maintenance-pins-v10.json').read_text())
          runtime = pins['runtime']
          assert runtime == selected['runtime'] == helper['load_pins']()['runtime']
          assert runtime['version'] == '24.19.0'
          root = pathlib.Path(tempfile.mkdtemp(prefix='storage-contract-node.', dir=os.environ['RUNNER_TEMP']))
          archive = root / 'node.tar.xz'
          helper['fetch'](runtime['url'], archive, runtime)
          with tarfile.open(archive, 'r:xz') as bundle:
              helper['extract_runtime'](bundle, root / 'runtime', runtime['files'])
          binary = root / 'runtime/bin/node'
          assert subprocess.check_output([str(binary), '--version'], text=True, timeout=10).strip() == 'v24.19.0'
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(binary.parent) + '\n')
          pathlib.Path('storage-retirement-evidence/node-runtime.json').write_text(json.dumps(dict(
              version=1, runtime=runtime, archive_verified=True, files_verified=True,
              package_scripts_executed=False, application_sources_downloaded=False), sort_keys=True) + '\n')
          PY
      - name: Exercise inert consumer profile and maintenance export contracts
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          for suite in storage-consumer-maintenance-provision storage-consumer-maintenance-smoke storage-consumer-maintenance-evidence storage-consumer-maintenance-shell private-storage-maintenance-smoke private-storage-maintenance-wiring storage-fixture-correlation-sampler storage-provider-activity-sampler storage-consumer-network; do
            timeout --kill-after=5s 180s python3 -B "tests/integration/test-$suite.py" -v \
              2>&1 | tee "storage-retirement-evidence/python-$suite.log"
          done
          timeout --kill-after=5s 180s node --test --test-reporter=tap tests/integration/test-storage-consumer-maintenance.mjs \
            2>&1 | tee storage-retirement-evidence/node-consumer.log
          for script in private-storage-maintenance-smoke storage-consumer-maintenance-smoke kvm-alpha-topology run-alpha-topology-vm; do
            sh -n "tests/integration/$script.sh"
          done
          python3 -B - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('storage-retirement-evidence')
          suites = ('storage-consumer-maintenance-provision', 'storage-consumer-maintenance-smoke',
              'storage-consumer-maintenance-evidence', 'storage-consumer-maintenance-shell',
              'private-storage-maintenance-smoke', 'private-storage-maintenance-wiring',
              'storage-fixture-correlation-sampler', 'storage-provider-activity-sampler', 'storage-consumer-network')
          counts, names = {}, []
          for suite in suites:
              raw = (root / f'python-{suite}.log').read_text()
              totals = re.findall(r'^Ran ([0-9]+) tests? in [0-9.]+s$', raw, re.M)
              passed = re.findall(r'^(test_\S+) \(([^\n]+)\) \.\.\. ok$', raw, re.M)
              assert len(totals) == 1 and 1 <= int(totals[0]) <= 512, suite
              assert len(passed) == int(totals[0]), suite
              assert re.findall(r'^OK(?: .*)?$', raw, re.M) == ['OK'], suite
              assert not re.search(r'\bskipped\b|^FAILED', raw, re.M), suite
              counts[suite] = len(passed)
              names.extend(suite + ':' + scope + ':' + name for name, scope in passed)
          assert len(names) == len(set(names))
          assert counts['storage-fixture-correlation-sampler'] == 33
          node = (root / 'node-consumer.log').read_text()
          node_names = re.findall(r'^ok [0-9]+ - ([^\n]+)$', node, re.M)
          node_totals = re.findall(r'^# tests ([0-9]+)$', node, re.M)
          assert len(node_totals) == 1 and 1 <= int(node_totals[0]) <= 512
          assert len(node_names) == len(set(node_names)) == int(node_totals[0])
          assert re.findall(r'^# pass ([0-9]+)$', node, re.M) == node_totals
          for field in ('fail', 'cancelled', 'skipped', 'todo'):
              assert re.findall(r'^# ' + field + r' ([0-9]+)$', node, re.M) == ['0']
          (root / 'harness-tests.json').write_text(json.dumps(dict(version=1, python_counts=counts,
              python_unique_tests=len(names), python_test_names=sorted(names),
              node_unique_tests=len(node_names), node_test_names=sorted(node_names),
              live_consumer_acceptance=False, real_datapath_execution=False), sort_keys=True) + '\n')
          PY
      - name: Compile affected agent local control and CLI tests
        id: build
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo test --locked --offline -p volparossa-agent -p volparossa-local-control -p volparossa --no-run --message-format=json \
            > storage-retirement-evidence/build.jsonl 2> storage-retirement-evidence/build.log
          python3 -B - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('storage-retirement-evidence')
          records = [json.loads(line) for line in (root / 'build.jsonl').read_text().splitlines()]
          executables = [row['executable'] for row in records if row.get('reason') == 'compiler-artifact'
              and row.get('target', {}).get('name') == 'volparossa_agent'
              and row.get('profile', {}).get('test') and row.get('executable')]
          assert len(executables) == 1
          binary = pathlib.Path(executables[0]).resolve(strict=True)
          assert binary.is_file() and binary.is_relative_to(pathlib.Path.cwd() / 'target')
          tests = (
              'content::tls::tests::kernel_close::signed_reserve_survives_tcp_provider_and_proxy_drop_before_outer_finish',
              'content::tls::tests::kernel_close::signed_reserve_rejects_abrupt_outer_drop_after_inner_finish',
              'content::tls::tests::kernel_close::repeated_egress::three_signed_reserves_use_reusable_production_egress_and_fragmented_hello',
          )
          for index, name in enumerate(tests):
              inventory = subprocess.check_output([str(binary), '--ignored', '--exact', name, '--list'], text=True)
              assert inventory.splitlines() == [name + ': test', '', '1 test, 0 benchmarks']
              (root / f'kernel-{index}-inventory.log').write_text(inventory)
          (root / 'kernel-tests.json').write_text(json.dumps(tests) + '\n')
          (root / 'binary.txt').write_text(str(binary) + '\n')
          PY
      - name: Inventory and execute disjoint retirement contracts
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          group() {
            local label="$1" filter="$2"
            timeout --kill-after=5s 180s cargo test --locked --offline -p volparossa-agent --lib "$filter" -- --list \
              2>&1 | tee "storage-retirement-evidence/$label-inventory.log"
            timeout --kill-after=5s 180s cargo test --locked --offline -p volparossa-agent --lib "$filter" \
              2>&1 | tee "storage-retirement-evidence/$label-test.log"
          }
          group new lost_helper_retirement_
          group admission tcp_flow_admission_
          group disconnect route_setup::tests::client_disconnect_
          group expiry route_setup::tests::client_route_expiry_
          group classification route_setup::tests::mptcp_acquire_
          python3 -B - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('storage-retirement-evidence')
          counts, all_names = {}, []
          for label in ('new', 'admission', 'disconnect', 'expiry', 'classification'):
              inventory = (root / (label + '-inventory.log')).read_text()
              output = (root / (label + '-test.log')).read_text()
              names = re.findall(r'^([^\n]+): test$', inventory, re.M)
              assert 1 <= len(names) <= 512 and len(names) == len(set(names)), label
              results = re.findall(r'^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; \d+ filtered out;', output, re.M)
              assert results == [str(len(names))], label
              for name in names:
                  assert len(re.findall(r'^test ' + re.escape(name) + r' \.\.\. ok$', output, re.M)) == 1
              counts[label] = len(names)
              all_names.extend(names)
          assert counts == dict(new=7, admission=8, disconnect=3, expiry=2, classification=1)
          assert len(all_names) == 21
          assert len(all_names) == len(set(all_names))
          (root / 'rust-tests.json').write_text(json.dumps(dict(version=1, counts=counts,
              unique_tests=len(all_names), test_names=sorted(all_names), live_consumer_acceptance=False,
              real_datapath_execution=False, original_timeout_cause_proven=False), sort_keys=True) + '\n')
          PY
      - name: Inventory and execute new closed TLS v9 contracts across all three layers
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          group() {
            local label="$1" package="$2"
            shift 2
            timeout --kill-after=5s 180s cargo test --locked --offline -p "$package" "$@" tls_close_v9_ -- --list \
              2>&1 | tee "storage-retirement-evidence/v9-$label-inventory.log"
            timeout --kill-after=5s 180s cargo test --locked --offline -p "$package" "$@" tls_close_v9_ \
              2>&1 | tee "storage-retirement-evidence/v9-$label-test.log"
          }
          group local-control volparossa-local-control --lib
          group agent volparossa-agent --lib
          group cli volparossa --bin volparossa
          python3 -B - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('storage-retirement-evidence')
          counts, all_names = {}, []
          for label, expected in (('local-control', 4), ('agent', 10), ('cli', 10)):
              inventory = (root / f'v9-{label}-inventory.log').read_text()
              output = (root / f'v9-{label}-test.log').read_text()
              names = re.findall(r'^([^\n]+): test$', inventory, re.M)
              assert len(names) == len(set(names)) == expected, label
              results = re.findall(r'^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; \d+ filtered out;', output, re.M)
              assert results == [str(expected)], label
              for name in names:
                  assert len(re.findall(r'^test ' + re.escape(name) + r' \.\.\. ok$', output, re.M)) == 1
              counts[label] = expected
              all_names.extend(names)
          previous = json.loads((root / 'rust-tests.json').read_text())['test_names']
          assert len(all_names) == len(set(all_names)) == 24
          assert not set(all_names).intersection(previous)
          (root / 'tls-v9-tests.json').write_text(json.dumps(dict(version=1, counts=counts,
              unique_tests=24, test_names=sorted(all_names), previous_contracts=21,
              total_disjoint_contracts=45, live_consumer_acceptance=False,
              original_timeout_cause_proven=False), sort_keys=True) + '\n')
          PY
      - name: Inventory and execute fixture v2 and unchanged acquisition contracts
        run: |
          set -euo pipefail
          export RUST_BACKTRACE=1
          group() {
            local label="$1" package="$2" filter="$3"
            local -a target=(--lib)
            if test "$package" = volparossa; then target=(--bin volparossa); fi
            timeout --kill-after=5s 180s cargo test --locked --offline -p "$package" "${target[@]}" "$filter" -- --list \
              2>&1 | tee "storage-retirement-evidence/fixture-$label-inventory.log"
            timeout --kill-after=5s 180s cargo test --locked --offline -p "$package" "${target[@]}" "$filter" \
              2>&1 | tee "storage-retirement-evidence/fixture-$label-test.log"
          }
          group wire volparossa-local-control fixture_correlation::
          group bank volparossa-agent fixture_correlation::
          group observer volparossa-agent content::private_storage::observation::fixture_correlation_tests::
          group cli volparossa content::fixture_correlation::
          group helper volparossa-agent helper::tests::fixture_acquire_
          group helper-legacy volparossa-agent helper::tests::acquire_transport_
          group acquire volparossa-agent mptcp_transport::acquire_diagnostic::tests::
          group retirement volparossa-agent mptcp_transport::retirement::tests::
          group retirement-diagnostic volparossa-agent mptcp_transport::retirement::diagnostic_tests::
          group content-stream volparossa-agent route_setup::content_stream::tests::
          group projection volparossa-agent content::private_storage::observation::flow_acquire::tests::
          python3 -B - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('storage-retirement-evidence')
          groups = {'wire': ('volparossa-local-control', 12), 'bank': ('volparossa-agent', 33),
              'observer': ('volparossa-agent', 7), 'cli': ('volparossa', 10),
              'helper': ('volparossa-agent', 4), 'helper-legacy': ('volparossa-agent', 3),
              'acquire': ('volparossa-agent', 7), 'retirement': ('volparossa-agent', 7),
              'retirement-diagnostic': ('volparossa-agent', 4),
              'content-stream': ('volparossa-agent', 6),
              'projection': ('volparossa-agent', 7)}
          all_names, counts = [], {}
          prior = set(json.loads((root / 'rust-tests.json').read_text())['test_names'])
          prior.update(json.loads((root / 'tls-v9-tests.json').read_text())['test_names'])
          for label, (package, expected) in groups.items():
              inventory = (root / f'fixture-{label}-inventory.log').read_text()
              output = (root / f'fixture-{label}-test.log').read_text()
              names = re.findall(r'^([^\n]+): test$', inventory, re.M)
              assert len(names) == len(set(names)) == expected, label
              assert re.findall(r'^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; \d+ filtered out;', output, re.M) == [str(expected)], label
              for name in names:
                  assert len(re.findall(r'^test ' + re.escape(name) + r' \.\.\. ok$', output, re.M)) == 1
              assert not set(names).intersection(prior), label
              counts[label] = expected
              all_names.extend(package + ':' + name for name in names)
          assert len(all_names) == len(set(all_names)) == 100
          (root / 'fixture-v2-tests.json').write_text(json.dumps(dict(version=1, counts=counts,
              unique_tests=100, test_names=sorted(all_names), previous_contracts=45,
              total_disjoint_contracts=145, fixture_version=2, legacy_fixture_version=1,
              causal_attribution=False, fragment_copy_binding=False,
              live_consumer_acceptance=False), sort_keys=True) + '\n')
          PY
      - name: Check firewall snapshot normalization before the isolated test
        run: |
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          def normalize(text):
              return subprocess.check_output(['awk', os.environ['FIREWALL_NORMALIZER']],
                  input=text.encode(), env={**os.environ, 'LC_ALL': 'C'})
          checked = 0
          for program in ['iptables-save', 'ip6tables-save']:
              for backend in ['', ' (nf_tables)']:
                  before = (f'# Generated by {program} v1.8.10{backend} on Thu Oct 15 10:10:10 2026\n'
                      '*filter\n:INPUT ACCEPT [1:2]\n:custom-chain - [3:4]\n'
                      '-A INPUT -m comment --comment "semantic [1:2]" -j custom-chain\n'
                      'COMMIT\n# Completed on Thu Oct 15 10:10:10 2026\n')
                  after = before.replace('10:10:10', '11:11:11').replace('ACCEPT [1:2]',
                      'ACCEPT [99:100]').replace('- [3:4]', '- [101:102]')
                  assert normalize(before) == normalize(after)
                  checked += 1
                  for old, new in [('ACCEPT', 'DROP'), ('custom-chain', 'other-chain'),
                      ('semantic [1:2]', 'semantic [9:10]'), ('*filter', '*nat'),
                      ('v1.8.10', 'v1.8.11'), ('COMMIT\n', ''),
                      ('v1.8.10' + backend, 'v1.8.10 (legacy)'),
                      ('10:10:10', 'unrecognized-timestamp')]:
                      assert normalize(before) != normalize(before.replace(old, new))
                      checked += 1
                  for embedded in ['# Completed on Thu Oct 15 10:10:10 2026',
                      ':INPUT ACCEPT [1:2]', f'# Generated by {program} v1.8.10{backend} on Thu Oct 15 10:10:10 2026']:
                      try:
                          normalize(before.replace('semantic [1:2]', 'first\n' + embedded + '\nlast'))
                      except subprocess.CalledProcessError:
                          pass
                      else:
                          raise AssertionError('multiline rule must fail closed')
                      checked += 1
          assert checked == 48
          pathlib.Path('storage-retirement-evidence/firewall-normalizer.json').write_text(
              json.dumps(dict(checks=checked, passed=True, scope='inert-normalizer-fixtures'), sort_keys=True) + '\n')
          PY
      - name: Run exact TLS close and production egress contracts in disposable namespaces
        run: |
          set -euo pipefail
          parent_namespace=$(readlink /proc/self/ns/net)
          printf '%s\n' "$parent_namespace" > storage-retirement-evidence/parent-netns.txt
          {
            ip -4 -j route show table all | sha256sum
            ip -6 -j route show table all | sha256sum
            sha256sum /etc/resolv.conf
            sudo -n env LC_ALL=C iptables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
            sudo -n env LC_ALL=C ip6tables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
          } > storage-retirement-evidence/host-before.sha256
          read -r binary < storage-retirement-evidence/binary.txt
          mapfile -t kernel_tests < <(python3 -B -c 'import json; print(*json.load(open("storage-retirement-evidence/kernel-tests.json")), sep="\n")')
          test "${#kernel_tests[@]}" = 3
          kernel_status=0
          for index in 0 1 2; do
            test_name=${kernel_tests[$index]}
            network=loopback
            if test "$index" = 2; then network=content-egress; fi
            set +e
            VOLPAROSSA_TEST_ALLOW_SUDO_NETNS=1 scripts/run-isolated-test.sh --command \
              "$binary" "$test_name" VOLPAROSSA_EXACT_CONTENT_PARENT_NETNS "$network" \
              --ignored --exact "$test_name" --nocapture \
              2>&1 | tee "storage-retirement-evidence/kernel-$index-test.log"
            status=$?
            set -e
            printf '%s\n' "$status" > "storage-retirement-evidence/kernel-$index-exit.txt"
            if test "$status" != 0; then kernel_status=1; fi
          done
          test "$(readlink /proc/self/ns/net)" = "$parent_namespace"
          python3 -B - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('storage-retirement-evidence')
          tests = json.loads((root / 'kernel-tests.json').read_text())
          assert len(tests) == len(set(tests)) == 3
          for index, name in enumerate(tests):
              assert (root / f'kernel-{index}-exit.txt').read_text().strip() == '0'
              output = (root / f'kernel-{index}-test.log').read_text()
              summaries = [line for line in output.splitlines() if line.startswith('test result:')]
              assert len(summaries) == 1
              assert re.fullmatch(r'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s', summaries[0])
              assert re.findall(r'^test (.+) \.\.\. ok$', output, re.M) == [name]
          (root / 'kernel-results.json').write_text(json.dumps(dict(version=1,
              unique_tests=3, test_names=tests, passed=True,
              genuine_loopback_kernel_mptcp=True, real_loopback_tcp_provider=True,
              production_nested_tls_and_proxy=True, signed_reserve_receipt_verified=True,
              normal_close_after_peer_drop=True, abrupt_outer_close_rejected=True,
              repeated_production_egress=True, signed_reserve_exchanges=3,
              real_synthetic_dns_tcp=True, production_sni_prefix_inspection=True,
              public_fixture_address_only_in_disposable_namespace=True,
              full_relay_datapath_proven=False, multiple_live_subflows_proven=False,
              live_consumer_acceptance=False, original_timeout_cause_proven=False), sort_keys=True) + '\n')
          PY
          exit "$kernel_status"
      - name: Lint affected agent local control and CLI
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo clippy --locked --offline -p volparossa-agent -p volparossa-local-control -p volparossa --all-targets --all-features -- -D warnings \
            2>&1 | tee storage-retirement-evidence/clippy.log
      - name: Check formatting without changing source
        if: ${{ always() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo fmt --all -- --check 2>&1 | tee storage-retirement-evidence/format.log
      - name: Verify host network configuration after isolated tests
        if: always()
        run: |
          set -euo pipefail
          if test -f storage-retirement-evidence/host-before.sha256; then
            read -r parent_namespace < storage-retirement-evidence/parent-netns.txt
            test "$(readlink /proc/self/ns/net)" = "$parent_namespace"
            {
              ip -4 -j route show table all | sha256sum
              ip -6 -j route show table all | sha256sum
              sha256sum /etc/resolv.conf
              sudo -n env LC_ALL=C iptables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
              sudo -n env LC_ALL=C ip6tables-save | awk "$FIREWALL_NORMALIZER" | sha256sum
            } > storage-retirement-evidence/host-after.sha256
            cmp storage-retirement-evidence/host-before.sha256 storage-retirement-evidence/host-after.sha256
          fi
      - name: Preserve original source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD
      - name: Retain original source and bounded test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: storage-route-retirement-${{ github.run_id }}
          path: storage-retirement-evidence/
          if-no-files-found: warn
          retention-days: 14

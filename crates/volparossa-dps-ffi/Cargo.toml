[package]
name = "volparossa-dps-ffi"
description = "Bounded quality-only native interface to the shared DPS assessor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
prost.workspace = true
volparossa-local-control = { path = "../volparossa-local-control", version = "=0.1.0" }

# Mirror workspace lints exactly, except deny permits the one ffi module's
# documented unsafe boundary. The existing workspace forbid remains unchanged.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
alloc_instead_of_core = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace]
resolver = "2"
members = ["crates/*"]
exclude = [
  "third_party/rust/vendor/hickory-proto-0.25.2",
  "third_party/rust/vendor/time-0.3.41",
]

[patch.crates-io]
hickory-proto = { path = "third_party/rust/vendor/hickory-proto-0.25.2" }
time = { path = "third_party/rust/vendor/time-0.3.41" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["VOLPAROSSA contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/VOLPAROSSA/volparossa"

[workspace.dependencies]
anyhow = "1.0.98"
argon2 = "0.5.3"
async-trait = "0.1.88"
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bitflags = { version = "2.9.1", features = ["serde"] }
blake3 = "1.8.2"
bytes = { version = "1.10.1", features = ["serde"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5.40", features = ["derive", "env", "unicode", "wrap_help"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.1.1", features = ["digest", "pkcs8", "rand_core", "serde", "zeroize"] }
fs2 = "0.4.3"
futures = "0.3.31"
hex = { version = "0.4.3", features = ["serde"] }
hkdf = "0.12.4"
http = "1.3.1"
ipnet = { version = "2.11.0", features = ["serde"] }
libc = "0.2.172"
libp2p = { version = "0.56.0", default-features = false, features = ["autonat", "cbor", "dcutr", "dns", "identify", "kad", "macros", "mdns", "noise", "ping", "quic", "relay", "request-response", "serde", "tcp", "tokio", "yamux"] }
libp2p-identity = { version = "0.2.12", default-features = false, features = ["ed25519", "peerid", "rand"] }
lru = "0.14.0"
netlink-sys = "0.8.7"
nix = { version = "0.30.1", default-features = false, features = ["fs", "net", "poll", "process", "signal", "socket", "user"] }
parking_lot = "0.12.4"
percent-encoding = "2.3.1"
prost = "0.14.1"
prost-build = "0.14.1"
quinn = { version = "0.11.8", default-features = false, features = ["log", "platform-verifier", "ring", "runtime-tokio", "rustls"] }
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = { version = "0.13.2", default-features = false, features = ["crypto", "pem", "ring"] }
rtnetlink = "0.17.0"
rustix = { version = "=1.1.4", features = ["fs", "process", "thread"] }
rusqlite = { version = "0.32.1", features = ["bundled", "chrono", "limits", "modern_sqlite", "trace", "uuid"] }
rustls = { version = "0.23.27", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pki-types = "1.12.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
socket2 = { version = "0.6.0", features = ["all"] }
subtle = "2.6.1"
tempfile = "3.20.0"
thiserror = "2.0.12"
time = { version = "=0.3.41", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.45.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.2"
tower = { version = "0.5.2", features = ["limit", "timeout", "util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json", "registry"] }
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.16.0", features = ["serde", "v4", "v7"] }
wireguard-uapi = "3.0.1"
x25519-dalek = { version = "2.0.1", features = ["getrandom", "reusable_secrets", "serde", "static_secrets"] }
zeroize = { version = "1.8.1", features = ["derive", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
alloc_instead_of_core = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "debuginfo"

[profile.dev]
debug = 1

[profile.test]
debug = 1

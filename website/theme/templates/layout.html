<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#1c1516">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{social_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{social_alt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{social_image}}">
  <meta name="twitter:image:alt" content="{{social_alt}}">
  <link rel="icon" href="{{root}}assets/favicon.png" type="image/png">
  <link rel="preload" href="{{root}}assets/fonts/cormorant-garamond-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{root}}assets/site.css">
  <script src="{{root}}assets/site.js" defer></script>
  {{head_extra}}
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{header}}
  <main id="main" tabindex="-1">{{content}}</main>
  {{footer}}
</body>
</html>

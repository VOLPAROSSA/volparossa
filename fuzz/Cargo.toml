[package]
name = "volparossa-fuzz"
version = "0.0.0"
publish = false
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Direct, featureless constraints make this standalone resolver select the
# reviewed path patches below.
hickory-proto = { version = "=0.25.2", default-features = false }
time = { version = "=0.3.41", default-features = false }
# multibase 0.9.3 pulls in base45 3.2.0, whose Rust API exceeds the
# pinned Rust 1.85.
multibase = { version = "=0.9.2", default-features = false }

ed25519-dalek = "2.1.1"
libfuzzer-sys = "0.4"
prost = "0.14.1"
volparossa-discovery = { path = "../crates/volparossa-discovery", version = "0.1.0" }
volparossa-inspection = { path = "../crates/volparossa-inspection", version = "0.1.0" }
volparossa-policy = { path = "../crates/volparossa-policy", version = "0.1.0" }
volparossa-protocol = { path = "../crates/volparossa-protocol", version = "0.1.0" }
volparossa-quic = { path = "../crates/volparossa-quic", version = "0.1.0" }

[workspace]
members = ["."]
resolver = "3"

[patch.crates-io]
hickory-proto = { path = "../third_party/rust/vendor/hickory-proto-0.25.2" }
libp2p-yamux = { path = "../third_party/rust/vendor/libp2p-yamux-0.47.0" }
time = { path = "../third_party/rust/vendor/time-0.3.41" }

[[bin]]
name = "node_advertisement"
path = "fuzz_targets/node_advertisement.rs"
test = false
doc = false
bench = false

